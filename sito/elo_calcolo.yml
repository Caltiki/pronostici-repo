name: Elo - calcolo e prova

# L'ELO DELLE SQUADRE, calcolato sullo storico del ramo "elo-storico".
# Lo script e' elo_calcolo.py: il perche' di ogni scelta e' scritto in cima
# a quel file.
#
# Per ora SOLO A MANO (Actions -> "Elo - calcolo e prova" -> Run workflow):
# serve a vedere se l'Elo regge, prima di metterlo nel giro di tutti i
# giorni. Il riepilogo del run dice quanto sbaglia sulle partite dal luglio
# 2023, che il calcolo non ha usato per scegliere i parametri.
#
# I risultati vanno nella cartella elo/ dello stesso ramo privato:
#   rating_attuali.csv          rating di ogni squadra oggi
#   previsioni_<anno>.csv.gz    previsione pre-partita di ogni partita dal 2018
#   parametri.json              parametri scelti e misure della prova
#
# Non tocca API-Football: legge solo file gia' scaricati.
#
# E PUBBLICA PER IL SITO (12/11): elo_pubblica.py scrive elo_rating.json
# (rating delle squadre attive) ed elo_info.json (parametri e prova), che
# l'ultimo passo copia su gh-data. Solo quei due file: lo storico e le
# previsioni restano sul ramo privato. Serve il secret TOKEN_REPO_DATI,
# lo stesso degli altri workflow.
on:
  workflow_dispatch:

concurrency:
  group: elo-storico
  cancel-in-progress: false

jobs:
  calcolo:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RAMO: elo-storico
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install numpy scipy

      - name: Prendi lo storico
        id: clone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          rm -rf storico
          if ! git ls-remote --exit-code --heads "$URL" "$RAMO" >/dev/null 2>&1; then
            echo "::error::Il ramo ${RAMO} non esiste: prima va scaricato lo storico."
            exit 1
          fi
          git clone -q --branch "$RAMO" --depth 1 "$URL" storico
          N=$(ls storico/partite 2>/dev/null | wc -l || true)
          echo "File di lega nello storico: ${N:-0}"

      - name: Calcola l'Elo
        id: calcola
        timeout-minutes: 30
        run: python elo_calcolo.py --storico storico --out storico/elo

      - name: Prepara i file per il sito
        id: pubblica
        if: steps.calcola.outcome == 'success'
        run: python elo_pubblica.py --elo storico/elo --out pubblica

      - name: Salva sul ramo elo-storico
        if: steps.calcola.outcome == 'success'
        run: |
          set -uo pipefail
          cd storico
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A elo
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -q -m "Elo $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q origin "HEAD:${RAMO}"
          echo "Salvato in elo/ sul ramo ${RAMO}."

      - name: Pubblica l'Elo sul repository pubblico
        if: steps.pubblica.outcome == 'success'
        env:
          TOKEN_DATI: ${{ secrets.TOKEN_REPO_DATI }}
          REPO_DATI: Caltiki/pronostici-repo
          BRANCH_DATI: gh-data
        run: |
          set -uo pipefail
          if [ -z "${TOKEN_DATI:-}" ]; then
            echo "::error::Secret TOKEN_REPO_DATI assente: l'Elo non va sul sito."
            exit 1
          fi
          URL="https://x-access-token:${TOKEN_DATI}@github.com/${REPO_DATI}"
          rm -rf ghdata
          git clone -q --branch "${BRANCH_DATI}" --depth 1 "$URL" ghdata
          cp pubblica/elo_rating.json pubblica/elo_info.json ghdata/
          cd ghdata
          git config user.name "caltiki-bot"
          git config user.email "caltiki-bot@users.noreply.github.com"
          git add elo_rating.json elo_info.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
            exit 0
          fi
          git commit -q -m "Update elo $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull -q --rebase origin "${BRANCH_DATI}" && git push -q origin "HEAD:${BRANCH_DATI}" && { echo "Pubblicato."; exit 0; }
            echo "push non riuscito, riprovo fra 15 secondi ($i/3)"
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "::error::Push su ${BRANCH_DATI} non riuscito dopo tre tentativi."
          exit 1

<!--
  IL SITO LEGGE GLI STESSI FILE DELL'ADDON KODI, E NON NE CALCOLA DI NUOVI.

  Tutti i numeri arrivano gia' fatti dal branch gh-data, letto da
  raw.githubusercontent.com (pubblico, CORS aperto, cache di 5 minuti).
  Qui si filtra e si mostra, niente di piu': la schedina e' il campo
  "InSchedina" scritto da scelta_schedina() in prezzi_equi.py, lo scarto
  dal mercato e' il campo "Scarto" del consensus medio, il verdetto contro
  il mercato viene dalla t gia' calcolata. Se una regola vivesse anche qui,
  sito e Kodi finirebbero per mostrare cose diverse senza che si capisca
  perche' - e' gia' successo una volta fra Kodi e Telegram.

  L'unico conto fatto in pagina e' la multipla che compone chi legge:
  prodotto delle quote eque e stima della quota pagata col margine di
  ciascuna partita. E' aritmetica, non una regola del sistema.

  Le etichette e le frasi di spiegazione sono quelle dell'addon 1.18.1:
  le due interfacce devono dire la stessa cosa con le stesse parole.

  LA SCHEDA DELLA PARTITA (scheda_<data>.json) e' scritta da
  scheda_partite.py: e' li' che le quindici fonti vengono unite partita per
  partita. Qui ogni riga cerca se stessa nella tabella "alias" per nome
  esatto, e basta.

  Questa pagina sta in sito/ e NON nella radice: l'index.html della radice
  lo legge Kodi per trovare repository.pronostici.zip.
-->

<style>
  :root {
    --sfondo: #f7f6f3;
    --testo: #1a1917;
    --tenue: #6b6760;
    --bordo: #e5e1da;
    --scheda: #ffffff;
    --evidenza: #b3542a;
    --evidenza-tenue: #f8ebe3;
    --buono: #2a7a4b;
    --buono-tenue: #e4f3ea;
    --attento: #b56a12;
    --attento-tenue: #f8edd9;
    --male: #b53636;
    --ombra: 0 1px 3px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.03);
    --ombra-hover: 0 2px 8px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05);
    --raggio: 12px;
    --raggio-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sfondo: #131217;
      --testo: #f2f0eb;
      --tenue: #9c9891;
      --bordo: #2a2830;
      --scheda: #1c1b22;
      --evidenza: #e08b5c;
      --evidenza-tenue: #3a2a22;
      --buono: #5fbf84;
      --buono-tenue: #1a2e22;
      --attento: #e0a35c;
      --attento-tenue: #3a2e1e;
      --male: #e57878;
      --ombra: 0 1px 3px rgba(0,0,0,.2);
      --ombra-hover: 0 4px 16px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --sfondo: #131217; --testo: #f2f0eb; --tenue: #9c9891; --bordo: #2a2830;
    --scheda: #1c1b22; --evidenza: #e08b5c; --evidenza-tenue: #3a2a22;
    --buono: #5fbf84; --buono-tenue: #1a2e22; --attento: #e0a35c;
    --attento-tenue: #3a2e1e; --male: #e57878;
    --ombra: 0 1px 3px rgba(0,0,0,.2);
    --ombra-hover: 0 4px 16px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { margin: 0 auto; }
  button, input, select { font: inherit; color: inherit; }

  /* Testata */
  .testa .marchio { display: flex; align-items: center; }
  .testa .marchio img { flex: none;
  }
  header.testa h1 { margin: 0;
  }
  header.testa p {
    margin: 3px 0 0; color: var(--tenue);
  }

  /* Sezioni: sticky */
  nav.sezioni {
    position: sticky; z-index: 5;
    background: color-mix(in srgb, var(--sfondo) 92%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    border-bottom: 1px solid var(--bordo);
  }
  nav.sezioni button {
    flex: 1 1 auto; min-width: 0;
    cursor: pointer;
    white-space: nowrap;
    transition: all .18s ease;
  }
  /* Con cinque voci la barra va stretta: le sezioni cedono spazio e
     scorciano il testo prima di spingere fuori la casa. */
  /* Con sei voci, sugli schermi piu' stretti la barra scorre di lato
     invece di troncare i nomi: una voce tagliata non si legge, una che
     sta fuori si raggiunge col dito. Dai 360 px in su ci stanno tutte. */
  nav.sezioni { overflow-x: auto; scrollbar-width: none; }
  nav.sezioni::-webkit-scrollbar { display: none; }
  nav.sezioni button[data-sez] { flex: 1 0 auto; }
  nav.sezioni button.casa {
    flex: none; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  nav.sezioni button.casa svg { width: 18px; height: 18px; }
  /* "Consenso fonti" sta su due righe: su una sola la barra sforava
     fino ai 390 px e "Fonti" restava mezza fuori. Stessa altezza degli
     altri pulsanti, che sono allineati sull'altezza piu' grande. */
  nav.sezioni button.due {
    line-height: 1.05; padding-top: 4px; padding-bottom: 4px;
    font-size: clamp(.66rem, 3vw, .8rem);
  }
  .riga .spunta.vuota { cursor: default; }
  /* Presa / sbagliata: colore di stato PIU' simbolo e parola nel title,
     mai il colore da solo. */
  .pron-lista { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .esito-pill {
    font-size: .72rem; line-height: 1.2; padding: 3px 7px; border-radius: 999px;
    border: 1px solid var(--bordo); color: var(--tenue); white-space: nowrap;
  }
  .esito-pill b { font-weight: 700; }
  .esito-pill.presa { background: var(--buono-tenue); color: var(--buono); border-color: transparent; }
  .esito-pill.sbagliata { background: color-mix(in srgb, var(--male) 12%, transparent); color: var(--male); border-color: transparent; }
  .riga .dettaglio a { color: var(--evidenza); font-weight: 500; }
  .testa a.marchio { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  .testa a.marchio:active { opacity: .7; }
  nav.sezioni button[aria-current="true"] {
    font-weight: 600;
    box-shadow: 0 2px 8px color-mix(in srgb, var(--evidenza) 35%, transparent);
  }

  /* Chips orizzontali */
  .chips {
    display: flex;
    overflow-x: auto; scrollbar-width: none; padding-left: 16px; padding-right: 16px;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    flex: none;
    border: 1px solid var(--bordo);
    cursor: pointer;
    transition: all .15s ease;
  }
  .chips button:hover {
    border-color: color-mix(in srgb, var(--evidenza) 50%, var(--bordo));
  }
  .chips button[aria-pressed="true"] {
    font-weight: 600;
  }
  .descr { margin: 12px 0 0;
    line-height: 1.45;
  }

  /* Strumenti */
  .strumenti {
    display: flex; align-items: center;
  }
  .strumenti input[type="search"] {
    flex: 1; min-width: 0;
    border: 1px solid var(--bordo); background: var(--scheda);
    border-radius: var(--raggio-sm); font-size: .9rem;
    transition: border-color .15s;
  }
  .strumenti input[type="search"]:focus {
    outline: none;
  }
  .strumenti select {
    border: 1px solid var(--bordo); background: var(--scheda); color: var(--testo);
    border-radius: var(--raggio-sm); padding: 9px 8px; font-size: .85rem;
    cursor: pointer;
  }

  /* Lista e righe */
  .lista { display: flex; flex-direction: column; }
  .riga {
    display: flex; align-items: stretch;
    background: var(--scheda);
    border: 1px solid var(--bordo);
    box-shadow: var(--ombra);
    overflow: hidden;
    transition: box-shadow .2s ease, border-color .2s ease;
  }
  .riga .spunta {
    flex: none; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--bordo); cursor: pointer;
    background: color-mix(in srgb, var(--sfondo) 60%, var(--scheda));
  }
  .riga .spunta input {
    width: 18px; height: 18px; accent-color: var(--evidenza); cursor: pointer;
  }
  .riga details { flex: 1; min-width: 0; }
  .riga summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center;
  }
  .riga summary::-webkit-details-marker { display: none; }
  .riga .corpo { flex: 1; min-width: 0; }
  .riga .alto {
    display: flex; flex-wrap: wrap; align-items: center;
  }
  .riga .partita {
    overflow-wrap: anywhere;
  }
  .riga .numero { flex: none; text-align: right; }
  .riga .numero b {
    display: block;
    font-variant-numeric: tabular-nums; font-weight: 700;
    letter-spacing: -0.02em;
  }
  .riga .numero span { color: var(--tenue);
    font-variant-numeric: tabular-nums; font-weight: 500;
  }
  .riga .dettaglio { color: var(--tenue);
    padding-top: 12px;
  }
  .riga .dettaglio p { margin: 0 0 5px; }
  .riga .dettaglio p.avviso { color: var(--attento); font-weight: 500; }

  /* Pillole */
  .pill {
    display: inline-block; line-height: 1; border-radius: 999px; font-weight: 600;
    white-space: nowrap;
  }
  .pill.stretto { background: var(--buono-tenue); color: var(--buono); }
  .pill.largo { background: var(--attento-tenue); color: var(--attento); }

  .segno {
    flex: none;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }
  .scarto { color: var(--tenue); }
  .scarto-grosso { color: var(--attento); font-weight: 600; }

  .altre {
    display: block; width: 100%; margin: 14px 0;
    padding: 12px; cursor: pointer;
    color: var(--tenue);
    transition: all .15s ease;
  }
  .altre:hover {
    border-color: var(--evidenza); color: var(--evidenza);
    background: var(--evidenza-tenue);
  }
  .vuoto, .errore {
    padding: 32px 20px; text-align: center; color: var(--tenue);
    border: 1px dashed var(--bordo); border-radius: var(--raggio);
    margin-top: 14px; font-size: .9rem;
  }
  .errore { color: var(--male); }

  /* Schede consuntivo */
  .scheda {
    background: var(--scheda); border: 1px solid var(--bordo); box-shadow: var(--ombra);
  }
  .scheda h3 {
    margin: 0 0 6px; font-weight: 700;
    letter-spacing: -0.01em;
  }
  .scheda .verdetto { margin: 0 0 10px; font-weight: 600; font-size: .92rem; }
  .scheda .verdetto.vince-mercato { color: var(--male); }
  .scheda .verdetto.rumore { color: var(--tenue); }
  .scheda .verdetto.batte { color: var(--buono); }
  .scheda p { margin: 0 0 7px; }
  .scheda .piccolo { color: var(--tenue); font-size: .82rem; }
  table.mercati {
    width: 100%; border-collapse: collapse;
    font-size: .85rem; margin: 8px 0;
  }
  table.mercati th, table.mercati td {
    text-align: right;
    border-bottom: 1px solid var(--bordo);
    font-variant-numeric: tabular-nums;
  }
  table.mercati th:first-child, table.mercati td:first-child { text-align: left; }
  table.mercati th {
    text-transform: uppercase;
  }
  table.mercati tr.pochi td { color: var(--tenue); }

  /* Colori 1-X-2 */
  :root {
    --v1: #2a78d6; --vx: #c9c5be; --v2: #eb6834;
    --v1-testo: #fff; --vx-testo: #1d1c1a; --v2-testo: #1d1c1a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --v1: #3d8eef; --vx: #6a6670; --v2: #e06a3a;
      --vx-testo: #f0eeea; --v2-testo: #16151a;
    }
  }
  :root[data-theme="dark"] {
    --v1: #3d8eef; --vx: #6a6670; --v2: #e06a3a;
    --vx-testo: #f0eeea; --v2-testo: #16151a;
  }

  /* Best picks: titolo di ogni giornata */
  .giorno-best { margin: 20px 0 6px; font-size: 1rem; }
  .giorno-best small { color: var(--tenue); font-weight: 400; }
  .best-nota { color: var(--tenue); font-size: .82rem; margin: 4px 2px 8px; }
  .lista ~ .giorno-best, #best-giorni .giorno-best { margin-top: 20px; }

  /* Riepilogo tre numeri */
  .riepilogo {
    display: grid; grid-template-columns: repeat(3, 1fr);
  }
  .riepilogo div {
    background: var(--scheda); border: 1px solid var(--bordo); min-width: 0;
    box-shadow: var(--ombra);
  }
  .riepilogo b {
    display: block;
    font-variant-numeric: tabular-nums;
    font-weight: 700; letter-spacing: -0.02em;
  }
  .riepilogo span {
    display: block;
    line-height: 1.3;
  }

  /* Barra probabilità selezione */
  .pbar {
    position: relative; border-radius: 2px;
    margin-top: 8px;
  }
  .pbar i {
    display: block; height: 100%; background: var(--evidenza);
    border-radius: 2px; transition: width .3s ease;
  }
  /* LA TACCA DEL 60%. Segna la soglia senza giudicarla: un colore
     diverso sopra il 60% direbbe "questa conviene", e non e' vero - nei
     prezzi equi il valore atteso e' lo stesso su ogni riga, e nelle
     fonti la doppia chance supera il 60% proprio perche' paga meno.
     Sporge sopra e sotto la barra, con un anello del colore della
     scheda, cosi' si vede sia sul pieno sia sul vuoto. */
  .pbar::after, .hb .t::after {
    content: ""; position: absolute; left: 60%;
    width: 2px; margin-left: -1px; border-radius: 1px;
    background: var(--testo); box-shadow: 0 0 0 1px var(--scheda);
  }
  .pbar::after { top: -4px; bottom: -4px; }
  .hb .t::after { top: -3px; bottom: -3px; }
  .chip {
    font-size: .68rem; padding: 2px 6px;
    border: 1px solid var(--bordo); border-radius: 5px; font-weight: 500;
  }

  /* Barre 1-X-2 */
  .tripla {
    display: flex; align-items: center; gap: 7px; margin-top: 7px;
  }
  .tripla .nome {
    flex: none; width: 54px; font-size: .7rem;
    color: var(--tenue); font-weight: 500;
  }
  .tripla .barre {
    flex: 1; display: flex; gap: 2px; min-width: 0;
  }
  .tripla .barre i {
    flex-basis: 0; min-width: 2px; font-style: normal;
    display: flex; align-items: center; justify-content: center; font-weight: 700; overflow: hidden;
    font-variant-numeric: tabular-nums;
  }
  .tripla .barre i:first-child { border-radius: 5px 0 0 5px; }
  .tripla .barre i:last-child { border-radius: 0 5px 5px 0; }
  .s1 { background: var(--v1); color: var(--v1-testo); }
  .sx { background: var(--vx); color: var(--vx-testo); }
  .s2 { background: var(--v2); color: var(--v2-testo); }
  .legenda {
    display: flex; gap: 14px; font-size: .76rem;
    color: var(--tenue); margin: 4px 0 10px; flex-wrap: wrap;
    font-weight: 500;
  }
  .legenda i {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 3px; margin-right: 5px; vertical-align: -1px;
  }

  /* Brier */
  .brier { margin: 10px 0 6px; }
  table.mercati tr.fonte-chiusa td { color: var(--tenue); font-weight: 400; }
  table.mercati tr.fonte-chiusa td b { font-weight: 600; }
  .brier .r {
    display: flex; align-items: center; gap: 10px;
    height: 28px; font-size: .82rem;
  }
  .brier .r span { flex: none; width: 40%; font-weight: 500; }
  .brier .pista {
    position: relative; flex: 1; height: 3px;
    background: var(--bordo); border-radius: 2px;
  }
  .brier .pista b {
    position: absolute; top: 50%; width: 13px; height: 13px;
    border-radius: 50%; transform: translate(-50%, -50%);
    background: var(--tenue); box-shadow: 0 0 0 3px var(--scheda);
  }
  .brier .r.q .pista b { background: var(--evidenza); }
  .brier .r.m .pista b { background: var(--testo); }
  .brier .r em {
    flex: none; width: 48px; text-align: right;
    font-style: normal; font-variant-numeric: tabular-nums;
    font-weight: 600;
  }

  /* Barre orizzontali */
  .hb { margin: 8px 0; font-size: .84rem; }
  .hb .hb-r {
    display: flex; justify-content: space-between;
    align-items: baseline; gap: 8px;
  }
  .hb .v {
    text-align: right; font-size: .78rem; color: var(--tenue);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .hb .v b { color: var(--testo); font-size: .88rem; font-weight: 600; }
  .hb .t {
    position: relative;
    display: block; height: 7px; margin-top: 4px;
    background: var(--bordo); border-radius: 4px;
  }
  .hb .t i {
    display: block; height: 100%; background: var(--evidenza);
    border-radius: 4px; transition: width .3s ease;
  }
  .hb.c1 .t i { background: var(--v1); }
  .hb.c2 .t i { background: var(--v2); }
  .hb.pochi .n, .hb.pochi .v { color: var(--tenue); }
  .scheda .sotto-titolo {
    margin: 14px 0 4px; font-size: .82rem; font-weight: 600;
    color: var(--testo);
  }

  /* Multipla fissa */
  .multipla {
    position: fixed; z-index: 10;
    background: color-mix(in srgb, var(--scheda) 95%, transparent);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--bordo);
  }
  .multipla[hidden] { display: none; }
  .multipla .dentro { margin: 0 auto; }
  .multipla .riga1 {
    display: flex; justify-content: space-between; gap: 10px;
  }
  .multipla .riga1 b { font-variant-numeric: tabular-nums;
    font-weight: 700; letter-spacing: -0.02em;
  }
  .multipla p {
    margin: 3px 0 0; font-size: .8rem; color: var(--tenue);
  }
  .multipla p.avviso { color: var(--attento); font-weight: 500; }
  .multipla button {
    border: 1px solid var(--bordo); background: transparent; padding: 5px 12px; cursor: pointer;
    transition: all .15s ease;
  }
  .multipla button:hover {
    border-color: var(--evidenza); color: var(--evidenza);
    background: var(--evidenza-tenue);
  }

  footer {
    line-height: 1.5; text-align: center;
  }
  footer a { color: var(--evidenza); }

  /* Animazione leggera all'apertura dettagli */
  details[open] .dettaglio {
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  /* Scheda della partita */
  .riga .dettaglio p.aggancio { margin: 8px 0 0; }
  .riga .dettaglio p.aggancio:empty { display: none; }
  a.apri-scheda {
    display: inline-block;
    text-decoration: none; font-weight: 600;
  }
  .testa-partita h2 { margin: 2px 0 6px; font-size: 1.3rem; letter-spacing: -0.02em; line-height: 1.25; }
  .indietro {
    border: 1px solid var(--bordo); background: var(--scheda); border-radius: 999px;
    padding: 5px 12px; font-size: .82rem; cursor: pointer; margin-bottom: 10px; color: var(--tenue);
  }
  .punteggio { font-size: .95rem; }
  .punteggio b { font-size: 1.2rem; margin-right: 4px; }
  .forme { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .forme div { min-width: 0; }
  .forme span { display: block; font-size: .76rem; color: var(--tenue); margin-bottom: 3px; }
  .forme i[title] { cursor: pointer; }
  .forme i {
    display: inline-flex; width: 20px; height: 20px; margin-right: 3px; border-radius: 5px;
    align-items: center; justify-content: center; font-style: normal; font-size: .7rem; font-weight: 700;
  }
  .fm-p { background: color-mix(in srgb, var(--male) 14%, transparent); }
  .riga-prezzo { display: flex; align-items: center; gap: 10px; padding: 2px 4px; border-radius: var(--raggio-sm); cursor: pointer; }
  .riga-prezzo input { flex: none; width: 18px; height: 18px; accent-color: var(--evidenza); }
  .riga-prezzo .hb { flex: 1; min-width: 0; }
  .riga-prezzo.scelta { background: var(--evidenza-tenue); }
  table.mercati.pron { font-size: .82rem; }
  table.mercati.pron td, table.mercati.pron th { padding: 6px 3px; }
  table.mercati.pron th { text-transform: none; letter-spacing: 0; font-size: .74rem; }
  table.mercati.pron td:nth-child(2) { text-align: left; }
  table.mercati.pron th:nth-child(2) { text-align: left; }
  .scheda p.avviso { color: var(--attento); font-weight: 500; }
  .accordo-conta { font-size: .78rem; color: var(--tenue); margin-top: 2px; }
  .accordo-conta b { color: var(--testo); }
  .fonte-pill { color: var(--evidenza); border-color: color-mix(in srgb, var(--evidenza) 35%, transparent); }
  .strumenti #fonte-cm { flex: 1; }
  .piede-scheda { margin: 14px 2px 0; font-size: .8rem; color: var(--tenue); }
  /* TEMA SCURO FISSO (dalla v18). Blu notte, schede arrotondate con un
     filo di sfumatura, accento viola. NON blu: il blu e' il colore
     dell'"1" nelle barre 1-X-2, e un pulsante dello stesso colore
     sembrerebbe dire "1". Le regole stanno qui in fondo e vincono su
     quelle di sopra, che restano come base. */
  :root, :root:not([data-theme="zz"]), :root[data-theme="dark"] {
    --v1: #3d8eef; --vx: #5b6474; --v2: #e06a3a;
    --v1-testo: #fff; --vx-testo: #f1f5f9; --v2-testo: #16151a;
  }
  body {
    background-repeat: no-repeat;
  }
  header.testa h1 { color: #fff; }
  nav.sezioni { background: color-mix(in srgb, var(--sfondo) 85%, transparent); }
  nav.sezioni button { border-color: #26334a; }
  .riga, .scheda, .riepilogo div {
    border-radius: var(--raggio);
  }
  .strumenti input[type="search"], .strumenti select { border-color: #26334a; color: var(--testo);
  }
  .pill.medio { background: #1e293b; color: #cbd5e1; }
  .chip { border-color: #2c3a52; color: #cbd5e1; }
  table.mercati th, table.mercati td { border-bottom-color: var(--bordo); }
  .multipla { border-top-color: #26334a; }

  /* Restyling editoriale */
  :root, :root:not([data-theme="zz"]), :root[data-theme="dark"] {
    --sfondo: #080b12;
    --testo: #edf1f7;
    --tenue: #919bad;
    --bordo: rgba(255,255,255,.085);
    --scheda: #101620;
    --evidenza: #5ea8ff;
    --evidenza-forte: #a8df1d;
    --evidenza-tenue: rgba(94,168,255,.11);
    --buono: #43e09d;
    --buono-tenue: rgba(67,224,157,.12);
    --attento: #ffbd4a;
    --attento-tenue: rgba(255,189,74,.12);
    --male: #ff6b72;
    --raggio: 16px;
    --raggio-sm: 10px;
    --carta: linear-gradient(145deg, rgba(20,28,40,.98), rgba(13,18,27,.98));
  }

  .chips {

  .strumenti input[type="search"]:focus {

  .conta {

  .lista { gap: 12px; }
  .riga, .scheda, .riepilogo div {

    font-weight: 800;

  }
  table.mercati th, table.mercati td { padding: 9px 6px; }
  .pbar { height: 4px; background: rgba(255,255,255,.08); }
  .pbar i, .hb .t i { background: linear-gradient(90deg, var(--evidenza-forte), var(--evidenza)); }
  .tripla .barre { height: 21px; }
  .tripla .barre i { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: .76rem; }
  a.apri-scheda {
    padding: 8px 13px;
    border: 1px solid rgba(94,168,255,.18);
    border-radius: 8px;
    background: rgba(94,168,255,.09);
    color: var(--evidenza) !important;
    font-size: .76rem;
  }
  a.apri-scheda:hover { background: rgba(94,168,255,.15); }
  .altre {
    min-height: 46px;
    border: 1px solid rgba(255,255,255,.1);

    background: rgba(255,255,255,.025);
    font-size: .77rem;
    font-weight: 700;
  }
  .multipla {
    left: 50%;
    right: auto;
    bottom: 16px;
    width: min(calc(100% - 28px), 820px);
    padding: 15px 18px calc(15px + env(safe-area-inset-bottom));
    border: 1px solid rgba(94,168,255,.22);
    border-radius: 16px;
    background: rgba(13,18,26,.94);
    transform: translateX(-50%);
  }
  .multipla::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 4px;
    border-radius: 16px 0 0 16px;
    background: var(--evidenza);
  }
  .multipla .riga1 { align-items: center; }
  .multipla .riga1 span {
    font-size: .7rem;
    font-weight: 800;
    letter-spacing: .07em;
    text-transform: uppercase;
  }
  .multipla .riga1 b { color: var(--evidenza); font-size: 1.55rem; }
  .multipla button {
    border-color: rgba(255,255,255,.1);
    border-radius: 8px;
    color: #aab3c1;
    font-size: .7rem;
    font-weight: 700;
  }
  footer {
    margin-top: 54px;
    padding-top: 22px;
    border-top: 1px solid rgba(255,255,255,.07);
    color: #626d7e;
    font-size: .69rem;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .lista .riga, .scheda { animation: cardIn .3s ease both; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
  }
  @media (max-width: 560px) {
    main { padding-right: 16px; padding-left: 16px; }
    header.testa { padding-top: 30px; }
    header.testa::after { display: none; }
    .testa .marchio { gap: 14px; }
    .testa .marchio img { width: 58px; height: 58px; border-radius: 16px; }
    header.testa h1 { font-size: 2rem; }
    /* Sei voci devono stare tutte in vista a 390 px: con 8 px di lato
       "Statistiche fonti" finiva fuori schermo e serviva scorrere. */
    nav.sezioni { margin: 0 -8px; gap: 2px; padding: 6px; }
    nav.sezioni button { padding-right: 3px; padding-left: 3px; font-size: .7rem; }
    nav.sezioni button.casa { width: 32px; }
    .chips { margin-right: -16px; margin-left: -16px; padding-right: 16px; padding-left: 16px; }
    .strumenti { align-items: stretch; flex-wrap: wrap; }
    .strumenti input[type="search"] { flex-basis: 100%; }
    .strumenti select { flex: 1; }
    .riga summary { padding: 14px 12px; gap: 10px; }
    .riga .spunta { width: 42px; }
    .riga .numero { min-width: 52px; }
    .riga .numero b { font-size: 1.38rem; }
    .riepilogo div { padding: 12px 9px; }
    .riepilogo b { font-size: 1.4rem; }
    .scheda { padding: 17px; }
    .multipla { bottom: 9px; width: calc(100% - 18px); }
  }
  /* PULSANTE DEL TEMA, in alto a destra. Nel tema scuro mostra il sole
     (passa al chiaro), nel chiaro la luna. */
  header.testa .tema {
    position: absolute; top: 14px; right: 0; z-index: 2;
    width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--bordo); background: var(--scheda); color: var(--testo);
    box-shadow: var(--ombra);
  }
  header.testa .tema svg { width: 20px; height: 20px; }
  header.testa .tema .luna { display: none; }
  :root[data-theme="light"] header.testa .tema .sole { display: none; }
  :root[data-theme="light"] header.testa .tema .luna { display: block; }
  @media (max-width: 560px) { header.testa .tema { top: 10px; } }
  /* REGISTRO DELLE GIOCATE (11/11): il tasto accanto al tema e il pannello
     nella barra della multipla. */
  header.testa .giocate-btn {
    position: absolute; top: 14px; right: 50px; z-index: 2;
    width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--bordo); background: var(--scheda); color: var(--testo);
    box-shadow: var(--ombra);
  }
  header.testa .giocate-btn svg { width: 20px; height: 20px; }
  @media (max-width: 560px) { header.testa .giocate-btn { top: 10px; } }
  .multipla .reg-modo { display: flex; gap: 6px; margin-bottom: 8px; }
  .multipla .reg-modo button[aria-pressed="true"] { border-color: var(--evidenza); color: var(--evidenza); }
  .multipla .reg-modo button[disabled] { opacity: .4; cursor: default; }
  .reg-campi { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0; }
  .reg-campi label { display: flex; align-items: center; gap: 6px; font-size: .9rem; }
  .reg-campi input { width: 5.5em; padding: 7px 8px; border: 1px solid var(--bordo); border-radius: 8px; background: var(--scheda); color: var(--testo); font: inherit; }
  .reg-ev { padding: 6px 0; border-bottom: 1px solid var(--bordo); font-size: .88rem; }
  .reg-v { min-height: 1.2em; margin: 2px 0; font-size: .88rem; }
  .reg-val.su { color: #22a35a; font-weight: 700; }
  .reg-val.giu { color: #e0603a; font-weight: 700; }
  .reg-eventi { margin: 0 0 8px; padding-left: 18px; font-size: .9rem; }
  .reg-segna, .reg-strumenti { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .reg-segna button, .reg-strumenti button {
    padding: 8px 12px; border: 1px solid var(--bordo); border-radius: 9px; cursor: pointer;
    background: transparent; color: var(--testo); font: inherit; font-size: .85rem;
  }
  .reg-segna button:hover, .reg-strumenti button:hover { border-color: var(--evidenza); color: var(--evidenza); }
  .reg-tit { margin: 18px 0 6px; font-size: 1.25rem; }

  /* TEMA CHIARO. Stessa grafica, colori del giorno. Il lime acceso resta
     dove fa da fondo (pulsante attivo), e diventa verde oliva dove e'
     testo o barra: su bianco il lime non si legge. */
  :root[data-theme="light"] {
    color-scheme: light;
    --sfondo: #f3f4ef; --testo: #151a22; --tenue: #5b6475; --bordo: rgba(15,23,42,.11);
    --scheda: #ffffff; --evidenza: #0b4a86; --evidenza-forte: #083763;
    --evidenza-tenue: rgba(11,74,134,.12);
    --buono: #15803d; --buono-tenue: rgba(22,163,74,.12);
    --attento: #b45309; --attento-tenue: rgba(217,119,6,.12); --male: #dc2626;
    --carta: linear-gradient(145deg, #ffffff, #fafbf7);
    --v1: #2a78d6; --vx: #c9c5be; --v2: #eb6834;
    --v1-testo: #fff; --vx-testo: #1d1c1a; --v2-testo: #1d1c1a;
  }
  :root[data-theme="light"], :root[data-theme="light"] body { background-color: var(--sfondo); }
  :root[data-theme="light"] body {
    background:
      radial-gradient(800px 440px at 8% -5%, rgba(132,204,22,.12), transparent 65%),
      radial-gradient(700px 480px at 100% 15%, rgba(76,110,245,.07), transparent 65%),
      linear-gradient(rgba(15,23,42,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,23,42,.035) 1px, transparent 1px),
      var(--sfondo);
    background-size: auto, auto, 32px 32px, 32px 32px, auto;
  }
  :root[data-theme="light"] header.testa h1, :root[data-theme="light"] .riga .partita,
  :root[data-theme="light"] .scheda h3, :root[data-theme="light"] .testa-partita h2,
  :root[data-theme="light"] .riepilogo b { color: var(--testo); }
  :root[data-theme="light"] header.testa::after { background: linear-gradient(90deg, var(--evidenza) 0 62%, rgba(15,23,42,.12) 62%); }
  :root[data-theme="light"] .testa .marchio img { border-color: rgba(11,74,134,.3); box-shadow: 0 0 0 5px rgba(11,74,134,.08), 0 14px 30px rgba(15,23,42,.15); }
  :root[data-theme="light"] .chips button { border-color: rgba(15,23,42,.12); background: #fff; color: #475163; }
  :root[data-theme="light"] .chips button:hover { background: rgba(11,74,134,.08); color: var(--evidenza); }
  :root[data-theme="light"] .chips button[aria-pressed="true"] { border-color: rgba(11,74,134,.55); background: rgba(94,168,255,.35); color: #072f57; }
  :root[data-theme="light"] .descr { border-left-color: rgba(11,74,134,.5); color: #4b5565; }
  :root[data-theme="light"] .strumenti input[type="search"], :root[data-theme="light"] .strumenti select {
    border-color: rgba(15,23,42,.14); background: #fff; color: var(--testo); box-shadow: none;
  }
  :root[data-theme="light"] .strumenti input[type="search"]:focus { border-color: rgba(11,74,134,.6); box-shadow: 0 0 0 3px rgba(11,74,134,.12); }
  :root[data-theme="light"] .conta, :root[data-theme="light"] .riga .alto,
  :root[data-theme="light"] .riepilogo span, :root[data-theme="light"] table.mercati th { color: #667085; }
  :root[data-theme="light"] .riga, :root[data-theme="light"] .scheda, :root[data-theme="light"] .riepilogo div { border-color: rgba(15,23,42,.09); }
  :root[data-theme="light"] .riga:hover { border-color: rgba(11,74,134,.35); }
  :root[data-theme="light"] .riga.scelta { border-color: rgba(11,74,134,.55); background: linear-gradient(145deg, #eef5ff, #ffffff); box-shadow: 0 0 0 1px rgba(11,74,134,.15), var(--ombra); }
  :root[data-theme="light"] .riga .spunta { border-right-color: rgba(15,23,42,.08); }
  :root[data-theme="light"] .riga .sel { color: #475163; }
  :root[data-theme="light"] .riga .dettaglio { border-top-color: rgba(15,23,42,.08); background: rgba(15,23,42,.02); }
  :root[data-theme="light"] .segno { border-color: rgba(11,74,134,.2); background: rgba(94,168,255,.3); color: #072f57; }
  :root[data-theme="light"] .pbar, :root[data-theme="light"] .hb .t { background: rgba(15,23,42,.08); }
  :root[data-theme="light"] a.apri-scheda { border-color: rgba(11,74,134,.25); background: rgba(94,168,255,.3); color: #072f57 !important; }
  :root[data-theme="light"] a.apri-scheda:hover { background: rgba(94,168,255,.45); }
  :root[data-theme="light"] .altre { border-color: rgba(15,23,42,.12); background: #fff; }
  :root[data-theme="light"] .multipla { border-color: rgba(11,74,134,.3); background: rgba(255,255,255,.96); }
  :root[data-theme="light"] .multipla button { border-color: rgba(15,23,42,.14); color: #475163; }
  :root[data-theme="light"] footer { border-top-color: rgba(15,23,42,.08); color: #6b7280; }
  :root[data-theme="light"] .pill.medio { background: rgba(15,23,42,.06); color: #475163; }
  :root[data-theme="light"] .chip { border-color: rgba(15,23,42,.15); color: #475163; }
  :root[data-theme="light"] .riga.finita .spunta { background: transparent; }

  /* ESITO DELLA SCHEDINA al posto della spunta: verde con la V se presa,
     rosso con la X se sbagliata. Colore PIU' simbolo, mai il colore da solo. */
  .riga .spunta.esito { cursor: default; font-size: 1.25rem; font-weight: 800; }
  .riga .spunta.esito.presa { color: var(--buono); background: var(--buono-tenue); }
  .riga .spunta.esito.sbagliata { color: var(--male); background: color-mix(in srgb, var(--male) 12%, transparent); }
  .riga .spunta.esito.rimborso, .riga .spunta.esito.attesa { color: var(--tenue); }
  /* LA PROPOSTA (fuori schedina): stesso segno, ma grigio e senza fondo,
     per non confonderla con l'esito della schedina. */
  .riga .spunta.esito.proposta { color: var(--tenue); background: transparent; font-weight: 700; }
  /* Classifica e xG delle due squadre (FotMob), sotto i nomi. */
  .sqinfo { font-size: .74rem; color: var(--tenue); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .sqinfo .sep { opacity: .5; margin: 0 .35em; }
  /* Stemmi accanto ai nomi delle squadre. */
  img.stemma { width: 18px; height: 18px; object-fit: contain; vertical-align: -3px; margin-right: 5px; }
  img.stemma.grande { width: 28px; height: 28px; vertical-align: -6px; margin-right: 7px; }
  .partita .sq { white-space: normal; }
  /* OMBRE DELLE SCHEDE, riviste. Prima: a sinistra una striscia di colore
     che sfumava nel nulla (sembrava una macchia), sotto un alone largo e
     grigio. Ora: a sinistra una barretta netta e staccata dagli angoli;
     sotto due ombre, una corta e scura che "appoggia" la scheda e una
     morbida che non si allarga ai lati (raggio negativo). */
  .riga::before { display: none; }
  :root, :root:not([data-theme="zz"]), :root[data-theme="dark"] {
    --ombra:
      0 1px 0 rgba(255,255,255,.045) inset,
      0 2px 3px -1px rgba(0,0,0,.52),
      0 14px 30px -16px rgba(0,0,0,.82);
    --ombra-hover:
      0 1px 0 rgba(255,255,255,.065) inset,
      0 5px 10px -4px rgba(0,0,0,.58),
      0 24px 46px -20px rgba(0,0,0,.92);
  }
  :root[data-theme="light"] {
    --ombra:
      0 0 0 1px rgba(15,23,42,.018),
      0 2px 4px -2px rgba(15,23,42,.12),
      0 12px 28px -14px rgba(15,23,42,.2);
    --ombra-hover:
      0 0 0 1px rgba(15,23,42,.025),
      0 6px 12px -5px rgba(15,23,42,.15),
      0 22px 42px -18px rgba(15,23,42,.25);
  }
  nav.sezioni {
    box-shadow:
      0 1px 0 rgba(255,255,255,.045) inset,
      0 10px 28px -12px rgba(0,0,0,.65);
  }
  .multipla {
    box-shadow:
      0 1px 0 rgba(255,255,255,.07) inset,
      0 8px 18px -8px rgba(0,0,0,.65),
      0 28px 72px -18px rgba(0,0,0,.82);
  }
  :root[data-theme="light"] .multipla {
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 8px 18px -10px rgba(15,23,42,.22),
      0 28px 60px -22px rgba(15,23,42,.32);
  }
  :root[data-theme="light"] .riga .spunta { background: rgba(15,23,42,.018); }
  /* Riquadri prese / sbagliate come pulsanti di filtro. */
  .riepilogo button.filtro-esito {
    font: inherit; text-align: left; cursor: pointer; color: inherit;
    background: var(--carta); border: 1px solid var(--bordo); border-radius: var(--raggio);
    padding: 10px 12px; box-shadow: var(--ombra); min-width: 0;
  }
  .riepilogo button.filtro-esito b { display: block; }
  .riepilogo button.filtro-esito span { display: block; }
  .riepilogo button.filtro-esito.attivo { border-color: var(--evidenza); box-shadow: 0 0 0 1px var(--evidenza), var(--ombra); }
  .riepilogo button.filtro-esito:disabled { cursor: default; }
  /* LIVE: il punteggio della partita in corso, accanto ai nomi. */
  .live {
    display: inline-block; margin-left: 8px; padding: 1px 8px 1px 18px; border-radius: 999px;
    font-size: .78em; font-weight: 700; letter-spacing: .01em; vertical-align: middle; white-space: nowrap;
    color: #fff; background: #d1342f; position: relative;
  }
  .live::before {
    content: ""; position: absolute; left: 7px; top: 50%; width: 6px; height: 6px; margin-top: -3px;
    border-radius: 50%; background: #fff; animation: livePulsa 1.4s ease-in-out infinite;
  }
  @keyframes livePulsa { 50% { opacity: .25; } }
  /* (144) il puntino fra tempo e punteggio */
  .live .lv-sep { font-weight: 900; margin: 0 .1em; }
  /* Gol da meno di cinque minuti: la pillola si accende per qualche minuto. */
  .live.fresco { box-shadow: 0 0 0 2px var(--evidenza); animation: liveGol 1.2s ease-in-out 3; }
  @keyframes liveGol { 50% { box-shadow: 0 0 0 5px var(--evidenza-tenue, rgba(94,168,255,.35)); } }
  @media (prefers-reduced-motion: reduce) { .live::before, .live.fresco { animation: none; } }
  /* LE QUOTE IN ROSSO (101): i numeri delle quote si staccano dal testo. */
  /* (172) UNA SOLA REGOLA DI COLORE: quote, margini e rating in colore neutro;
     le probabilita' in neutro, VERDI dal 55%, in ogni pagina. */
  .q { color: var(--testo); font-weight: 700; font-variant-numeric: tabular-nums; }
  .q.verde { color: #4ade80; }
  :root[data-theme="light"] .q.verde { color: #15803d; }
  .riga .numero b.pb { color: var(--testo); }
  .riga .numero b.pb.verde { color: #4ade80; }
  :root[data-theme="light"] .riga .numero b.pb.verde { color: #15803d; }
  .sel b.pb.verde { color: #4ade80; }
  :root[data-theme="light"] .sel b.pb.verde { color: #15803d; }
  .riga .numero strong.pct { font-weight: 800; color: var(--testo); }
  .riga .numero strong.pct.verde { color: #4ade80; }
  :root[data-theme="light"] .riga .numero strong.pct.verde { color: #15803d; }
  .sel b.esito-sel { font-weight: 800; color: var(--testo); }
  .q-n { font-weight: 700; color: var(--testo); font-variant-numeric: tabular-nums; }
  .q-n.verde { color: #4ade80; }
  :root[data-theme="light"] .q-n.verde { color: #15803d; }
  .q.elo-su { color: #4ade80; }
  .q.elo-giu { color: #ff6b6b; }
  :root[data-theme="light"] .q.elo-su { color: #15803d; }
  :root[data-theme="light"] .q.elo-giu { color: #c62828; }
  /* IL MOVIMENTO DAL MATTINO (105): freccia e colore per verso. */
  .mv-su { color: #22a55b; font-weight: 700; white-space: nowrap; }
  /* (146) le frecce del movimento Pinnacle sulle card */
  .mov-q { display: inline-flex; gap: .55em; align-items: baseline; padding: 1px 7px; border: 1px solid var(--bordo);
    border-radius: 4px; font-size: .8em; font-weight: 700; white-space: nowrap; color: var(--tenue); }
  .mov-q b { margin-left: .12em; font-weight: 900; }
  /* (152) le frecce dentro l'etichetta Pinnacle e nella barra */
  .mov-in { margin-left: .6em; letter-spacing: .02em; font-weight: 700; color: var(--tenue); }
  .mov-in b { margin-left: .1em; font-weight: 900; }
  .mov-in .ferme { text-transform: none; font-weight: 600; letter-spacing: 0; }
  /* (172) come AsianOdds: quota scesa = rosso, quota salita = blu */
  /* (171) quota SCESA = verde (il mercato ci crede di piu', come l'Elo piu' alto), SALITA = rosso */
  .mov-in b.giu, .barre b.fr.giu { color: #4ade80; } .mov-in b.su, .barre b.fr.su { color: #ff5470; } .mov-in b.fermo { color: var(--tenue); }
  :root[data-theme="light"] .mov-in b.giu { color: #15803d; } :root[data-theme="light"] .mov-in b.su { color: #d6283f; }
  .quote-pin b.fr { margin-left: .1em; font-weight: 900; } .quote-pin b.fr.giu { color: #4ade80; } .quote-pin b.fr.su { color: #ff5470; } .quote-pin b.fr.fermo { color: var(--tenue); }
  :root[data-theme="light"] .quote-pin b.fr.giu { color: #15803d; } :root[data-theme="light"] .quote-pin b.fr.su { color: #d6283f; }
  .camp-cerca { position: relative; margin: 6px 0 10px; }
  .camp-cerca .strumenti { margin: 10px 0 4px; }
  .camp-cerca input { width: 100%; box-sizing: border-box; flex: 1 1 100%; }
  .camp-sugg { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .camp-sugg:empty { display: none; }
  .camp-sugg-r { display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--bordo); background: var(--scheda); color: var(--testo); cursor: pointer; font: inherit; }
  .camp-sugg-r span { display: flex; flex-direction: column; }
  .camp-sugg-r small { color: var(--tenue); }
  .camp-sugg-r img { width: 24px; height: 24px; object-fit: contain; }
  .camp-sugg-msg { color: var(--tenue); padding: 6px 4px; }
  .sq-testa { display: flex; gap: 14px; margin: 4px 0 8px; }
  .sq-testa img { width: 56px; height: 56px; object-fit: contain; }
  .sq-testa .reg-tit { margin: 0; }
  .sq-h { margin: 18px 0 4px; font-size: 1.05rem; }
  .sq-h4 { margin: 14px 0 2px; font-size: .92rem; color: var(--tenue); }
  .sq-tab b.piu { color: var(--buono); }
  .sq-tab b.meno { color: var(--male); }
  .sq-tab span.tenue { color: var(--tenue); }
  .sq-tab td.sq-lab, .sq-tab th.sq-lab { font-weight: 700; white-space: nowrap; text-align: left; }
  .sq-tab td.sq-sx, .sq-tab th.sq-sx { text-align: left; white-space: nowrap; }
  .sq-tab span.piu { color: var(--buono); font-weight: 700; }

  .sq-serie { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .lv-fermo { margin: 6px 0 12px; padding: 8px 12px; border-radius: 10px; font-weight: 700; color: #ff8a9a; background: rgba(255,84,112,.12); border: 1px solid rgba(255,84,112,.4); }
  :root[data-theme="light"] .lv-fermo { color: #b4232f; background: rgba(225,29,72,.08); border-color: rgba(225,29,72,.35); }
  .mov-cal { margin-top: 1px; font-size: .7rem; color: var(--tenue); font-variant-numeric: tabular-nums; line-height: 1.5; }
  .mov-cal .et { font-size: .62rem; text-transform: uppercase; letter-spacing: .03em; margin-right: 2px; }
  .mov-cal b.seg { font-weight: 800; color: var(--testo); }

  .mov-cal .giu { color: #4ade80; font-weight: 800; }
  .mov-cal .su { color: #ff5470; font-weight: 800; }
  .mov-cal .fermo { color: var(--testo); font-weight: 700; }
  .mov-cal .uguale { color: var(--tenue); margin-left: 2px; }
  :root[data-theme="light"] .mov-cal .giu { color: #15803d; }
  :root[data-theme="light"] .mov-cal .su { color: #d6283f; }
  .mov-riga { margin-top: 3px; font-size: .86rem; font-variant-numeric: tabular-nums; line-height: 1.5; }
  .mov-riga .ap { color: var(--tenue); }
  .mov-griglia { display: inline-grid; grid-template-columns: auto repeat(3, auto); column-gap: 10px; row-gap: 0; align-items: baseline; line-height: 1.35; }
  .mov-griglia .et { color: var(--tenue); font-size: .66rem; text-transform: uppercase; letter-spacing: .03em; }
  .mov-griglia b.seg { font-size: .8rem; padding: 0 4px; }

  .mov-griglia i { font-style: normal; margin-left: 3px; }

  .mov-riga .giu { color: #4ade80; font-weight: 800; }
  .mov-riga .su { color: #ff5470; font-weight: 800; }
  .mov-riga .fermo { font-weight: 600; }
  .mov-riga .sep { color: var(--tenue); }
  .mov-riga .ferme { color: var(--tenue); font-size: .78rem; }
  :root[data-theme="light"] .mov-riga .giu { color: #15803d; }
  :root[data-theme="light"] .mov-riga .su { color: #d6283f; }
  .mov-riga b.seg { display: inline-block; min-width: 1.15em; text-align: center; padding: 0 3px; border-radius: 4px; background: rgba(245,185,66,.16); color: #f5b942; font-weight: 800; }
  .mov-riga .uguale { color: var(--tenue); font-weight: 700; }
  :root[data-theme="light"] .mov-riga b.seg { background: rgba(161,98,7,.12); color: #a16207; }
  /* (152) la riga in alto delle card: ora, campionato, margine sulla stessa
     riga quando ci stanno */

  .mov-q b.giu { color: #4ade80; } .mov-q b.su { color: #ff5470; } .mov-q b.fermo { color: var(--tenue); }
  :root[data-theme="light"] .mov-q b.giu { color: #15803d; } :root[data-theme="light"] .mov-q b.su { color: #d6283f; }
  .mv-giu { color: #e8873a; font-weight: 700; white-space: nowrap; }
  :root[data-theme="light"] .mv-su { color: #157a3f; }
  :root[data-theme="light"] .mv-giu { color: #b35a12; }
  /* Il blocco Pinnacle nel dettaglio delle partite delle altre sezioni. */
  .pin-info { border-bottom: 1px dashed var(--bordo); margin-bottom: 8px; padding-bottom: 4px; }
  .pin-info:empty { display: none; }
  /* Le date prima di ieri, sotto il tasto "Giorni precedenti" (108). */
  .chips.giorni-vecchi { margin-top: -4px; }

  /* CALENDARIO (122). */
  .cal-lega { margin-bottom: 6px; border: 1px solid var(--bordo); border-radius: var(--raggio); background: var(--scheda); }
  .cal-lega > summary { cursor: pointer; padding: 10px 12px; font-weight: 700; font-size: .9rem; }
  .cal-lega > summary small { color: var(--tenue); font-weight: 500; margin-left: 6px; }
  /* (163) nome della lega in rosso, stesso rosso delle percentuali */
  .cal-lega > summary .nome-lega { color: #ff6b6b; }
  :root[data-theme="light"] .cal-lega > summary .nome-lega { color: #c62828; }
  .cal-riga { display: grid; grid-template-columns: 48px 1fr auto; gap: 8px; padding: 7px 12px; border-top: 1px solid var(--bordo); font-size: .9rem; align-items: center; }
  .cal-riga .m { color: var(--tenue); font-variant-numeric: tabular-nums; font-size: .82rem; }
  .cal-riga .r { white-space: nowrap; }
  .cal-riga .r .live { margin-left: 0; }
  /* (147) nel Calendario la pillola lunga (gol, espulsioni) va a capo fra
     un pezzo e l'altro invece di schiacciare i nomi delle squadre */
  .cal-riga .r { max-width: 34vw; text-align: right; }
  .cal-riga .r .live { white-space: normal; border-radius: 12px; text-align: left; }
  .live .lv-p { white-space: nowrap; }
  .cal-riga.cal-sito { font-weight: 600; }
  /* (131) il pulsante sta dopo i nomi; la tabella sotto la riga */
  .cal-riga .cal-stat-btn { font: inherit; font-size: .75rem; cursor: pointer; background: transparent; }
  .cal-stat { padding: 4px 12px 10px 68px; font-size: .88rem; }
  @media (max-width: 520px) { .cal-stat { padding-left: 12px; } }
  .cal-riga .chip, .cal-riga .timbro-pin { margin-left: 4px; vertical-align: middle; white-space: nowrap; }
  .lv-ris-mini { font-weight: 800; }
  /* (172) il risultato: grassetto, nero; verde se il pronostico e' uscito, rosso se no */
  .ris, .riga .alto span.ris, .riga .numero b.ris { font-weight: 800; color: var(--testo); }
  .ris.ris-si, .riga .alto span.ris.ris-si { color: #4ade80; }
  .ris.ris-no, .riga .alto span.ris.ris-no { color: #ff5470; }
  :root[data-theme="light"] .ris.ris-si, :root[data-theme="light"] .riga .alto span.ris.ris-si { color: #15803d; }
  :root[data-theme="light"] .ris.ris-no, :root[data-theme="light"] .riga .alto span.ris.ris-no { color: #d6283f; }
  /* PARTITE LIVE (111). */
  .lv-riga { display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--scheda);
    border: 1px solid var(--bordo); border-radius: var(--raggio); box-shadow: var(--ombra); margin-bottom: 10px; }
  .lv-riga .corpo { flex: 1; min-width: 0; }
  .lv-riga .alto { font-size: .75rem; color: var(--tenue); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; }
  .lv-riga .alto .live { margin-left: 0; }
  .lv-riga .squadre { font-weight: 600; font-size: .98rem; }
  .lv-riga .info { font-size: .85rem; color: var(--tenue); margin-top: 3px; }
  .lv-riga .info b { color: var(--testo); }
  /* (142) 1, X e 2 in grassetto accanto alle quote e alle percentuali */
  b.seg { font-weight: 800; color: var(--testo); }
  .lv-ris { font-family: var(--titoli, inherit); font-weight: 800; font-size: 1.15rem; white-space: nowrap; letter-spacing: .02em; }
  .lv-gruppo { margin: 18px 0 8px; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); font-weight: 700; }
  .lv-altre summary { cursor: pointer; font-weight: 700; margin: 18px 0 8px; }
  .lv-lega { font-size: .78rem; color: var(--tenue); margin: 12px 0 4px; font-weight: 600; }
  .lv-mini { display: grid; grid-template-columns: 64px 1fr auto; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--bordo); font-size: .9rem; align-items: center; }
  .lv-mini .m { color: #d1342f; font-weight: 700; font-size: .8rem; }
  .lv-mini .r { font-weight: 800; white-space: nowrap; }
  /* La fonte della quota nelle righe dei prezzi (112). */
  .fonte-q { display: inline-block; padding: 1px 6px; border: 1px solid #5ea8ff; border-radius: 3px; color: #5ea8ff;
    font-size: .66rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .fonte-q.pin { border-color: #f5b301; color: #f5b301; }
  :root[data-theme="light"] .fonte-q { border-color: #0b4a86; color: #0b4a86; }
  :root[data-theme="light"] .fonte-q.pin { border-color: #a36b00; color: #a36b00; }
  /* IL TIMBRO PINNACLE (100): la partita ha le quote Pinnacle. */
  .cal-prob { font-size: .8rem; color: var(--tenue); margin-top: 2px; line-height: 1.5; }
  .cal-prob .et { font-size: .7rem; text-transform: uppercase; letter-spacing: .03em; margin-right: 2px; }
  .cal-prob b.seg { font-weight: 800; color: var(--testo); }
  .cal-prob .sep { color: var(--tenue); }
  .link-storico { color: var(--evidenza); font-weight: 700; white-space: nowrap; text-decoration: none; }
  .cal-lega-nome { display: block; color: var(--tenue); font-size: .72rem; }
  .cal-prev { padding: 4px 0; }
  .pill.cons { background: color-mix(in srgb, var(--evidenza) 14%, transparent); color: var(--evidenza); font-weight: 700; }
  .pill.fresca { background: color-mix(in srgb, var(--buono) 16%, transparent); color: var(--buono); font-weight: 700; }
  .timbro-pin {
    display: inline-block; padding: 0 3px; border: 1px solid #f5b301; border-radius: 2px;
    color: #f5b301; font-size: .38rem; font-weight: 700; letter-spacing: .05em; line-height: 1.45;
    text-transform: uppercase; white-space: nowrap; vertical-align: middle;
  }
  /* (150) piu' piccolo: e' un'indicazione, non il titolo della riga */
  .fonte-q.pin { font-size: .56rem; padding: 0 5px; }
  :root[data-theme="light"] .timbro-pin { border-color: #a36b00; color: #a36b00; }
  /* Il live nelle giocate in attesa. */
  .reg-live:empty { display: none; }
  .reg-live .live { margin-left: 6px; text-transform: none; letter-spacing: .01em; }
  .reg-live .ora-si, .reg-live .ora-no { text-transform: none; white-space: nowrap; }
  .reg-live .ora-si { color: var(--evidenza); font-weight: 700; }
  .reg-live .ora-no { color: #d1342f; font-weight: 700; }
  /* CONDIVIDI LA MULTIPLA. I canali stanno in una fila che va a capo. */
  .multipla .m-azioni { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .multipla .m-chiudi { margin-left: auto; }
  .multipla button.primo { border-color: var(--evidenza); color: var(--evidenza); background: var(--evidenza-tenue); }
  .multipla .m-invio { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--bordo); }
  .multipla .m-invio[hidden] { display: none; }
  .multipla .m-canali { display: flex; flex-wrap: wrap; gap: 6px; }
  .multipla .m-canali button[hidden] { display: none; }
  .multipla .m-canali button { padding: 7px 11px; }
  .multipla p.m-esito-invio { min-height: 1em; margin-top: 6px; color: var(--evidenza); font-weight: 600; }
  :root[data-theme="light"] .multipla button.primo { border-color: rgba(11,74,134,.35); color: #072f57; background: rgba(94,168,255,.3); }
  :root[data-theme="light"] .multipla p.m-esito-invio { color: #072f57; }
  /* xG SQUADRE */
  .strumenti.xgs { flex-wrap: wrap; }
  .strumenti.xgs select#xg-lega { flex: 1 1 220px; min-width: 0; }
  .strumenti.xgs input { flex: 1 1 100%; }
  table.xgt td.sq { text-align: left; }
  table.xgt th:nth-child(2) { text-align: left; }
  table.xgt td:first-child, table.xgt th:first-child { width: 1.6em; color: var(--tenue); }
  table.xgt td.sq > div { display: flex; align-items: center; gap: 6px; }
  table.xgt td.sq span { min-width: 0; overflow-wrap: anywhere; }
  table.xgt td.sq small { display: block; color: var(--tenue); font-size: .72rem; }
  table.xgt td.piu { color: var(--buono); font-weight: 700; }
  table.xgt td.meno { color: var(--male); font-weight: 700; }
  table.xgt td.pt { font-weight: 700; }
  @media (max-width: 380px) { table.xgt th, table.xgt td { padding: 8px 3px; font-size: .8rem; } }
  @media (max-width: 430px) {
    table.xgt.conpt th, table.xgt.conpt td { padding: 8px 2px; font-size: .76rem; }
    table.xgt.conpt td.sq img.stemma { width: 16px; height: 16px; }
    table.xgt.conpt td.sq > div { gap: 4px; }
    table.xgt.conpv th:first-child, table.xgt.conpv td:first-child { display: none; }
  }
  /* RICERCA NEGLI ALTRI GIORNI */
  .altrove { margin: 10px 0 0; }
  .altrove p.piccolo { color: var(--tenue); font-size: .82rem; margin: 6px 2px; }
  .altrove button.vai-altrove {
    display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: var(--carta, var(--scheda)); border: 1px solid var(--bordo); border-radius: var(--raggio-sm);
    padding: 11px 14px; margin: 8px 0; box-shadow: var(--ombra);
  }
  .altrove button.vai-altrove:hover { border-color: var(--evidenza); }
  .altrove button.vai-altrove b { color: var(--evidenza); }
  .altrove button.vai-altrove > span:last-child { display: block; margin-top: 3px; font-size: .86rem; color: var(--tenue); }
  /* TUTTE LE PARTITE: una scheda per partita, dentro le sue righe */
  .riga.partitona > details > summary .numero b { font-size: 1.15rem; }
  .riga.partitona .dentro-partita {
    display: grid; gap: 8px; padding: 0 10px 12px;
    border-top: 1px dashed var(--bordo); padding-top: 10px;
  }
  .riga.partitona .dentro-partita .riga { box-shadow: none; }
  /* Dentro la partita non serve ripetere squadre e orario. */
  .riga.partitona .dentro-partita .riga .partita,
  .riga.partitona .dentro-partita .riga .alto > span:first-child { display: none; }
  .riga.partitona .dentro-partita .riga .sel { font-weight: 600; font-size: .95rem; color: var(--testo); margin-top: 2px; }
  .riga.partitona .dentro-partita p.aggancio { margin: 4px 4px 0; }
  .riga.partitona .dentro-partita p.aggancio:empty { display: none; }
  /* (173) 1X2 e altri mercati per orario: la partita una volta, gli esiti sotto */
  .riga.partitona.mercato { display: flex; }
  .riga.partitona.mercato > .mercato-corpo { flex: 1; min-width: 0; }
  .riga.partitona.mercato .dentro-partita.esiti { border-top: 1px dashed var(--bordo); }
  .riga.partitona.mercato .dentro-partita.esiti .riga .alto { display: none; }
  .riga.partitona.mercato .dentro-partita.esiti .riga summary { padding-top: 10px; padding-bottom: 10px; }
  .riga.partitona.mercato details[open] .apri-info { display: none; }
  .riga.partitona.mercato .apri-info { margin-top: 4px; font-size: .7rem; }
  /* (173) una riga per esito, compatta: niente xG sulla riga */
  .riga.compatta .sqinfo { display: none; }
  /* CON IL MOUSE LE FILE DI TASTI SCORRONO CON LA ROTELLA E HANNO LA
     BARRA. Sul telefono scorrono col dito e la barra non serve; sul PC la
     rotella andava in verticale e i giorni oltre il bordo restavano
     tagliati senza modo di raggiungerli. La fila resta dentro i margini
     della pagina, la barra sottile sta sotto i tasti. */
  @media (hover: hover) and (pointer: fine) {
    .chips {
      margin-left: 0; margin-right: 0; padding-left: 0; padding-right: 0; padding-bottom: 10px;
      scrollbar-width: thin; scrollbar-color: var(--bordo) transparent;
    }
    .chips::-webkit-scrollbar { display: block; height: 6px; }
    .chips::-webkit-scrollbar-thumb { background: var(--bordo); border-radius: 3px; }
    .chips::-webkit-scrollbar-thumb:hover { background: var(--tenue); }
    .chips::-webkit-scrollbar-track { background: transparent; }
  }
  /* LARGHEZZA (11/11): a 820 px la colonna era troppo stretta sul PC, a
     tutto schermo (10/11) troppo larga. Si allarga con la finestra fino a
     1200 px, poi resta in mezzo. Sul telefono non cambia niente. */
  main { max-width: 1200px; padding-left: clamp(16px, 3vw, 32px); padding-right: clamp(16px, 3vw, 32px); }
  .multipla .dentro { max-width: 1200px; }
  /* BARRA DELLE SEZIONI VERDE nel tema chiaro, lo stesso verde della
     barretta sotto il titolo (--evidenza): stacca dallo sfondo chiaro;
     il tasto acceso resta lime. */
  :root[data-theme="light"] nav.sezioni {
    background: var(--evidenza);
    border-color: var(--evidenza);
    box-shadow:
      0 1px 0 rgba(255,255,255,.12) inset,
      0 10px 26px -12px rgba(8, 55, 99, .6);
  }
  :root[data-theme="light"] nav.sezioni button { color: #eef4fb; }
  :root[data-theme="light"] nav.sezioni button:hover { background: rgba(255,255,255,.14); color: #fff; }
  :root[data-theme="light"] nav.sezioni button.casa { color: #dbe7f5; }
  /* La barretta decorativa sotto il titolo (riempita sempre al 62%)
     sembrava un dato e non lo era: tolta. */
  header.testa::after, :root[data-theme="light"] header.testa::after { display: none; }
  /* Il nome del sito in verde, tutto minuscolo, in tutti e due i temi. */
  header.testa h1, :root[data-theme="light"] header.testa h1,
  header.testa h1 .acc, :root[data-theme="light"] header.testa h1 .acc { color: var(--evidenza); }
  /* BLU AL POSTO DEL VERDE (11/11): l'accento del sito prende il blu dello
     sfondo dell'icona (#09447a). Nel tema chiaro e' il blu dell'icona,
     nel tema scuro un azzurro piu' chiaro che si legge sul fondo nero.
     Il verde resta solo dove vuol dire "vinto". Il tasto acceso della
     barra, che era lime, nel tema chiaro diventa bianco col testo blu. */
  :root[data-theme="light"] nav.sezioni button[aria-current="true"] { background: #ffffff; color: #072f57; box-shadow: 0 6px 18px rgba(0,0,0,.22); }
  nav.sezioni button[aria-current="true"] { color: #06182e; }
  /* BARRA DELLE SEZIONI NEL TEMA SCURO (11/11): grigia su nero si perdeva.
     Ora e' piena del blu dell'icona, come nel tema chiaro; il tasto acceso
     resta azzurro. */
  :root:not([data-theme="light"]) nav.sezioni {
    background: #0c4580;
    border-color: #1a5a9c;
    box-shadow: 0 1px 0 rgba(255,255,255,.10) inset, 0 12px 28px -12px rgba(30, 110, 200, .55);
  }
  :root:not([data-theme="light"]) nav.sezioni button { color: #e8f1fc; }
  :root:not([data-theme="light"]) nav.sezioni button:hover { background: rgba(255,255,255,.12); color: #fff; }
  :root:not([data-theme="light"]) nav.sezioni button[aria-current="true"] { background: #5ea8ff; color: #06182e; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  /* LE FRECCE DELLA BARRA (12/11): sui telefoni le sezioni non ci stanno
     tutte e niente diceva che la barra si trascina. Ora la barra sta in
     un guscio (che resta fermo in alto al posto suo) e, dove c'e' altro
     fuori schermo, il bordo sfuma col colore della barra e compare una
     freccia: toccandola la barra scorre. In fondo la freccia sparisce;
     se ci sta tutto (schermo largo) non compare nessuna delle due. */
  .sez-guscio { position: sticky; top: 8px; z-index: 5; margin: 0 -8px; }
  .sez-guscio > nav.sezioni { position: relative; top: 0; margin: 0; --nav-sfondo: #0c4580; }
  :root[data-theme="light"] .sez-guscio > nav.sezioni { --nav-sfondo: var(--evidenza); }
  .freccia-sez {
    position: absolute; top: 1px; bottom: 1px; width: 40px; z-index: 6;
    display: flex; align-items: center; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .freccia-sez.dopo {
    right: 1px; justify-content: flex-end; padding-right: 3px;
    border-radius: 0 14px 14px 0;
    background: linear-gradient(to right, transparent, #0c4580 55%);
  }
  .freccia-sez.prima {
    left: 1px; justify-content: flex-start; padding-left: 3px;
    border-radius: 14px 0 0 14px;
    background: linear-gradient(to left, transparent, #0c4580 55%);
  }
  :root[data-theme="light"] .freccia-sez.dopo { background: linear-gradient(to right, transparent, var(--evidenza) 55%); }
  :root[data-theme="light"] .freccia-sez.prima { background: linear-gradient(to left, transparent, var(--evidenza) 55%); }
  .freccia-sez svg {
    width: 22px; height: 22px; padding: 3px; border-radius: 999px;
    background: rgba(255,255,255,.92); box-shadow: 0 2px 6px rgba(0,0,0,.3);
    fill: none; stroke: #072f57; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
  }
  .sez-guscio.ha-prima .freccia-sez.prima,
  .sez-guscio.ha-dopo .freccia-sez.dopo { opacity: 1; pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) { .freccia-sez { transition: none; } }
  /* Statistiche della partita (129): casa a sinistra, ospite a destra,
     sotto una barra con la quota della casa. */
  .stat-testa { display: flex; justify-content: space-between; font-weight: 700; font-size: .85rem; margin: 4px 0 8px; }
  .stat-riga { display: grid; grid-template-columns: 3.5em 1fr 3.5em; align-items: center; gap: 2px 8px; margin: 6px 0; }
  .stat-riga > span { text-align: center; color: var(--tenue); font-size: .85rem; }
  .stat-riga > b:last-of-type { text-align: right; }
  .stat-barra { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--bordo); overflow: hidden; }
  .mk { padding: 7px 0; border-bottom: 1px solid var(--bordo); }
  .mk > span { display: block; font-size: .78rem; font-weight: 700; color: var(--tenue); text-transform: uppercase; letter-spacing: .02em; }
  .mk p { margin: 2px 0 0; }
  .stat-barra i { display: block; height: 100%; background: var(--evidenza); }
  /* (165) confronto squadre: il valore migliore in evidenza */
  .stat-riga b.meglio { color: var(--buono); }
  .conf .chips { margin: 4px 0 6px; }
  .conf h4 { margin: 14px 0 2px; font-size: .9rem; }
  /* (167) CAMPIONATI */
  .chips-scorri { position: relative; }
  .freccia-chips { position: absolute; top: 0; bottom: 0; width: 46px; z-index: 2; display: flex; align-items: center; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity .18s ease; -webkit-tap-highlight-color: transparent; }
  .freccia-chips.dopo { right: 0; justify-content: flex-end; background: linear-gradient(to right, transparent, var(--sfondo) 45%); }
  .freccia-chips.prima { left: 0; justify-content: flex-start; background: linear-gradient(to left, transparent, var(--sfondo) 45%); }
  /* (169) sul telefono la fila arriva al bordo dello schermo (margini -16px):
     la freccia sta li', al bordo, e copre del tutto il tasto che c'e' sotto */
  @media (max-width: 560px) and (not ((hover: hover) and (pointer: fine))) {
    .freccia-chips { width: 52px; }
    .freccia-chips.dopo { right: -16px; padding-right: 8px; }
    .freccia-chips.prima { left: -16px; padding-left: 8px; }
  }
  .freccia-chips svg { width: 24px; height: 24px; padding: 4px; border-radius: 999px; background: var(--evidenza);
    fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .chips-scorri.ha-prima .freccia-chips.prima, .chips-scorri.ha-dopo .freccia-chips.dopo { opacity: 1; pointer-events: auto; }
  .chips-scorri .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips-scorri .chips::-webkit-scrollbar { display: none; }
  .chips-scorri .chips button { flex: 0 0 auto; white-space: nowrap; }
  .tab-scorri { overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--scheda); border: 1px solid var(--bordo); border-radius: var(--raggio); padding: 2px 8px; margin: 8px 0; }
  table.camp th[data-ord] { cursor: pointer; white-space: nowrap; }
  table.camp th.ord { text-decoration: underline; text-underline-offset: 3px; }
  table.camp td { white-space: nowrap; }
  table.camp td.sq span { white-space: nowrap; }
  /* il nome della squadra non va a capo e resta fermo a sinistra quando la tabella scorre */
  table.camp td.sq, table.camp thead th:nth-child(2) { position: sticky; left: 0; z-index: 1; background: var(--scheda); }
  table.camp td.sq small { white-space: nowrap; }
  table.camp td.ult { white-space: nowrap; }
  table.camp td.avv { white-space: normal; font-size: .82rem; text-align: left; }
  table.camp .fm { display: inline-block; min-width: 1.15em; text-align: center; border-radius: 3px; font-size: .7rem; margin-right: 2px; padding: 0 1px; }
  svg.barre-xg .asse { stroke: var(--bordo); stroke-width: 1; }
  svg.barre-xg .su { fill: var(--buono); }
  svg.barre-xg .giu { fill: var(--male); }
  .serie-griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .scheda.serie { margin: 0; }
  .scheda.serie h4 { margin: 0 0 6px; font-size: .9rem; }
  .serie-r { display: flex; align-items: center; gap: 6px; margin: 4px 0; font-size: .88rem; }
  .serie-r span { flex: 1; min-width: 0; }
  ul.assenti { padding-left: 18px; }
  ul.assenti li { margin: 3px 0; }
  ul.assenti .piccolo { margin-left: 4px; }
  .stat-riga.forma { grid-template-columns: auto 1fr auto; }
  .stat-riga .fm { display: inline-block; min-width: 1.15em; text-align: center; border-radius: 3px; font-size: .72rem; margin-right: 2px; padding: 0 1px; }
  .stat-riga > b:last-of-type .fm { margin: 0 0 0 2px; }
  /* (169) colori pieni e brillanti per V / N / P */
  .fm-v { background: #16a34a; color: #fff; font-weight: 700; }
  .fm-n { background: #94a3b8; color: #fff; font-weight: 700; }
  .fm-p { background: #e11d48; color: #fff; font-weight: 700; }
  .tab-scorre { overflow-x: auto; }
  details.tutte-linee { margin-top: 8px; }
  details.tutte-linee summary { cursor: pointer; color: var(--evidenza); font-weight: 600; }
  details.tutte-linee p { font-size: .85rem; margin: 6px 0; }
  a.chip-link { text-decoration: none; color: var(--evidenza); border-color: color-mix(in srgb, var(--evidenza) 45%, transparent); font-weight: 600; }
  a.chip-link:hover { background: color-mix(in srgb, var(--evidenza) 12%, transparent); }
  /* (132) gli assenti col loro peso */
  ul.assenti { list-style: none; padding: 0; margin: 4px 0 8px; }
  ul.assenti li { padding: 5px 0; border-bottom: 1px solid var(--bordo); }
  ul.assenti li:last-child { border-bottom: 0; }
  p.ass-sq { margin: 8px 0 0; }
  /* (141) Best picks: lo storico AsianOdds, chiuso */
  details.best-storico { margin: 10px 0 4px; }
  details.best-storico summary { cursor: pointer; color: var(--evidenza); font-weight: 600; }
  /* (140) l'Elo sotto i nomi, in ogni card */
  .sel.elo-mini { font-size: .85rem; color: var(--tenue); }
  /* (148) sulle card l'Elo sta in una riga: il carattere si stringe col
     telefono stretto invece di andare a capo */
  /* (153) "1 1.63" non si spezza mai: si va a capo solo fra un segno e l'altro */
  .nw, .elo-mini .nw { white-space: nowrap; }
  .quote-pin .q3 { display: block; white-space: nowrap; }
  .quote-pin .ov { display: block; }
  .riga summary.con-elo-largo { flex-wrap: wrap; row-gap: 2px; }
  #contenuto[data-sez="pin"] .riga summary .tripla .nome, #contenuto[data-sez="consensus"] .riga summary .tripla .nome, #contenuto[data-sez="accordo"] .riga summary .tripla .nome, #contenuto[data-sez="poisson"] .riga summary .tripla .nome, #contenuto[data-sez="sm"] .riga summary .tripla .nome { width: auto; min-width: 54px; white-space: nowrap; }
  /* (156) CARD LARGHE in Pinnacle, Consenso, Poisson e (157) Sports Mole: il numero grande sale
     nella prima riga, a destra, e la colonna centrale prende tutta la
     larghezza (prima ~215 pixel: i nomi corti andavano a capo). */
  #contenuto[data-sez="pin"] .riga > details > summary, #contenuto[data-sez="consensus"] .riga > details > summary, #contenuto[data-sez="accordo"] .riga > details > summary, #contenuto[data-sez="poisson"] .riga > details > summary, #contenuto[data-sez="sm"] .riga > details > summary { position: relative; }
  #contenuto[data-sez="pin"] .riga > details > summary > .numero, #contenuto[data-sez="consensus"] .riga > details > summary > .numero, #contenuto[data-sez="accordo"] .riga > details > summary > .numero, #contenuto[data-sez="poisson"] .riga > details > summary > .numero, #contenuto[data-sez="sm"] .riga > details > summary > .numero { position: absolute; top: 12px; right: 16px; min-width: 0; text-align: right; }
  #contenuto[data-sez="pin"] .riga > details > summary > .numero b, #contenuto[data-sez="consensus"] .riga > details > summary > .numero b, #contenuto[data-sez="accordo"] .riga > details > summary > .numero b, #contenuto[data-sez="poisson"] .riga > details > summary > .numero b, #contenuto[data-sez="sm"] .riga > details > summary > .numero b { font-size: 1.25rem; line-height: 1.1; }
  #contenuto[data-sez="pin"] .riga > details > summary > .numero span, #contenuto[data-sez="consensus"] .riga > details > summary > .numero span, #contenuto[data-sez="accordo"] .riga > details > summary > .numero span, #contenuto[data-sez="poisson"] .riga > details > summary > .numero span, #contenuto[data-sez="sm"] .riga > details > summary > .numero span { font-size: .62rem; display: block; }
  #contenuto[data-sez="pin"] .riga > details > summary > .corpo > .alto, #contenuto[data-sez="consensus"] .riga > details > summary > .corpo > .alto, #contenuto[data-sez="accordo"] .riga > details > summary > .corpo > .alto, #contenuto[data-sez="poisson"] .riga > details > summary > .corpo > .alto, #contenuto[data-sez="sm"] .riga > details > summary > .corpo > .alto { padding-right: 100px; min-height: 38px; align-content: flex-start; }

  .riga summary .elo-largo { flex: 0 0 100%; box-sizing: border-box; padding-right: 0; margin-top: -4px; min-width: 0; }
  .riga .sel.elo-mini { white-space: nowrap; font-size: clamp(.66rem, 3.25vw, .85rem); overflow: hidden; text-overflow: ellipsis; }
  /* (133) la classifica Elo */
  .elo-r { display: grid; grid-template-columns: 2.6em 1fr auto; gap: 8px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--bordo); }
  .elo-r .m { color: var(--tenue); font-variant-numeric: tabular-nums; text-align: right; }
  .elo-r .r b { font-size: 1.05rem; }
  /* ✓/✗ grigia sui pronostici delle fonti nella scheda (125). */
  .spunta-pron { color: var(--tenue); font-weight: 800; }

  /* (173) PIU' RESPIRO NELLE SCHEDE (14/11). Piu' spazio dentro e fra le
     schede, il nome della partita un po' piu' grande, le righe secondarie
     (xG, Elo, quote) piu' distanziate e piu' quiete: l'occhio va prima alla
     partita, poi al pronostico, poi al resto. Niente colori nuovi. */
  .lista { gap: 14px; }
  .riga summary { padding: 18px 16px; }
  .riga .alto { margin-bottom: 7px; }
  .riga .partita { font-size: 1.02rem; line-height: 1.28; letter-spacing: -.025em; }
  .riga .sel { margin-top: 6px; line-height: 1.45; }
  .riga .sqinfo { margin-top: 5px; font-size: .74rem; opacity: .85; }
  .riga .numero span { margin-top: 3px; letter-spacing: .02em; }
  @media (max-width: 560px) {
    .riga summary { padding: 16px 14px; gap: 12px; }
    .riga .numero b { font-size: 1.45rem; }
  }

  /* (173) PIU' PROFONDITA' NEL TEMA CHIARO (14/11, via di mezzo). Il tema
     scuro ha gia' luce, sfumature e ombre a strati; nel chiaro le schede
     bianche su fondo quasi bianco sembravano piatte. Fondo un po' piu'
     scuro, schede sollevate da due ombre (una corta di contatto, una lunga
     e morbida) e un filo di luce in alto; riquadri, pulsanti e ricerca con
     la stessa logica, piu' leggera. Colori dei dati invariati. */
  :root[data-theme="light"] {
    --sfondo: #e6e9e0;
    --carta: linear-gradient(180deg, #ffffff 0%, #fafbf8 100%);
    --ombra:
      0 1px 0 #ffffff inset,
      0 0 0 1px rgba(15,23,42,.045),
      0 2px 5px -2px rgba(15,23,42,.13),
      0 16px 32px -16px rgba(15,23,42,.33);
    --ombra-hover:
      0 1px 0 #ffffff inset,
      0 0 0 1px rgba(15,23,42,.055),
      0 6px 12px -5px rgba(15,23,42,.17),
      0 24px 44px -18px rgba(15,23,42,.37);
  }
  :root[data-theme="light"] .riga, :root[data-theme="light"] .riepilogo div,
  :root[data-theme="light"] .riepilogo button { border-color: rgba(15,23,42,.05); }
  :root[data-theme="light"] .riga .spunta {
    background: linear-gradient(180deg, rgba(15,23,42,.03), rgba(15,23,42,.012));
    border-right-color: rgba(15,23,42,.07);
  }
  :root[data-theme="light"] .riga .dettaglio { background: rgba(15,23,42,.025); }
  :root[data-theme="light"] .chips button, :root[data-theme="light"] .strumenti input[type="search"],
  :root[data-theme="light"] .strumenti select {
    box-shadow: 0 1px 0 #fff inset, 0 1px 2px rgba(15,23,42,.06), 0 5px 12px -8px rgba(15,23,42,.2);
  }

  /* (173) SFONDO DEL TEMA CHIARO NEL BLU DEL SITO (14/11). Prima il fondo
     era grigio-verde con una luce lime in alto a sinistra: il lime nel
     chiaro non c'entrava con la barra e il titolo blu. Ora fondo grigio
     appena freddo e due luci sfumate del blu del sito, con la stessa
     intensita' di prima. La griglia sottile resta. */
  :root[data-theme="light"] { --sfondo: #e5e9ef; }
  :root[data-theme="light"] body {
    background:
      radial-gradient(800px 440px at 8% -5%, rgba(11,74,134,.13), transparent 65%),
      radial-gradient(700px 480px at 100% 15%, rgba(42,120,214,.09), transparent 65%),
      linear-gradient(rgba(15,23,42,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,23,42,.035) 1px, transparent 1px),
      var(--sfondo);
    background-size: auto, auto, 32px 32px, 32px 32px, auto;
  }
</style>
</head>

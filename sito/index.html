      carica = carica.then(function (righe) { return conRisultati(sez, righe, d); });
      return carica.then(function (righe) {
        if (stato.sez !== sez || stato.data[sez] !== d) return;
        disegnaRighe(sez, righe, d);
      });
    }).catch(function (e) {
      if (sez === "wdw" || sez === "sm" || sez === "hp" || sez === "fp" || sez === "pin") {
        // Prima del primo giro l'indice non c'e': non e' un guasto.
        var chi = sez === "sm" ? "Sports Mole" : sez === "hp" ? "HeroPredict" : sez === "fp" ? "FootballPark" : sez === "pin" ? "Pinnacle" : "FootyStats";
        $cont.innerHTML = chipsHtml(gruppoPronostici(sez), sez, "data-gruppo") +
          messaggio("vuoto", chi + " non \u00e8 ancora stato pubblicato: arriva col giro notturno. " +
            "Se non compare nemmeno domani, il motivo \u00e8 nel log del passo \u201cScarica " + chi + "\u201d su GitHub Actions.");
        $cont.querySelectorAll("[data-gruppo]").forEach(function (b) {
          b.addEventListener("click", function () {
            if (b.dataset.gruppo === sez) return;
            stato.sez = b.dataset.gruppo; stato.cerca = ""; stato.limite = PASSO; disegna();
          });
        });
        return;
      }
      $cont.innerHTML = messaggio("errore",
        "Non riesco a leggere i dati (" + esc(e.message) + "). " +
        "Riprova fra qualche minuto: se il giro notturno sta scrivendo, i file arrivano dopo.");
    });
  }

  function collegaTesta(sez) {
    // Passando da una strada all'altra si resta sulla stessa giornata, se
    // l'altra ce l'ha.
    $cont.querySelectorAll("[data-gruppo]").forEach(function (b) {
      b.addEventListener("click", function () {
        var nuova = b.dataset.gruppo;
        if (nuova === sez) return;
        if (!stato.data[nuova]) stato.data[nuova] = stato.data[sez];
        stato.sez = nuova; stato.cerca = ""; stato.limite = PASSO; disegna();
      });
    });
    $cont.querySelectorAll("[data-data]").forEach(function (b) {
      b.addEventListener("click", function () {
        stato.data[sez] = b.dataset.data; stato.limite = PASSO; stato.esito = ""; stato.secchi = false; disegna();
      });
    });
    $cont.querySelectorAll("[data-vista]").forEach(function (b) {
      b.addEventListener("click", function () {
        stato.vista[sez] = b.dataset.vista; stato.limite = PASSO;
        if (sez === "prezzi" && b.dataset.vista === "partite" && stato.ordine.prezzi === "file") stato.ordine.prezzi = "ora";
        disegna();
      });
    });
    var c = document.getElementById("cerca");
    var t = null;
    c.addEventListener("input", function () {
      clearTimeout(t);
      t = setTimeout(function () {
        stato.cerca = c.value.trim(); stato.limite = PASSO; ridisegnaRighe();
      }, 150);
    });
    document.getElementById("ordine").addEventListener("change", function (e) {
      stato.ordine[sez] = e.target.value; stato.limite = PASSO; ridisegnaRighe();
    });
    var sf = document.getElementById("fonte-cm");
    if (sf) sf.addEventListener("change", function (e) {
      // Si ridisegna tutta la giornata: la prima volta che si sceglie una
      // fonte bisogna leggere le schede, che portano i suoi pronostici.
      stato.fonteCm = e.target.value; stato.limite = PASSO; disegna();
    });
    // Le date attive restano in vista anche quando la riga scorre.
    var att = $cont.querySelector('[data-data][aria-pressed="true"]');
    if (att && att.scrollIntoView) att.scrollIntoView({ block: "nearest", inline: "center" });
  }

  var ultime = null;
  function ridisegnaRighe() {
    if (ultime) disegnaRighe(ultime.sez, ultime.righe, ultime.data);
  }

  function disegnaRighe(sez, righe, data) {
    ultime = { sez: sez, righe: righe, data: data };
    var vista = stato.vista[sez];
    var tiene = SEZ[sez].tiene;
    var tutte = Array.isArray(righe) ? righe : [];
    var passano = tutte.filter(function (r) { return tiene(r, vista); });
    if (sez === "consensus" && stato.fonteCm) passano = passano.filter(function (r) { return haFonte(r, stato.fonteCm); });
    // il filtro vinte/perse vale nella pagina dove lo si e' acceso
    if (stato.sezEsito !== sez) { stato.esito = ""; stato.sezEsito = sez; }
    baseEsiti = passano;
    if (sez === "prezzi" && stato.esito) {
      var tutteFiltro = passano;
      passano = passano.filter(function (r) { return r.Esito === stato.esito; });
      if (!passano.length) { stato.esito = ""; passano = tutteFiltro; }
    } else if (ESITO_SEZ[sez] && stato.esito) {
      var tutteF2 = passano;
      passano = passano.filter(function (r) { var e = ESITO_SEZ[sez](r); return e && e.esito === stato.esito; });
      if (!passano.length) { stato.esito = ""; passano = tutteF2; }
    }
    // IL RIQUADRO "CON MARGINE SOTTO IL 2%" E' UN PULSANTE: toccandolo
    // restano solo quelle righe, ritoccandolo si torna a tutte. Se in una
    // giornata non ce n'e' nessuna, il filtro si spegne da solo.
    baseStrette = passano;
    if (sez === "prezzi" && stato.stretti) {
      var stretteF = passano.filter(margineStretto);
      if (stretteF.length) passano = stretteF; else stato.stretti = false;
    }
    // Lo stesso per il riquadro "su un segno secco" del Consenso Statarea:
    // restano le partite in cui il pronostico combinato e' 1, X o 2.
    baseSecchi = passano;
    if (sez === "accordo" && stato.secchi) {
      var secchiF = passano.filter(segnoSecco);
      if (secchiF.length) passano = secchiF; else stato.secchi = false;
    }
    var q = stato.cerca.toLowerCase();
    var visibili = q ? passano.filter(function (r) { return testoCerca(r).indexOf(q) >= 0; }) : passano;
    visibili = ordina(sez, visibili.slice());

    var $r = document.getElementById("righe");
    if (!$r) return;
    if (!tutte.length) {
      $r.innerHTML = messaggio("vuoto", "Il file di questa giornata è vuoto.");
      return;
    }
    if (!passano.length) {
      $r.innerHTML = messaggio("vuoto", sez === "consensus" && stato.fonteCm
        ? "In questa giornata, in questa vista, nessuna partita ha un pronostico di " +
          esc(nomeCm(stato.fonteCm)) +
          ". Prova un altro giorno, la vista \u201cTutte\u201d o un'altra fonte."
        : vuotoPerVista(sez, vista, tutte.length, data));
      return;
    }
    if (!visibili.length) {
      $r.innerHTML = messaggio("vuoto", "Nessuna riga corrisponde a “" + esc(stato.cerca) + "”" +
        (vista !== "tutte" ? " in questa vista" : "") + " in questa giornata.") +
        '<div id="altrove" class="altrove"><p class="piccolo">Cerco negli altri giorni&hellip;</p></div>';
      cercaAltrove(sez, data, stato.cerca, tutte);
      return;
    }

    // "Tutte le partite" e "Piu' affidabili" raccolte per partita: nella
    // seconda una partita ben quotata aveva sei righe una sotto l'altra e
    // copriva tutte le altre.
    if (sez === "prezzi" && (vista === "partite" || vista === "stretto")) return disegnaPerPartita(sez, visibili, tutte, data, $r);
    // (173) 1X2, UNDER/OVER, GOL/NOGOL E COMBINATE: per orario una scheda per
    // partita con gli esiti gia' visibili dentro; negli altri ordini una
    // riga per esito, compatta (quote ed Elo nel dettaglio).
    if (sez === "prezzi" && VISTE_MERCATO[vista] && stato.ordine.prezzi === "ora") return disegnaPerPartita(sez, visibili, tutte, data, $r, true);

    var mostrate = visibili.slice(0, stato.limite);
    var conta = visibili.length === tutte.length
      ? visibili.length + " righe"
      : visibili.length + " righe su " + tutte.length;
    var html = SEZ[sez].riepilogo(visibili) + tessereEsito(sez, visibili) +
      '<p class="conta">' + conta + SEZ[sez].nota + "</p><div class=\"lista\">" +
      mostrate.map(function (r, i) {
        var h = SEZ[sez].riga(r, i), e = ESITO_SEZ[sez] ? ESITO_SEZ[sez](r) : null;
        if (sez === "prezzi" && VISTE_MERCATO[vista]) h = h.replace('<div class="riga', '<div class="riga compatta');
        if (e) h = coloraRis(h, e.esito);
        return conAggancio(spuntaRisultato(h, r), sez, r);
      }).join("") + "</div>";
    if (visibili.length > mostrate.length) {
      html += '<button type="button" class="altre" id="altre">Mostra altre ' +
        Math.min(PASSO, visibili.length - mostrate.length) + " (ne restano " +
        (visibili.length - mostrate.length) + ")</button>";
    }
    $r.innerHTML = html;

    var a = document.getElementById("altre");
    if (a) a.addEventListener("click", function () { stato.limite += PASSO; ridisegnaRighe(); });
    collegaAgganci($r, data);
    $r.querySelectorAll("[data-esito]").forEach(function (b) {
      b.addEventListener("click", function () {
        stato.esito = stato.esito === b.dataset.esito ? "" : b.dataset.esito;
        stato.limite = PASSO; ridisegnaRighe();
      });
    });
    $r.querySelectorAll("[data-stretti]").forEach(function (b) {
      b.addEventListener("click", function () {
        stato.stretti = !stato.stretti;
        stato.limite = PASSO; ridisegnaRighe();
      });
    });
    $r.querySelectorAll("[data-secchi]").forEach(function (b) {
      b.addEventListener("click", function () {
        stato.secchi = !stato.secchi;
        stato.limite = PASSO; ridisegnaRighe();
      });
    });
    if (sez === "prezzi" || sez === "sure") {
      $r.querySelectorAll("input[data-chiave]").forEach(function (cb) {
        cb.addEventListener("change", function () {
          var k = cb.dataset.chiave;
          var r = mostrate[Number(cb.dataset.i)];
          if (cb.checked) scelte[k] = r; else delete scelte[k];
          cb.closest(".riga").classList.toggle("scelta", cb.checked);
          aggiornaMultipla();
        });
      });
    }
    rimettiPosto($r);
  }

  // ------------------------------------------------ tutte le partite
  //
  // LA STESSA GIORNATA, RACCOLTA PER PARTITA. Le righe sono quelle di
  // prezzi_<data>.json, tali e quali: qui si mettono soltanto insieme
  // quelle della stessa partita (stessa data, stesso nome come lo scrive
  // il file), cosi' chi cerca il derby lo trova una volta sola e, aprendolo,
  // vede tutte le sue probabilita' con la spunta per la multipla.
  var ORDINE_GRUPPO = { "1X2": 0, "Combo": 1, "Gol NoGol": 2, "Under Over": 3 };

  var VISTE_MERCATO = { "1x2": 1, ou: 1, btts: 1, combo: 1 };
  function disegnaPerPartita(sez, visibili, tutte, data, $r, mercato) {
    var gruppi = [], dove = {};
    visibili.forEach(function (r) {
      var k = (r.Data || "") + "|" + String(r.Partita || (r.Casa + " - " + r.Ospite)).toLowerCase();
      if (!(k in dove)) { dove[k] = gruppi.length; gruppi.push([]); }
      gruppi[dove[k]].push(r);
    });
    gruppi.forEach(function (g) {
      g.sort(function (a, b) {
        var sa = String(a.InSchedina || "") === "si" ? 0 : 1, sb = String(b.InSchedina || "") === "si" ? 0 : 1;
        if (sa !== sb) return sa - sb;
        var ga = ORDINE_GRUPPO[a.Gruppo], gb = ORDINE_GRUPPO[b.Gruppo];
        ga = ga == null ? 9 : ga; gb = gb == null ? 9 : gb;
        if (ga !== gb) return ga - gb;
        return (num(b.Prob) || 0) - (num(a.Prob) || 0);
      });
    });
    var o = stato.ordine[sez];
    function maxProb(g) { return Math.max.apply(null, g.map(function (r) { return num(r.Prob) || 0; })); }
    function minMarg(g) { return Math.min.apply(null, g.map(function (r) { var m = num(r.Margine); return m == null ? 99 : m; })); }
    gruppi.sort(function (a, b) {
      if (o === "file") return maxProb(b) - maxProb(a);
      if (o === "margine") return minMarg(a) - minMarg(b);
      return String(a[0].Ora || "").localeCompare(String(b[0].Ora || "")) ||
        String(a[0].Partita || "").localeCompare(String(b[0].Partita || ""));
    });
    // Le partite finite in cima, come nelle altre viste.
    var fin = gruppi.filter(function (g) { return g.some(function (r) { return r.Esito; }); });
    if (fin.length) gruppi = fin.concat(gruppi.filter(function (g) { return fin.indexOf(g) < 0; }));

    var mostrateG = gruppi.slice(0, stato.limite), mostrate = [];
    // LA GIOCATA PROPOSTA SULLA SCHEDA CHIUSA, quando la partita non ha
    // quella della schedina. Prima era la piu' probabile, cioe' quasi
    // sempre un Over 1.5: una lista tutta uguale. Ora si sceglie fra le
    // probabilita' fra il 55% e l'80% (giocabili: sopra, la quota e'
    // troppo bassa) il tipo di mercato meno usato finora nella lista -
    // 1X2, combo, Gol/NoGol, Under/Over - e a parita' la piu' vicina al
    // 65%. Se nella fascia non c'e' niente, resta la piu' probabile.
    // Cambia solo cosa si mostra: le probabilita' sono quelle del file.
    // (14/11) LA PROPOSTA PER AFFIDABILITA', NON PER VARIETA'. Fra le
    // probabilita' 55-80% si tolgono quelle su cui il mercato si e' mosso
    // contro di almeno 2 punti (Mov_Sel, da prezzi_equi.py); poi vince il
    // prezzo piu' affidabile: margine stretto, margine piu' basso, movimento
    // a favore, e a parita' la piu' vicina al 65%.
    function proposta(g) {
      var cand = g.filter(function (r) {
        var p = num(r.Prob), mv = num(r.Mov_Sel);
        return p != null && p >= 55 && p <= 80 && !(mv != null && mv <= -2);
      });
      if (!cand.length) return g.slice().sort(function (a, b) { return (num(b.Prob) || 0) - (num(a.Prob) || 0); })[0];
      var mg = function (r) { var m = num(r.Margine); return m == null ? 99 : m; };
      cand.sort(function (a, b) {
        return ((margineStretto(a) ? 0 : 1) - (margineStretto(b) ? 0 : 1)) ||
          (Math.round(mg(a) * 2) - Math.round(mg(b) * 2)) ||
          ((num(b.Mov_Sel) || 0) - (num(a.Mov_Sel) || 0)) ||
          (Math.abs(num(a.Prob) - 65) - Math.abs(num(b.Prob) - 65));
      });
      return cand[0];
    }
    var html = SEZ[sez].riepilogo(visibili) +
      '<p class="conta">' + gruppi.length + (gruppi.length === 1 ? " partita" : " partite") + " · " +
      visibili.length + " probabilità" + SEZ[sez].nota + '</p><div class="lista">' +
      mostrateG.map(function (g) {
        var r0 = g[0], inSch = g.filter(function (r) { return String(r.InSchedina || "") === "si"; })[0];
        var top = inSch || proposta(g);
        var gol = r0.Gol_Casa != null && r0.Gol_Ospite != null ? r0.Gol_Casa + "-" + r0.Gol_Ospite : "";
        var dentro = g.map(function (r) {
          var i = mostrate.length; mostrate.push(r);
          return rigaPrezzo(r, i);
        }).join("");
        var scelte_ = g.filter(function (r) { return scelte[chiave(r)]; }).length;
        // L'esito della giocata IN SCHEDINA sulla scheda chiusa, come nella
        // vista Schedina: si vede senza aprire la partita.
        var es = inSch ? (inSch.Esito || (inSch.Data && inSch.Data < oggi() ? "attesa" : null)) : null;
        var segnoEs = es === "presa" ? "\u2713" : es === "sbagliata" ? "\u2717" : es === "attesa" ? "\u2013" : "\u21ba";
        var titoloEs = es === "presa" ? "schedina vinta" : es === "sbagliata" ? "schedina persa" : es === "attesa" ? "risultato non disponibile" : "rimborso";
        // FUORI SCHEDINA, LA PROPOSTA: spunta grigia, che non conta nei
        // riquadri (deciso il 6/11). Solo presa o sbagliata.
        var ep = !es && (top._esito === "presa" || top._esito === "sbagliata") ? top._esito : null;
        var titoloEp = ep === "presa" ? "proposta uscita (fuori schedina)" : "proposta non uscita (fuori schedina)";
        // (173) una partita con un esito solo resta la riga di sempre: la
        // scheda con dentro un esito solo sarebbe piu' lunga, non piu' corta
        if (mercato && g.length === 1) return conAggancio(dentro, sez, r0);
        if (mercato) {
          // (173) la partita una volta sola, gli esiti sotto gia' aperti; il
          // margine e' lo stesso per tutti: sta in testa, una volta
          var fidM = fiducia(num(r0.Margine), r0.Fonte);
          return '<div class="riga partitona mercato' + (scelte_ ? " scelta" : "") + (es ? " finita" : "") + '">' +
            (es ? '<span class="spunta esito ' + esc(es) + '" title="' + titoloEs + '" aria-label="' + titoloEs + '">' + segnoEs + "</span>"
              : ep ? '<span class="spunta esito proposta" title="' + titoloEp + '" aria-label="' + titoloEp + '">' +
                (ep === "presa" ? "\u2713" : "\u2717") + "</span>" : "") +
            '<div class="mercato-corpo"><details><summary><div class="corpo">' +
            '<div class="alto"><span>' + esc(r0.Ora || "") + "</span>" +
            (r0.Fonte === "Pinnacle" ? '<span class="timbro-pin" title="Prezzi da Pinnacle">Pinnacle</span>' : "") +
            (gol ? risHtml(gol, es || ep, "risultato finale") : "") +
            (r0.Campionato ? '<span class="chip">' + esc(r0.Campionato) + "</span>" : "") +
            (eAltroBook(r0.Fonte) ? '<span class="chip" title="Pinnacle non quota questa partita: prezzo da ' + esc(r0.Fonte) + '">quota ' + esc(r0.Fonte) + "</span>" : "") +
            (fidM ? '<span class="pill ' + fidM[0] + '" title="' + esc(fidM[1]) + '">margine ' + f1(num(r0.Margine)) + "%</span>" : "") +
            pillConsenso(g.filter(function (x) { return x._cons; })[0]) + "</div>" +
            '<div class="partita">' + partitaHtml(r0.Casa, r0.Ospite, r0.Partita, campiRiga(r0)) + "</div>" + sqHtml(r0) +
            (inSch ? '<div class="sel"><b>In schedina:</b> <span class="q-n' + (eVerde(num(inSch.Prob)) ? " verde" : "") + '">' + esc(etichettaSel(inSch)) + " · " + f0(num(inSch.Prob)) + "%</span></div>" : "") +
            "</div></summary>" +
            '<div class="dentro-partita">' +
            '<div class="info-api" data-casa="' + esc(r0.Casa || "") + '" data-ospite="' + esc(r0.Ospite || "") + '" data-ora="' + esc(r0.Ora || "") + '" data-id="' + esc(r0.ID_API || "") + '"></div>' +
            (r0.Casa && r0.Ospite ? '<p class="aggancio" data-alias="' + esc(aliasDi(sez, r0)) + '"></p>' : "") +
            "</div></details>" +
            '<div class="dentro-partita esiti">' + dentro + "</div></div></div>";
        }
        return '<div class="riga partitona' + (scelte_ ? " scelta" : "") + (es ? " finita" : "") + '">' +
          (es ? '<span class="spunta esito ' + esc(es) + '" title="' + titoloEs + '" aria-label="' + titoloEs + '">' + segnoEs + "</span>"
            : ep ? '<span class="spunta esito proposta" title="' + titoloEp + '" aria-label="' + titoloEp + '">' +
              (ep === "presa" ? "\u2713" : "\u2717") + "</span>" : "") +
          '<details><summary><div class="corpo">' +
          '<div class="alto"><span>' + esc(r0.Ora || "") + "</span>" +
          // (119) Prezzo da Pinnacle: lo dice il timbro, non piu' la scritta
          // "quota Pinnacle" accanto (erano due cose uguali).
          (r0.Fonte === "Pinnacle" ? '<span class="timbro-pin" title="Prezzi da Pinnacle">Pinnacle</span>' : "") +
          // (171) l'1X2 aggiornato col ponte dopo l'ultimo calcolo dei prezzi
          (function () { var f = g.filter(function (x) { return x._fresca; })[0]; return f ? '<span class="pill fresca" title="1X2 aggiornato con la quota Pinnacle">\u21bb ' + esc(f._fresca) + "</span>" : ""; })() +
          (gol ? risHtml(gol, es || ep, es === "presa" || ep === "presa" ? "proposta uscita" : es === "sbagliata" || ep === "sbagliata" ? "proposta non uscita" : "risultato finale") : "") +
          (r0.Campionato ? '<span class="chip">' + esc(r0.Campionato) + "</span>" : "") +
          (r0.Fonte === "OddsAPI" ? '<span class="chip">quota Betfair</span>' : "") +
          pillConsenso(g.filter(function (x) { return x._cons; })[0]) +
          (eAltroBook(r0.Fonte) ? '<span class="chip" title="Pinnacle non quota questa partita: prezzo da ' + esc(r0.Fonte) + '">quota ' + esc(r0.Fonte) + "</span>" : "") + "</div>" +
          '<div class="partita">' + partitaHtml(r0.Casa, r0.Ospite, r0.Partita, campiRiga(r0)) + "</div>" + sqHtml(r0) +
          '<div class="sel">' + (inSch ? "<b>In schedina:</b> " : "<b>Proposta:</b> ") + '<span class="q-n' + (eVerde(num(top.Prob)) ? " verde" : "") + '">' + esc(etichettaSel(top)) +
          " · " + f0(num(top.Prob)) + "%</span>" + (scelte_ ? " · " + scelte_ + " nella multipla" : "") + "</div>" +
          '</div><div class="numero"><b>' + g.length + "</b><span>" + (g.length === 1 ? "probabilità" : "probabilità") + "</span></div></summary>" +
          '<div class="dentro-partita">' +
          '<div class="info-api" data-casa="' + esc(r0.Casa || "") + '" data-ospite="' + esc(r0.Ospite || "") + '" data-ora="' + esc(r0.Ora || "") + '" data-id="' + esc(r0.ID_API || "") + '"></div>' + dentro +
          (r0.Casa && r0.Ospite ? '<p class="aggancio" data-alias="' + esc(aliasDi(sez, r0)) + '"></p>' : "") +
          "</div></details></div>";
      }).join("") + "</div>";
    if (gruppi.length > mostrateG.length) {
      html += '<button type="button" class="altre" id="altre">Mostra altre ' +
        Math.min(PASSO, gruppi.length - mostrateG.length) + " partite (ne restano " +
        (gruppi.length - mostrateG.length) + ")</button>";
    }
    $r.innerHTML = html;
    var a = document.getElementById("altre");
    if (a) a.addEventListener("click", function () { stato.limite += PASSO; ridisegnaRighe(); });

    $r.querySelectorAll(".partitona > details").forEach(function (det) {

    });
    $r.querySelectorAll("[data-esito]").forEach(function (b) {
      b.addEventListener("click", function () {

    $r.querySelectorAll("[data-stretti]").forEach(function (b) {

    $r.querySelectorAll("input[data-chiave]").forEach(function (cb) {
      cb.addEventListener("change", function () {

        var box = cb.closest(".partitona");
        if (box) box.classList.toggle("scelta", !!box.querySelector("input[data-chiave]:checked"));
        aggiornaMultipla();

  }

  // ------------------------------------------- la ricerca negli altri giorni
  //
  // Chi cerca "Milan" su Oggi non trova il derby di sabato: sta in un altro
  // giorno, o in un'altra vista. Quando la ricerca non trova niente, si
  // guardano le altre giornate della stessa sezione (e le altre viste di
  // questa) e si propone dove andare. Stessi file e stessa ricerca di
  // testoCerca(): niente regole nuove.
  function cercaAltrove(sez, data, cerca, righeOggi) {
    var q = cerca.toLowerCase(), conf = SEZ[sez], vista = stato.vista[sez];
    // Dove mandare chi non trova: nei Pronostici la vista per partita.
    var VISTA_AMPIA = sez === "prezzi" ? "partite" : "tutte";
    var haTutte = conf.viste.some(function (v) { return v[0] === VISTA_AMPIA; });
    // Prima il giorno scelto, poi i prossimi dal piu' vicino, poi i
    // passati dal piu' recente: chi cerca una partita di solito la cerca
    // in arrivo.
    var o = oggi();
    var date = (DATE_SEZ[sez] || []).slice().sort(function (a, b) {
      function rango(d) { return d === data ? 0 : d >= o ? 1 : 2; }
      var ra = rango(a), rb = rango(b);
      if (ra !== rb) return ra - rb;
      return ra === 2 ? (a < b ? 1 : -1) : (a < b ? -1 : 1);
    });
    function partite(righe) {
      var n = 0, inVista = 0, nomi = [];
      (Array.isArray(righe) ? righe : []).forEach(function (r) {
        if (testoCerca(r).indexOf(q) < 0) return;
        n++;
        if (conf.tiene(r, vista)) inVista++;
        var nome = r.Casa && r.Ospite ? r.Casa + " – " + r.Ospite : (r.Partita || "");
        if (nome && nomi.indexOf(nome) < 0) nomi.push(nome);
      });
      return { n: n, inVista: inVista, nomi: nomi };
    }
    var carichi = date.map(function (d) {
      if (d === data) return Promise.resolve([d, partite(righeOggi)]);
      return leggi((passate[d] || conf.prefisso) + d + ".json")
        .then(function (r) { return [d, partite(r)]; }, function () { return [d, null]; });
    });
    Promise.all(carichi).then(function (ris) {
      var $a = document.getElementById("altrove");
      // La pagina e' cambiata intanto (altra ricerca, altro giorno): niente.
      if (!$a || stato.sez !== sez || stato.data[sez] !== data || stato.cerca !== cerca) return;
      var voci = ris.filter(function (x) { return x[1] && x[1].n && (x[0] !== data || haTutte); })
        .map(function (x) {
          var d = x[0], t = x[1];
          // La vista resta quella scelta se la partita ci sta; se no "Tutte".
          var nuova = t.inVista ? vista : (haTutte ? VISTA_AMPIA : vista);
          if (d === data && nuova === vista) return "";
          var mostra = t.nomi.slice(0, 2).map(esc).join(", ") + (t.nomi.length > 2 ? " e altre " + (t.nomi.length - 2) : "");
          var nomeVista = (conf.viste.filter(function (v) { return v[0] === nuova; })[0] || [])[1] || "";
          return '<button type="button" class="vai-altrove" data-vai-data="' + esc(d) + '" data-vai-vista="' + esc(nuova) + '">' +
            "<b>" + esc(d === data ? "Questo giorno" : etichettaData(d)) + "</b>" +
            (nuova !== vista ? ' <span class="piccolo">· vista ' + esc(nomeVista) + "</span>" : "") +
            "<span>" + mostra + " · " + t.n + (t.n === 1 ? " riga" : " righe") + "</span></button>";
        }).filter(Boolean);
      $a.innerHTML = voci.length
        ? '<p class="piccolo">“' + esc(cerca) + "” si trova qui:</p>" + voci.join("")
        : '<p class="piccolo">Nemmeno negli altri giorni pubblicati in questa sezione.' +
          (sez === "mercato" ? " Il Mercato ha solo le partite delle prossime 24 ore: le altre si trovano in Probabilit\u00e0 senza margine." : "") + "</p>";
      $a.querySelectorAll("[data-vai-data]").forEach(function (b) {
        b.addEventListener("click", function () {
          stato.data[sez] = b.dataset.vaiData;
          stato.vista[sez] = b.dataset.vaiVista;
          if (sez === "prezzi" && b.dataset.vaiVista === "partite" && stato.ordine.prezzi === "file") stato.ordine.prezzi = "ora";
          stato.limite = PASSO; stato.esito = "";
          window.scrollTo(0, 0);
          disegna();
        });
      });
    });
  }

  // --------------------------------------------------------- grafica

  function mediana(a) {
    a = a.filter(function (x) { return x != null; }).sort(function (x, y) { return x - y; });
    if (!a.length) return null;
    var m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }
  // (172) VINTE, PERSE E ATTESE, LE STESSE CASELLE IN OGNI PAGINA che
  // propone un pronostico per partita con la sua probabilita'. Per ogni
  // pagina: quale pronostico e con che probabilita' (in %). Le doppie
  // (1X, X2, 12) valgono se esce uno dei due segni, con la somma delle due
  // probabilita'. Il risultato e' il punteggio della riga (dalla scheda o
  // dal calendario). Pinnacle no: e' il mercato, il metro degli altri.
  function esitoSegno(seg, r, p, prob) {
    seg = String(seg || "").toUpperCase().trim();
    if (!/^(1|X|2|1X|X2|12)$/.test(seg)) return null;
    var u = segnoUscito(r);
    if (!u) return null;
    var pr = prob != null ? num(prob) : null;
    if (pr == null && p) {
      var tot = 0, ok = true;
      seg.split("").forEach(function (c) { var x = p["1X2".indexOf(c)]; if (x == null) ok = false; else tot += x; });
      pr = ok ? tot : null;
    }
    return { esito: seg.indexOf(u) >= 0 ? "presa" : "sbagliata", prob: pr };
  }
  var ESITO_SEZ = {
    consensus: function (r) { return esitoSegno(r.Segno, r, [num(r.P1), num(r.PX), num(r.P2)]); },
    accordo: function (r) { return esitoSegno(r["Pron Combinato"], r, [num(r["P_1 %"]), num(r["P_X %"]), num(r["P_2 %"])]); },
    poisson: function (r) { return esitoSegno(r.Segno, r, [num(r.P1), num(r.PX), num(r.P2)]); },
    sm: function (r) { return esitoSegno(r.Segno, r, null, r._fav); },
    fp: function (r) { return esitoSegno(r.Segno, r, null, r._fav); },
    wdw: function (r) {
      var e = esitoSegno(r.Segno, r, null, r._fav);
      if (e || !/^[1X2]$/.test(String(r.Esito || "")) || !/^[1X2]$/.test(String(r.Segno || ""))) return e;
      return { esito: r.Esito === r.Segno ? "presa" : "sbagliata", prob: r._fav };
    },
    hp: function (r) {
      var e = hpEsito(r);
      return e === "vinto" || e === "perso" ? { esito: e === "vinto" ? "presa" : "sbagliata", prob: r._pulita } : null;
    }
  };
  function caselleEsito(prese, sbagliate, attese, etichetta, attivo) {
    var p = attivo || "", quota = 100 * prese / (prese + sbagliate);
    return '<div class="riepilogo">' +
      '<button type="button" class="filtro-esito' + (p === "presa" ? " attivo" : "") + '" data-esito="presa"><b><em style="font-style:normal;color:var(--buono)">\u2713 ' + prese + "</em></b><span>" + etichetta[0] + (p === "presa" ? " \u00b7 mostra tutte" : "") + "</span></button>" +
      '<button type="button" class="filtro-esito' + (p === "sbagliata" ? " attivo" : "") + '" data-esito="sbagliata"><b><em style="font-style:normal;color:var(--male)">\u2717 ' + sbagliate + "</em></b><span>" + etichetta[1] + (p === "sbagliata" ? " \u00b7 mostra tutte" : "") + "</span></button>" +
      "<div><b>" + quota.toFixed(0) + "%</b><span>vinte" +
      (attese != null ? " \u00b7 attese " + attese.toFixed(0) + "%" : "") + "</span></div></div>";
  }
  var LINK_STORICO = ' <a href="#fonti" class="link-storico">Lo storico delle fonti \u2192</a>';
  function tessereEsito(sez, v) {
    var f = ESITO_SEZ[sez];
    if (!f) return "";
    var base = stato.esito && baseEsiti ? baseEsiti : v;
    if (stato.cerca && !stato.esito) base = v;
    var es = base.map(f).filter(function (e) { return e && (e.esito === "presa" || e.esito === "sbagliata"); });
    if (!es.length) return "";
    var prese = es.filter(function (e) { return e.esito === "presa"; }).length;
    var pr = es.map(function (e) { return num(e.prob); }).filter(function (x) { return x != null; });
    var attese = pr.length === es.length ? pr.reduce(function (a, x) { return a + x; }, 0) / pr.length : null;
    return caselleEsito(prese, es.length - prese, attese, ["vinte", "perse"], stato.esito) +
      '<p class="conta">Su ' + es.length + (es.length === 1 ? " partita finita" : " partite finite") +
      " del pronostico di questa pagina. Tocca \u2713 o \u2717 per vedere solo quelle. " +
      "Un giorno solo \u00e8 quasi tutto caso." + LINK_STORICO + "</p>";
  }
  function tessere(voci) {
    return '<div class="riepilogo">' + voci.map(function (v) {
      return "<div><b>" + v[0] + "</b><span>" + v[1] + "</span></div>";
    }).join("") + "</div>";
  }

  // Le mediane e non le medie: una quota a 9.00 sposterebbe la media di
  // tutta la lista, la mediana resta dov'e' la riga tipica.
  // Le righe della giornata PRIMA del filtro prese/sbagliate: i conteggi
  // dei riquadri restano quelli di tutta la schedina anche col filtro.
  var baseEsiti = null;
  var baseStrette = null;
  var SOGLIA_STRETTO = 3;
  // (171) "Piu' book" (FootyMetrics) mette insieme le quote migliori di book
  // diversi: il suo margine esce basso per costruzione, quindi per lui il
  // verde vuol dire sotto il 2%. Per i book singoli (Pinnacle...) il 3%.
  function sogliaStretto(fonte) { return fonte === "FootyMetrics" ? 2 : SOGLIA_STRETTO; }
  function margineStretto(r) { var m = num(r.Margine); return m != null && m < sogliaStretto(r.Fonte); }
  function riepilogoPrezzi(v) {
    var eq = mediana(v.map(function (r) { return num(r.Equa); }));
    var mg = mediana(v.map(function (r) { return num(r.Margine); }));
    // Col filtro acceso i conteggi restano quelli di tutta la giornata.
    var base = stato.stretti && baseStrette ? baseStrette : v;
    if (stato.cerca && !stato.stretti) base = v;
    var strette = base.filter(margineStretto).length;
    var tutteE = stato.esito && baseEsiti ? baseEsiti : v;
    var prese = tutteE.filter(function (r) { return r.Esito === "presa"; }).length;
    var sbagliate = tutteE.filter(function (r) { return r.Esito === "sbagliata"; }).length;
    if (prese + sbagliate) {
      // Senza risultato si contano solo le righe della schedina: le altre
      // non hanno esito per scelta, non perche' manchi il risultato.
      var attesa = tutteE.filter(function (r) { return !r.Esito && String(r.InSchedina || "") === "si"; }).length;
      // LA PERCENTUALE DA SOLA NON DICE SE E' ANDATA BENE: con pronostici
      // al 70% ci si aspetta di prenderne 7 su 10, con pronostici al 55%
      // ne bastano 5 e mezzo. Accanto si mette quante ne promettevano le
      // probabilita' delle stesse partite finite (media dei Prob): e'
      // il confronto onesto. I rimborsi non contano ne' da una parte ne'
      // dall'altra.
      var decise = tutteE.filter(function (r) { return r.Esito === "presa" || r.Esito === "sbagliata"; });
      var pr = decise.map(function (r) { return num(r.Prob); }).filter(function (x) { return x != null; });
      var attese = pr.length ? pr.reduce(function (s, x) { return s + x; }, 0) / pr.length : null;
      var quota = 100 * prese / (prese + sbagliate);
      // I due riquadri sono pulsanti: toccandoli restano solo le prese o
      // solo le sbagliate; ritoccandoli si torna a tutte.
      var p = stato.esito;
      return '<div class="riepilogo">' +
        '<button type="button" class="filtro-esito' + (p === "presa" ? " attivo" : "") + '" data-esito="presa"><b><em style="font-style:normal;color:var(--buono)">\u2713 ' + prese + "</em></b><span>vinte in schedina" + (p === "presa" ? " \u00b7 mostra tutte" : "") + "</span></button>" +
        '<button type="button" class="filtro-esito' + (p === "sbagliata" ? " attivo" : "") + '" data-esito="sbagliata"><b><em style="font-style:normal;color:var(--male)">\u2717 ' + sbagliate + "</em></b><span>perse in schedina" + (p === "sbagliata" ? " \u00b7 mostra tutte" : "") + "</span></button>" +
        "<div><b>" + quota.toFixed(0) + "%</b><span>vinte" +
        (attese != null ? " \u00b7 attese " + attese.toFixed(0) + "%" : "") + "</span></div></div>" +
        '<p class="conta">' + (attesa ? attesa + (attesa === 1 ? " partita ancora senza risultato. " : " partite ancora senza risultato. ") : "") +
        "Tocca \u2713 o \u2717 per vedere solo quelle. Le partite finite sono in cima. Un giorno solo \u00e8 quasi tutto caso." + LINK_STORICO + "</p>";
    }
    var on = stato.stretti;
    return '<div class="riepilogo">' +
      "<div><b>" + (eq == null ? "-" : eq.toFixed(2)) + "</b><span>quota equa mediana</span></div>" +
      "<div><b>" + (mg == null ? "-" : mg.toFixed(1) + "%") + "</b><span>margine mediano</span></div>" +
      '<button type="button" class="filtro-esito' + (on ? " attivo" : "") + '" data-stretti="1"' +
      (strette ? "" : " disabled") + ' aria-pressed="' + (on ? "true" : "false") + '"><b>' + strette +
      '<small style="font-size:.7em;color:var(--tenue)"> / ' + base.length + "</small></b><span>" +
      (on ? "margine sotto il 3% \u00b7 mostra tutte" : "con margine sotto il 3%") + "</span></button></div>" +
      (strette && !on ? '<p class="conta">Tocca il riquadro del 3% per vedere solo quelle.</p>' : "");
  }

  function riepilogoConsensus(v) {
    var conM = v.filter(function (r) { return num(r.Scarto) != null; });
    var multi = v.filter(function (r) { return (num(r.Fonti) || 0) >= 2; }).length;
    var sc = mediana(conM.map(function (r) { return Math.abs(num(r.Scarto)); }));
    return tessere([
      [String(v.length), "partite"],
      [String(multi), "con due fonti o più"],
      [sc == null ? "-" : sc.toFixed(1), "scarto tipico dal mercato, in punti"]
    ]) +
      (stato.fonteCm && fuoriMedia(stato.fonteCm)
        ? '<p class="descr">' + esc(nomeCm(stato.fonteCm)) + " non entra nella media: il suo pronostico \u00e8 scritto sotto ogni partita, " +
          "le barre e le percentuali restano quelle delle altre fonti.</p>" : "") +
      legenda();
  }

  // Una barra 1-X-2. Il numero sta dentro il pezzo quando c'e' posto;
  // il valore esatto e' comunque scritto nel dettaglio della partita.
  function tripla(nome, a, x, b) {
    if (a == null || x == null || b == null) return "";
    var tot = a + x + b || 1;
    function pezzo(cls, val, et) {
      var w = val / tot * 100;
      return '<i class="' + cls + '" style="flex-grow:' + w.toFixed(2) + '" title="' + et + " " + f0(val) + '%">' +
        (w >= 13 ? f0(val) : "") + "</i>";
    }
    return '<div class="tripla"><span class="nome">' + nome + "</span>" +
      '<div class="barre" role="img" aria-label="' + nome + ": 1 " + f0(a) + "%, X " + f0(x) + "%, 2 " + f0(b) + '%">' +
      pezzo("s1", a, "1") + pezzo("sx", x, "X") + pezzo("s2", b, "2") + "</div></div>";
  }

  function barra(nome, pct, testo, cls) {
    var w = Math.max(0, Math.min(100, num(pct) || 0));
    return '<div class="hb' + (cls ? " " + cls : "") + '"><div class="hb-r"><span class="n">' + esc(nome) + "</span>" +
      '<span class="v">' + testo + '</span></div><span class="t"><i style="width:' + w + '%"></i></span></div>';
  }

  // Due Brier sulle STESSE partite, su una scala ristretta. Ristretta
  // perche' le differenze sono di centesimi: da zero sarebbero due punti
  // sovrapposti. Va detto, altrimenti la distanza sembra piu' grande.
  function striscia(voci) {
    voci = voci.filter(function (v) { return num(v[1]) != null; });
    if (voci.length < 2) return "";
    var vs = voci.map(function (v) { return num(v[1]); });
    var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
    var pad = (hi - lo) * 0.6 || 0.005;
    lo -= pad; hi += pad;
    return '<div class="brier">' + voci.map(function (v) {
      var p = (num(v[1]) - lo) / (hi - lo) * 100;
      return '<div class="r ' + v[2] + '"><span>' + esc(v[0]) + '</span><div class="pista"><b style="left:' +
        p.toFixed(1) + '%"></b></div><em>' + esc(v[1]) + "</em></div>";
    }).join("") +
      '<p class="piccolo">Più a sinistra è meglio. Scala ingrandita: le differenze sono di centesimi.</p></div>';
  }

  function ordina(sez, v) {
    var o = stato.ordine[sez];
    if (o === "paese") v.sort(function (a, b) {
      return String(a.Lega || "").localeCompare(String(b.Lega || "")) || String(a.Casa || "").localeCompare(String(b.Casa || ""));
    });
    if (o === "ora") v.sort(function (a, b) { return (a.Ora || "").localeCompare(b.Ora || ""); });
    else if (o === "margine") v.sort(function (a, b) {
      var x = num(a.Margine), y = num(b.Margine);
      return (x == null ? 99 : x) - (y == null ? 99 : y);
    });
    else if (o === "scarto") v.sort(function (a, b) {
      var x = scartoDi(a), y = scartoDi(b);
      return (y == null ? -1 : Math.abs(y)) - (x == null ? -1 : Math.abs(x));
    });
    // La probabilita' del segno indicato, dalla piu' alta. A parita' vince
    // chi ha piu' fonti: lo stesso 70% detto da tre siti pesa piu' di uno.
    else if (o === "prob") v.sort(function (a, b) {
      return ((probOrdine(b) || 0) - (probOrdine(a) || 0)) || ((num(b.Fonti) || 0) - (num(a.Fonti) || 0));
    });
    else if (o === "mov") v.sort(function (a, b) { return (num(b.Mov) || 0) - (num(a.Mov) || 0); });
    // Gol attesi: la linea Under/Over principale e' quella dove Over e Under
    // si equivalgono, quindi conta la linea (2.25, 2.5, 3...), poi l'Over.
    else if (o === "over") v.sort(function (a, b) {
      return ((num(b.OU) || 0) - (num(a.OU) || 0)) || ((num(b["P Over"]) || 0) - (num(a["P Over"]) || 0));
    });
    else if (o === "gol") v.sort(function (a, b) { return (num(b.Gol_Attesi) || 0) - (num(a.Gol_Attesi) || 0); });
    else if (o === "fonti") v.sort(function (a, b) { return (num(b.Fonti) || 0) - (num(a.Fonti) || 0); });
    // "file": l'ordine del file, che e' quello che mostra Kodi.
    // Nei Pronostici le partite gia' finite (con la V o la X) vanno in
    // cima, nell'ordine scelto: sono quelle che si cercano per prime.
    if (sez === "prezzi" && v.some(function (r) { return r.Esito; })) {
      var fin = v.filter(function (r) { return r.Esito; }), alt = v.filter(function (r) { return !r.Esito; });
      v = fin.concat(alt);
    }
    return v;
  }

  function probSegno(r) {
    var s = String(r.Segno || "").toUpperCase();
    return num(s === "1" ? r.P1 : s === "X" ? r.PX : s === "2" ? r.P2 : null);
  }
  function probOrdine(r) {
    if (r._prob != null) return r._prob * 100;
    if (r["Pron Combinato"] != null) return probCombinato(r);
    return probSegno(r);
  }
  function scartoDi(r) { var v = num(r.Scarto); return v != null ? v : num(r.Scarto_Segno); }

  function vuotoPerVista(sez, vista, n, data) {
    if (sez === "mercato") {
      if (vista === "aff") return "Nessuna partita a margine basso fra le " + n + " del " + data + ". Prova \u201cTutte\u201d.";
      if (vista === "mov") return "Nessun movimento notevole fra le " + n + " partite del " + data + ". Prova \u201cTutte\u201d.";
    }
    if (sez === "sure") {

  function versoLinea(a) {

  var $m = document.getElementById("multipla");

  // Il margine si compone a ogni evento: la quota equa cresce col
  // prodotto, quella pagata perde il margine di ogni partita. La stima
  // usa il margine riportato per ciascuna riga, con la stessa aritmetica
  // del documento di stato (1.60 equa, 6% x 10 eventi -> 0.89).
  function aggiornaMultipla() {
    var r = Object.keys(scelte).map(function (k) { return scelte[k]; });
    if (!r.length) { $m.hidden = true; chiudiInvio(); document.body.style.paddingBottom = ""; return; }
    $m.hidden = false;
    var equa = 1, pagata = 1, prob = 1, senzaMarg = 0;
    r.forEach(function (x) {
      var e = num(x.Equa), m = num(x.Margine), p = num(x.Prob);
      equa *= e || 1;
      prob *= p != null ? p / 100 : 1;
      if (m == null) { senzaMarg++; pagata *= e || 1; } else pagata *= (e || 1) / (1 + m / 100);
    });
    var perdita = (pagata / equa - 1) * 100;
    document.getElementById("m-eventi").textContent =
      r.length + (r.length === 1 ? " evento" : " eventi") + " · probabilità " + (prob * 100).toFixed(1) + "%";
    document.getElementById("m-equa").textContent = "equa " + equa.toFixed(2);
    document.getElementById("m-stima").textContent =
      "Col margine di ciascuna partita il book pagherebbe circa " + pagata.toFixed(2) +
      " (" + perdita.toFixed(0) + "%)." +
      (senzaMarg ? " " + senzaMarg + " righe senza margine, contate a prezzo pieno." : "") +
      " Il tuo bookmaker può caricarne di più: confronta la quota che vedi con l'Equa, e se giochi tocca Registra.";

  var SITO = "https://caltiki.github.io/pronostici-repo/sito/";
  var MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio",
    "agosto", "settembre", "ottobre", "novembre", "dicembre"];
  var GIORNI_LUNGHI = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];

  function dataLunga(d) {
    var t = new Date(d + "T12:00:00Z");
    if (isNaN(t)) return d || "";
    return GIORNI_LUNGHI[t.getUTCDay()] + " " + t.getUTCDate() + " " + MESI[t.getUTCMonth()];
  }

  function righeScelte() {
    return Object.keys(scelte).map(function (k) { return scelte[k]; }).sort(function (a, b) {
      var x = (a.Data || "") + " " + (a.Ora || ""), y = (b.Data || "") + " " + (b.Ora || "");
      return x < y ? -1 : x > y ? 1 : String(a.Partita || "").localeCompare(String(b.Partita || ""));
    });

  function conti(r) {
    var equa = 1, pagata = 1, prob = 1;
    r.forEach(function (x) {
      var e = num(x.Equa), m = num(x.Margine), p = num(x.Prob);
      equa *= e || 1;
      prob *= p != null ? p / 100 : 1;
      pagata *= m == null ? (e || 1) : (e || 1) / (1 + m / 100);
    });
    return { equa: equa, pagata: pagata, prob: prob * 100 };
  }

  function testoMultipla() {
    var r = righeScelte(), c = conti(r), out = ["Multipla - Sistema Pronostici", ""], giorno = null;
    r.forEach(function (x) {

        if (giorno !== null) out.push("");
        giorno = x.Data;
        var g = dataLunga(giorno);
        out.push(g.charAt(0).toUpperCase() + g.slice(1));

      out.push((x.Ora ? x.Ora + "  " : "") + (x.Partita || ""));
      if (x.Campionato) out.push("    " + x.Campionato);

        " (" + f0(num(x.Prob)) + "%)");

  function rettangolo(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);

  // Al massimo "quante" righe; l'ultima chiude con i puntini se non ci sta.
  function aCapo(ctx, t, larg, quante) {
    var parole = String(t || "").split(/\s+/), righe = [], cor = "";
    for (var i = 0; i < parole.length; i++) {
      var prova = cor ? cor + " " + parole[i] : parole[i];
      if (ctx.measureText(prova).width <= larg || !cor) cor = prova;
      else { righe.push(cor); cor = parole[i]; }
    }
    if (cor) righe.push(cor);
    if (righe.length > quante) {
      righe = righe.slice(0, quante);
      var u = righe[quante - 1];
      while (u.length > 1 && ctx.measureText(u + "…").width > larg) u = u.slice(0, -1);
      righe[quante - 1] = u.replace(/\s+$/, "") + "…";

  function disegnaMultipla(ctx, W, col, disegnaDavvero) {
    var r = righeScelte(), c = conti(r), P = 56, y = P;

    // Testa: titolo a sinistra, quota equa a destra.

  // ---- l'esito di un evento
  function partiEvento(x) {
    var merc = String(x.Mercato || ""), sel = String(x.Sel || "");
    function una(s, mercOu) {
      s = s.trim();
      if (s === "1" || s === "X" || s === "2") return ["1X2", s, null];
      if (s === "1X" || s === "X2" || s === "12") return ["DC", s, null];
      if (s === "Gol") return ["BTTS", "SI", null];
      if (s === "NoGol") return ["BTTS", "NO", null];
      var m = s.match(/^(Over|Under)(?:\s+(\d+(?:\.\d+)?))?$/);
      if (m) {
        var lin = parseFloat(m[2] || String(mercOu || "").replace("OU", "").trim());
        return isFinite(lin) ? ["OU", m[1].toUpperCase(), lin] : null;
      }
      return null;
    }
    var pezzi = sel.indexOf(" + ") >= 0 ? sel.split(" + ").map(function (s) { return una(s); }) : [una(sel, merc)];
    return pezzi.some(function (p) { return !p; }) ? null : pezzi;
  }
  function giustoJs(p, gc, go) {
    var e = gc > go ? "1" : gc < go ? "2" : "X";
    if (p[0] === "1X2") return p[1] === e;
    if (p[0] === "DC") return p[1].indexOf(e) >= 0;
    if (p[0] === "BTTS") { var ok = gc > 0 && go > 0; return p[1] === "SI" ? ok : !ok; }
    if (p[0] === "OU") { var t = gc + go; if (t === p[2]) return null; return p[1] === "OVER" ? t > p[2] : t < p[2]; }
    return null;
  }
  function esitoCalcolato(x, gc, go) {
    var pz = partiEvento(x);
    if (!pz) return null;
    var es_ = pz.map(function (p) { return giustoJs(p, gc, go); });
    if (es_.some(function (e) { return e === false; })) return "sbagliata";
    if (es_.some(function (e) { return e === null; })) return "rimborso";
    return "presa";
  }

  // ---- LA CHIUSURA PINNACLE (11/11). pinnacle_archivio.csv tiene, per ogni
  // partita letta col piano PRO, l'ultima quota prima del via. Per un
  // evento con ID_API (cioe' preso da una riga Pinnacle) si ricava la
  // probabilita' alla chiusura della SUA selezione: 1X2, doppia chance,
  // Under/Over sulla stessa linea della chiusura. Le combo no.
  // Battere la chiusura in media e' il segno che le giocate valgono,
  // molto prima che lo dica il saldo.
  var CHIUSURE = null;
  function caricaChiusure() {
    if (CHIUSURE) return Promise.resolve(CHIUSURE);
    return leggiTesto("pinnacle_archivio.csv").then(csvOggetti).then(function (v) {
      CHIUSURE = {};
      (v || []).forEach(function (r) { if (r.ID_API && r.Congelata === "si") CHIUSURE[String(r.ID_API)] = r; });
      return CHIUSURE;
    }).catch(function () { CHIUSURE = {}; return CHIUSURE; });
  }
  function probChiusura(e, ch) {
    var r = e.ID_API != null ? ch[String(e.ID_API)] : null;
    if (!r) return null;
    var p = { "1": num(r["P1 Shin"]), "X": num(r["PX Shin"]), "2": num(r["P2 Shin"]) };
    var sel = String(e.Sel || ""), merc = String(e.Mercato || "");
    if (sel.indexOf(" + ") >= 0) return null;
    if (p[sel] != null) return p[sel];
    if (sel === "1X" || sel === "X2" || sel === "12") {
      return p[sel[0]] != null && p[sel[1]] != null ? p[sel[0]] + p[sel[1]] : null;
    }
    var m = merc.match(/^OU\s+(\d+(?:\.\d+)?)$/), po = num(r["P Over"]), lin = num(r.OU);
    if (m && po != null && lin != null && Math.abs(parseFloat(m[1]) - lin) < 1e-6) {
      return sel === "Over" ? po : sel === "Under" ? 100 - po : null;
    }
    return null;
  }
  function clvGiocata(g, ch) {
    var eq = 1;
    for (var i = 0; i < g.eventi.length; i++) {
      var pc = probChiusura(g.eventi[i], ch);
      if (pc == null || pc <= 0) return null;
      eq *= 100 / pc;
    }
    return { equa: eq, clv: g.quota / eq - 1 };
  }

  // LA FONTE SCELTA NEL MENU. Le fonti del consenso medio sono quelle che

  // LA STESSA PARTITA SCRITTA IN DUE MODI. consensus_medio.py mette
  // insieme le fonti solo se scrivono le squadre uguali: "Atromitos -
  // Volos NFC" e "Atromitos Athinon - Volos NPS" diventavano due partite,
  // ciascuna con meta' delle fonti (il 3/11: 597 righe per 515 partite).
  // Qui NON si riconosce niente: si uniscono le righe che la scheda della
  // partita (scheda_partite.py, le cui unioni sono state riviste una per
  // una) mette nella stessa scheda. La media si rifa' pesata sul numero
  // di fonti di ciascuna riga, che e' la media di tutte le fonti: le
  // righe unite non hanno mai una fonte in comune (verificato il 3/11 su
  // tutte le 74 unioni), e se capitasse la fonte si conta una volta.
  // Nome, ora e campionato restano quelli della riga con piu' fonti; il
  // mercato quello della riga che lo ha.
  function unisciDoppioni(righe) {
    var gruppi = {}, ordine = [];

      var k = r._scheda != null ? "s" + r._scheda : "r" + ordine.length;

      gruppi[k].push(r);

    return ordine.map(function (k) {
      var g = gruppi[k];
      if (g.length === 1) return g[0];
      g = g.slice().sort(function (a, b) { return (num(b.Fonti) || 0) - (num(a.Fonti) || 0); });

          somma.P1 += num(r.P1) * w; somma.PX += num(r.PX) * w; somma.P2 += num(r.P2) * w; peso += w;
        }
        nuove.forEach(function (f) { fonti.push(f); });
      });
      if (peso > 0) {
        o.P1 = Math.round(somma.P1 / peso * 10) / 10;
        o.PX = Math.round(somma.PX / peso * 10) / 10;
        o.P2 = Math.round(somma.P2 / peso * 10) / 10;
      }
      o.Elenco = fonti.slice().sort().join(", ");
      o.Fonti = fonti.length;

      var m = g.filter(function (r) { return num(r.MP1) != null && num(r.MPX) != null && num(r.MP2) != null; })[0];
      ["MP1", "MPX", "MP2", "Segno_Mercato", "Scarto"].forEach(function (c) { delete o[c]; });
      if (m) {
        o.MP1 = m.MP1; o.MPX = m.MPX; o.MP2 = m.MP2; o.Segno_Mercato = m.Segno_Mercato;
        var ps = o.Segno === "1" ? o.P1 : o.Segno === "X" ? o.PX : o.P2;
        var ms = o.Segno === "1" ? num(m.MP1) : o.Segno === "X" ? num(m.MPX) : num(m.MP2);

      }

    });

  // QUANTE FONTI SONO D'ACCORDO COL SEGNO DELLA MEDIA, xGaura, Sportytrader
  // e WebPronostici comprese. Non tocca la media: e' un conteggio. Di ogni
  // fonte si guarda un solo pronostico sull'esito, il primo 1X2 secco o in

  // partita, letti da scheda_partite.py con le regole di misura_fonti.py.
  function accordoSegno(r) {
    var segno = String(r.Segno || "").toUpperCase();
    if (!r._prons || !/^[1X2]$/.test(segno)) return null;
    var per = {};
    r._prons.forEach(function (x) {
      if (x.Mercato !== "1X2" && x.Mercato !== "DC") return;
      var g = per[x.Fonte];
      if (!g || (g.Mercato === "DC" && x.Mercato === "1X2")) per[x.Fonte] = x;
    });
    var si = [], no = [];
    Object.keys(per).sort(function (a, b) { return nomeFonte(a).localeCompare(nomeFonte(b)); }).forEach(function (f) {
      var x = per[f];
      (String(x.Sel).indexOf(segno) >= 0 ? si : no).push(nomeFonte(f) + " " + x.Sel);
    });
    return si.length + no.length ? { segno: segno, si: si, no: no } : null;
  }
  function articolo(s) { return s === "X" ? "sulla X" : s === "2" ? "sul 2" : "sull'1"; }

  function cmTiene(r, tipo) {
    if (tipo === "mercato") return num(r.Scarto) != null;
    if (tipo === "multi") return (num(r.Fonti) || 0) >= 2;
    return true;
  }

  function rigaConsensus(r) {
    var segno = String(r.Segno || "").toUpperCase();
    var fonti = num(r.Fonti) || 0;
    var p1 = num(r.P1), px = num(r.PX), p2 = num(r.P2);
    var m1 = num(r.MP1), mx = num(r.MPX), m2 = num(r.MP2);
    var scarto = num(r.Scarto);
    var segnoM = String(r.Segno_Mercato || "").toUpperCase();
    var pSegno = segno === "1" ? p1 : segno === "X" ? px : p2;

    var coda = "";
    if (scarto != null) {
      coda = Math.abs(scarto) < 0.5 ? "in linea col mercato"
        : '<span class="' + (Math.abs(scarto) >= 10 ? "scarto-grosso" : "scarto") + '">' +
          (scarto > 0 ? "+" : "") + scarto.toFixed(0) + " vs mercato</span>";
    }

    var det = [];
    if (r.Lega) det.push("<p>" + esc(r.Lega) + "</p>");
    det.push("<p>Media delle fonti: 1 " + pv(p1) + " · X " + pv(px) + " · 2 " + pv(p2) + "</p>");
    var acc = accordoSegno(r);
    if (acc) {
      det.push("<p>D\u2019accordo " + articolo(acc.segno) + ": " + (acc.si.length ? esc(acc.si.join(", ")) : "nessuna") +
        (acc.no.length ? ". Contro: " + esc(acc.no.join(", ")) : "") +
        '. <span class="piccolo">Conta tutte le fonti, anche quelle fuori dalla media.</span></p>');
    }
    if (fonti === 1) det.push("<p>Fonte unica: " + esc(r.Elenco) + ". Non è una media, è quella fonte.</p>");
    else det.push("<p>Media di " + fonti + " fonti: " + esc(r.Elenco) + "</p>");
    if (m1 != null) {
      det.push("<p>Mercato (Shin): 1 " + pv(m1) + " · X " + pv(mx) + " · 2 " + pv(m2) + "</p>");
      if (segnoM && segnoM !== segno) {
        det.push('<p class="avviso">Segni diversi: le fonti dicono ' + esc(segno) + ", il mercato " + esc(segnoM) + ".</p>");
      }
      if (scarto != null) {
        det.push("<p>" + (/^[1X2]$/.test(segno) ? articolo(segno).replace(/^s/, "S") : "Sul " + esc(segno)) + ": le fonti danno " + Math.abs(scarto).toFixed(1) + " punti " +
          (scarto >= 0 ? "più" : "meno") + " del mercato.</p>");
        if (Math.abs(scarto) >= 10) {
          det.push('<p class="avviso">Scarto grosso. Sulle fonti misurate finora, quando si allontanano così dal mercato hanno torto più spesso, non meno.</p>');
        }
      }
    }

    return '<div class="riga"><details><summary>' +
      '<span class="segno">' + esc(segno || "?") + "</span>" +
      '<div class="corpo">' +
      '<div class="alto"><span>' + esc(r.Ora || "") + "</span>" + golHtml(r) + "<span>" + fonti + (fonti === 1 ? " fonte" : " fonti") + "</span></div>" +
      '<div class="partita">' + partitaHtml(r.Casa, r.Ospite, "", campiRiga(r)) + "</div>" + sqHtml(r) +
      (coda ? '<div class="sel">' + coda + "</div>" : "") +
      (acc ? '<div class="accordo-conta">D\u2019accordo ' + articolo(acc.segno) + ": <b>" + acc.si.length +
        "</b> " + (acc.si.length + acc.no.length === 1 ? "fonte su 1" : "su " + (acc.si.length + acc.no.length) + " fonti") + "</div>" : "") +
      pronFonteHtml(r) +
      tripla("fonti", p1, px, p2) +
      (m1 != null ? tripla("mercato", m1, mx, m2) : "") +
      "</div>" +
      '<div class="numero">' + pB(pSegno) + "<span>" + (/^[1X2]$/.test(segno) ? articolo(segno) : "sul " + esc(segno)) + "</span></div>" +
      "</summary>" +
      '<div class="dettaglio">' + det.join("") + "</div>" +
      "</details></div>";
  }

  // ------------------------------------------------------- poisson xG

  function legenda() {
    return '<div class="legenda"><span><i class="s1"></i>1 casa</span><span><i class="sx"></i>X pareggio</span>' +
      "<span><i class=\"s2\"></i>2 trasferta</span></div>";
  }

  function poTiene(r, tipo) {
    if (tipo === "mercato") return num(r.M_P1) != null;
    return true;
  }

  // Il fattore campo lo scrive poisson_xg.py nell'indice: quanto dei gol
  // segna la squadra di casa, e su quante partite e' stimato.
  function notaCampo(ix) {
    var q = num(ix.quota_casa);
    if (q == null) return "";
    return '<p class="descr">Fattore campo: la squadra di casa prende il ' + (q * 100).toFixed(1) +
      "% dei gol attesi" + (ix.partite_stima ? ", stimato su " + esc(ix.partite_stima) + " partite" : "") +
      (ix.stima_da ? " (" + esc(ix.stima_da) + ")" : "") + ".</p>";
  }

  function riepilogoPoisson(v) {
    var conM = v.filter(function (r) { return num(r.M_P1) != null; });
    var sc = mediana(conM.map(function (r) { var x = num(r.Scarto_Segno); return x == null ? null : Math.abs(x); }));
    // A PARTITA FINITA (8/11): quante volte e' uscito il segno del modello,
    // accanto a quante il modello ne attendeva e, dove c'e' il prezzo, a
    // quante ne dava il mercato sulle stesse partite.
    var fin = v.filter(function (r) { var s = String(r.Segno || "").toUpperCase(); return segnoUscito(r) && num(r["P" + s]) != null; });
    var conta = "";
    if (fin.length) {
      var presi = fin.filter(function (r) { return segnoUscito(r) === String(r.Segno).toUpperCase(); }).length;
      var att = fin.reduce(function (a, r) { return a + num(r["P" + String(r.Segno).toUpperCase()]); }, 0) / fin.length;
      var fm = fin.filter(function (r) { return num(r["M_P" + String(r.Segno).toUpperCase()]) != null; });
      var mk = fm.length ? fm.reduce(function (a, r) { return a + num(r["M_P" + String(r.Segno).toUpperCase()]); }, 0) / fm.length : null;
      // (172) vinte e attese stanno nelle caselle; qui resta il confronto col mercato
      conta = mk != null ? '<p class="conta">Sulle stesse partite finite il mercato dava al segno del modello il ' + Math.round(mk) + "% (su " + fm.length + " col prezzo).</p>" : "";
    }
    return tessere([
      [String(v.length), "partite"],
      [String(conM.length), "col prezzo del mercato"],
      [sc == null ? "-" : sc.toFixed(1), "scarto tipico sul segno, in punti"]
    ]) + conta + legenda();
  }

  // IN EVIDENZA I GOL ATTESI, come in Kodi: i lambda sono quello che il
  // modello produce davvero, le percentuali ne discendono.
  function rigaPoisson(r) {
    var segno = String(r.Segno || "").toUpperCase();
    var lc = num(r.Lambda_Casa), lo = num(r.Lambda_Osp), gol = num(r.Gol_Attesi);
    var p1 = num(r.P1), px = num(r.PX), p2 = num(r.P2);
    var m1 = num(r.M_P1), mx = num(r.M_PX), m2 = num(r.M_P2);
    var mgol = num(r.M_Gol_Attesi), mlin = num(r.M_Linea), mmarg = num(r.M_Margine);
    var ds = num(r.Scarto_Segno), dg = num(r.Scarto_Gol);
    var mpc = num(r.MP_Casa), mpo = num(r.MP_Osp);

    var coda = "";
    if (ds != null) {
      coda = Math.abs(ds) < 0.5 ? " \u00b7 in linea col mercato"
        : ' \u00b7 <span class="' + (Math.abs(ds) >= 10 ? "scarto-grosso" : "scarto") + '">' +
          (ds > 0 ? "+" : "") + ds.toFixed(0) + " vs mercato</span>";
    }

    var det = [];
    if (r.Lega) det.push("<p>" + esc(String(r.Lega).replace(/\s*\[\d+\]$/, "")) + "</p>");
    det.push("<p>Modello: 1 " + f0(p1) + "% \u00b7 X " + f0(px) + "% \u00b7 2 " + f0(p2) + "%" +
      (num(r.Equa_Segno) != null ? " \u2013 quota del modello sul " + esc(segno) + " " + f2(num(r.Equa_Segno)) : "") + "</p>");
    var usc = segnoUscito(r);
    if (usc && segno) {
      det.push("<p>Finita " + esc(r.Gol_Casa + "-" + r.Gol_Ospite) + (r.Risultato_Da ? " (risultato da " + esc(r.Risultato_Da) + ")" : "") +
        ": il segno del modello, " + esc(segno) + ", " + (usc === segno ? "\u00e8 uscito" : "non \u00e8 uscito") + ".</p>");
    }
    det.push("<p>Lambda: casa " + f2(lc) + ", ospite " + f2(lo) + " (gol attesi " + f2(gol) + ")</p>");
    // (171) gli xG partita per partita dello storico: sul sito "del sito"
    if (r.Fonte_xG) det.push("<p>" + (r.Fonte_xG === "API-Football" ? "xG del sito, partita per partita" : "xG da " + esc(r.Fonte_xG)) + ".</p>");
    // Le giornate passate vengono dall'archivio, che gli xG/90 non li tiene.
    if (num(r.xG_Casa) != null || num(r.xG_Osp) != null) {
      det.push("<p>xG/90: " + f2(num(r.xG_Casa)) + " \u2013 " + f2(num(r.xG_Osp)) +
        " \u00b7 xGA/90: " + f2(num(r.xGA_Casa)) + " \u2013 " + f2(num(r.xGA_Osp)) + "</p>");
    }
    var gl = [["Over 1.5", r.P_O15], ["Over 2.5", r.P_O25], ["Over 3.5", r.P_O35], ["Gol", r.P_GG]]
      .filter(function (x) { return num(x[1]) != null; })
      .map(function (x) { return x[0] + " " + f0(num(x[1])) + "%"; });
    if (gl.length) det.push("<p>" + gl.join(" \u00b7 ") + "</p>");
    if (m1 != null) {
      det.push("<p>Mercato" + (r.M_Fonte ? " " + esc(r.M_Fonte) : "") + (mmarg != null ? " (margine " + f1(mmarg) + "%)" : "") + ": 1 " + f0(m1) +
        "% \u00b7 X " + f0(mx) + "% \u00b7 2 " + f0(m2) + "%" +
        (mgol != null ? ", gol attesi " + f2(mgol) + (mlin != null ? " dalla linea " + esc(mlin) : "") : "") + "</p>");
      if (ds != null) {
        det.push("<p>Sul " + esc(segno) + ": il modello d\u00e0 " + Math.abs(ds).toFixed(1) + " punti " +
          (ds >= 0 ? "pi\u00f9" : "meno") + " del mercato.</p>");
      }
      if (dg != null) {
        det.push("<p>Gol attesi: " + (dg > 0 ? "+" : "") + dg.toFixed(2) + " rispetto a quelli del mercato.</p>");
      }
    } else {
      det.push("<p>Nessun prezzo su questa partita: resta solo il modello.</p>");
    }
    // Le partite giocate si scrivono sempre: una media su sei giornate e
    // una su venti non valgono uguale.
    if (mpc != null && mpo != null) det.push("<p>Medie calcolate su " + f0(mpc) + " e " + f0(mpo) + " partite giocate.</p>");

    return '<div class="riga"><details><summary>' +
      '<span class="segno">' + esc(segno || "?") + "</span>" +
      '<div class="corpo">' +
      '<div class="alto"><span>' + esc(r.Ora || "") + "</span>" + golHtml(r) + esitoSm(r) + (r.Lega ? '<span class="chip">' + esc(String(r.Lega).replace(/\s*\[\d+\]$/, "")) + "</span>" : "") +
        (r.Fonte_xG === "FotMob" ? '<span class="chip">xG FotMob</span>' : r.Fonte_xG === "API-Football" ? '<span class="chip">xG del sito</span>' : "") + "</div>" +
      '<div class="partita">' + partitaHtml(r.Casa, r.Ospite, "", campiRiga(r)) + "</div>" +
      '<div class="sel">\u03bb ' + f2(lc) + " \u2013 " + f2(lo) + coda + "</div>" +
      tripla("modello", p1, px, p2) +
      (m1 != null ? tripla("mercato", m1, mx, m2) : "") +
      "</div>" +
      '<div class="numero"><b>' + f2(gol) + "</b><span>gol attesi</span></div>" +
      "</summary>" +
      '<div class="dettaglio">' + det.join("") + "</div>" +
      "</details></div>";
  }

  // ------------------------------------------------- FootyStats 1X2

  function arricchisciWdw(righe) {
    return (Array.isArray(righe) ? righe : []).map(function (r) {
      var p = [num(r.P1), num(r.PX), num(r.P2)];
      if (p.some(function (x) { return x == null; })) return r;
      var i = p.indexOf(Math.max.apply(null, p));
      // Segno e _prob servono all'ordinamento comune (probOrdine).
      return Object.assign({}, r, { Segno: r.Pron || ["1", "X", "2"][i], _prob: p[i] / 100, _fav: p[i] });
    });
  }

  function wdTiene(r, tipo) {
    if (tipo === "forti") return r._fav != null && r._fav > 60;
    return true;
  }

  function riepilogoWdw(v) {
    // (172) la calibrazione della favorita ora e' nelle caselle vinte/perse/attese
    var mg = mediana(v.map(function (r) { var o = num(r.Overround); return o == null ? null : o - 100; }));
    return tessere([
      [String(v.length), "partite"],
      [String(v.filter(function (r) { return r._fav > 60; }).length), "con favorita sopra il 60%"],
      [mg == null ? "-" : mg.toFixed(1) + "%", "margine mediano del book"]
    ]);
  }

  function rigaWdw(r) {
    var p1 = num(r.P1), px = num(r.PX), p2 = num(r.P2), seg = r.Segno || "";
    var q = [num(r.Q1), num(r.QX), num(r.Q2)], ov = num(r.Overround);
    var es = r.Esito ? (r.Esito === seg ? "presa" : "sbagliata") : null;
    var det = [];
    if (r.Lega) det.push("<p>" + esc(r.Lega) + " (FootyStats non indica il campionato).</p>");
    det.push("<p>1 " + pv1(p1) + " · X " + pv1(px) + " · 2 " + pv1(p2) + "</p>");
    if (q[0] != null) det.push("<p>Quote " + q.map(f2).join(" · ") + (ov != null ? " – margine del book " + f1(ov - 100) + "%" : "") + "</p>");
    if (r.Esito) det.push("<p>Uscito il " + esc(r.Esito) + (es === "presa" ? ": era la favorita." : ": la favorita era il " + esc(seg) + ".") + "</p>");
    if (r.Url) det.push('<p><a href="' + esc(r.Url) + '" target="_blank" rel="noopener">La partita su FootyStats</a></p>');
    return '<div class="riga' + (es ? " finita" : "") + '">' +
      (es ? '<span class="spunta esito ' + es + '" title="' + (es === "presa" ? "favorita uscita" : "favorita non uscita") + '">' +
        (es === "presa" ? "✓" : "✗") + "</span>" : "") +
      "<details><summary>" +
      '<span class="segno">' + esc(seg || "?") + "</span>" +
      '<div class="corpo">' +
      '<div class="alto">' + (r.Lega ? '<span class="chip">' + esc(r.Lega) + "</span>" : "") +
        (r.Esito ? "<span><b>uscito " + esc(r.Esito) + "</b></span>" : "") + "</div>" +
      '<div class="partita">' + partitaHtml(r.Casa, r.Ospite, "", campiRiga(r)) + "</div>" +
      (q[0] != null ? '<div class="sel">quote ' + q.map(f2).join(" · ") + "</div>" : "") +
      tripla("FootyStats", p1, px, p2) +
      "</div>" +
      '<div class="numero">' + pB(r._fav) + '<span>sul ' + esc(seg) + "</span></div>" +
      "</summary>" +
      '<div class="dettaglio">' + det.join("") + "</div>" +
      "</details></div>";
  }

  // ------------------------------------------------- Sports Mole

  function arricchisciSm(righe) {
    return (Array.isArray(righe) ? righe : []).map(function (r) {
      var p = [num(r.P1), num(r.PX), num(r.P2)];
      if (p.some(function (x) { return x == null; })) return r;
      var i = p.indexOf(Math.max.apply(null, p));
      return Object.assign({}, r, { Segno: ["1", "X", "2"][i], _prob: p[i] / 100, _fav: p[i] });
    });
  }

  function smTiene(r, tipo) {
    if (tipo === "wesay") return !!String(r.WeSay || "").trim();
    if (tipo === "forti") return r._fav != null && r._fav > 60;
    return true;
  }

  function riepilogoSm(v) {
    var ws = v.filter(function (r) { return String(r.WeSay || "").trim(); });
    // Quante volte la redazione sceglie lo stesso segno del modello del sito.
    var stessi = ws.filter(function (r) { return r.WeSay_Segno && r.WeSay_Segno === r.Segno; }).length;
    // Sulle partite finite: quante volte e' uscito il segno della card,
    // accanto a quante il modello stesso ne attendeva (la media delle sue
    // probabilita' su quei segni).
    var fin = v.filter(function (r) { return segnoUscito(r) && r.Segno && r._fav != null; });
    var presi = fin.filter(function (r) { return segnoUscito(r) === r.Segno; }).length;
    var attesi = fin.reduce(function (a, r) { return a + r._fav; }, 0);
    return tessere([
      [String(v.length), "partite"],
      [String(ws.length), "con il We say della redazione"],
      [ws.length ? Math.round(100 * stessi / ws.length) + "%" : "-", "We say sullo stesso segno del modello"]
    ]);
  }

  function smEsatti(r, lato) {
    var e = r.Esatti && r.Esatti[lato];
    if (!Array.isArray(e)) return "";
    return e.filter(function (x) { return Array.isArray(x) && x[0] !== "Other" && num(x[1]) != null; })
      .slice(0, 3).map(function (x) { return esc(x[0]) + " " + f1(num(x[1])) + "%"; }).join(" · ");
  }

  // L'ESITO A PARTITA FINITA (7/11): il segno della card, cioe' il piu'
  // probabile per il modello di Sports Mole, contro il punteggio vero che
  // esiti_sportsmole.py scrive nel file. Aritmetica, nessuna regola.
  function segnoUscito(r) {
    var gc = num(r.Gol_Casa), go = num(r.Gol_Ospite);
    if (gc == null || go == null) return "";
    return gc > go ? "1" : gc < go ? "2" : "X";
  }
  // (121) L'esito non e' piu' una pillola colorata in alto: e' la ✓/✗
  // grigia a sinistra, la stessa per tutte le sezioni (spuntaRisultato).
  function esitoSm(r) { return ""; }

  function rigaSm(r) {
    var p1 = num(r.P1), px = num(r.PX), p2 = num(r.P2), seg = r.Segno || "";
    var ws = String(r.WeSay || "").trim(), wsSeg = String(r.WeSay_Segno || "");
    var esatto = String(r.Esatto || ""), pEs = num(r.P_Esatto);
    var det = [];
    if (r.Lega) det.push("<p>" + esc(r.Lega) + (r.Giornata ? " \u2013 " + esc(r.Giornata) : "") + "</p>");
    det.push("<p>1 " + pv1(p1) + " · X " + pv1(px) + " · 2 " + pv1(p2) + "</p>");
    var usc = segnoUscito(r);
    if (usc) {
      det.push("<p>Finita " + esc(r.Gol_Casa + "-" + r.Gol_Ospite) + (r.Risultato_Da ? " (risultato da " + esc(r.Risultato_Da) + ")" : "") +
        ": il segno del modello, " + esc(seg) + ", " + (usc === seg ? "\u00e8 uscito" : "non \u00e8 uscito") + "." +
        (ws ? " We say " + esc(ws) + ": " + (ws.replace(/\s/g, "") === String(r.Gol_Casa) + "-" + String(r.Gol_Ospite)
          ? "risultato esatto indovinato" : "risultato esatto sbagliato") +
          (r.WeSay_Segno ? ", segno " + (r.WeSay_Segno === usc ? "vinto" : "perso") : "") + "." : "") + "</p>");
    }
    if (ws) {
      det.push("<p><b>We say della redazione: " + esc(ws) + "</b>" +
        (wsSeg && num(r["P" + wsSeg]) != null ? " \u2013 il " + esc(wsSeg) + " per il loro modello \u00e8 al " + f0(num(r["P" + wsSeg])) + "%" : "") +
        ".</p>");
    }
    if (esatto) det.push("<p>Risultato pi\u00f9 probabile per il modello: " + esc(esatto) + (pEs != null ? " al " + f1(pEs) + "%" : "") + "</p>");
    [["Vince la casa", "casa"], ["Pareggio", "pareggio"], ["Vince l\u2019ospite", "ospite"]].forEach(function (x) {
      var t = smEsatti(r, x[1]);
      if (t) det.push("<p>" + x[0] + ": " + t + "</p>");
    });
    var gol = [["Over 1.5", r.P_O15], ["Over 2.5", r.P_O25], ["Over 3.5", r.P_O35], ["Gol", r.P_GG]]
      .filter(function (x) { return num(x[1]) != null; })
      .map(function (x) { return x[0] + " " + f0(num(x[1])) + "%"; });
    if (gol.length) det.push("<p>" + gol.join(" · ") + "</p>");
    if (num(r.PT1) != null) det.push("<p>Primo tempo: 1 " + pv(r.PT1) + " · X " + pv(r.PTX) + " · 2 " + pv(r.PT2) + "</p>");

      '<div class="partita">' + partitaHtml(r.Casa, r.Ospite, "", campiRiga(r)) + "</div>" +
      (sel.length ? '<div class="sel">' + sel.join(" · ") + "</div>" : "") +
      tripla("Sports Mole", p1, px, p2) +
      "</div>" +
      '<div class="numero">' + pB(r._fav) + '<span>sul ' + esc(seg) + "</span></div>" +

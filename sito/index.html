  var WD_VISTE = [
    ["tutte", "Tutte",
     "Le probabilit\u00e0 1X2 di FootyStats: quote di un bookmaker con il suo guadagno tolto, su moltissimi campionati. " +
     "Non hanno orario n\u00e9 campionato, solo il paese. Nei giorni passati \u2713 se \u00e8 uscito il segno pi\u00f9 probabile, \u2717 se no."],
    ["forti", "Favorita sopra il 60%",
     "Solo le partite in cui il segno pi\u00f9 probabile supera il 60%."]
  ];
  var WD_ORDINI = [["prob", "Per probabilit\u00e0"], ["paese", "Per paese"], ["file", "Come FootyStats"]];
  // Gli xG delle squadre stanno dentro "Poisson": sono i numeri da cui il
  // Poisson parte, e la barra in alto non ha posto per un'altra voce.
  var GRUPPO_POISSON = [["poisson", "Partite"], ["xg", "xG squadre"]];

  var CM_ORDINI = [["file", "Per orario"], ["prob", "Per probabilit\u00e0"], ["scarto", "Per scarto"], ["fonti", "Per n. fonti"]];

  // ------------------------------------------------------------ stato

  var stato = {
    sez: "prezzi",
    data: { prezzi: null, mercato: null, consensus: null, accordo: null, poisson: null, sure: null, wdw: null },
    vista: { wdw: "tutte", prezzi: "partite", mercato: "aff", consensus: "mercato", accordo: "tutte", poisson: "tutte", sure: "tutte" },
    ordine: { wdw: "prob", prezzi: "ora", mercato: "file", consensus: "file", accordo: "file", poisson: "file", sure: "file" },
    cerca: "",
    fonteCm: "",
    esito: "",
    limite: PASSO
  };
  // La multipla sopravvive al cambio di vista e di data: si compone
  // anche con partite di giorni diversi.
  var scelte = {};

  // "Statistiche fonti" ha due viste: il riepilogo e le partite una per una.
  var FONTI = { vista: "riepilogo", data: null, fonte: "" };

  function leggiHash() {
    var p = location.hash.replace(/^#/, "").split("/");
    if (p[0] === "scheda") {
      stato.sez = "scheda";
      SCHEDA.interna = daClic; daClic = false;
      SCHEDA.data = p[1] || null;
      try { SCHEDA.chiave = p[2] ? decodeURIComponent(p[2]) : null; } catch (e) { SCHEDA.chiave = null; }
      return;
    }
    if (p[0] === "xg") {
      stato.sez = "xg";
      try { XG.lega = p[1] ? decodeURIComponent(p[1]) : XG.lega; } catch (e) { /* resta quella che c'era */ }
      if (p[2] === "fotmob" || p[2] === "understat") XG.fonte = p[2];
      return;
    }
    if (SEZ[p[0]] || p[0] === "fonti") stato.sez = p[0];
    if (stato.sez === "fonti") {
      FONTI.vista = p[1] === "partite" ? "partite" : "riepilogo";
      if (/^\d{4}-\d{2}-\d{2}$/.test(p[2] || "")) FONTI.data = p[2];
    }
    if (stato.sez !== "fonti") {
      if (/^\d{4}-\d{2}-\d{2}$/.test(p[1] || "")) stato.data[stato.sez] = p[1];
      var viste = SEZ[stato.sez].viste;
      if (p[2] && viste.some(function (v) { return v[0] === p[2]; })) stato.vista[stato.sez] = p[2];
    }
  }
  function scriviHash() {
    var h = stato.sez;
    if (stato.sez === "scheda") {
      h += "/" + (SCHEDA.data || "") + "/" + encodeURIComponent(SCHEDA.chiave || "");
    } else if (stato.sez === "xg") {
      h += "/" + encodeURIComponent(XG.lega || "") + "/" + (XG.fonte || "");
    } else if (stato.sez !== "fonti") {
      h += "/" + (stato.data[stato.sez] || "") + "/" + stato.vista[stato.sez];
    } else if (FONTI.vista === "partite") {
      h += "/partite/" + (FONTI.data || "");
    }
    if (location.hash !== "#" + h) history.replaceState(null, "", "#" + h);
  }

  // Tutto quello che distingue una sezione a giornate dall'altra.
  // Le funzioni sono dichiarate piu' sotto: in JavaScript esistono gia'.
  var SEZ = {
    prezzi: { indice: "prezzi_index.json", prefisso: "prezzi_", viste: PE_VISTE, ordini: PE_ORDINI,
              tiene: peTiene, riepilogo: riepilogoPrezzi, riga: rigaPrezzo, arricchisci: arricchisciPrezzi,
              nota: " \u00b7 la tacca sulle barre segna il 60%" },
    consensus: { indice: "consensusmedio_index.json", prefisso: "consensusmedio_", viste: CM_VISTE, ordini: CM_ORDINI,
                 tiene: cmTiene, riepilogo: riepilogoConsensus, riga: rigaConsensus, nota: "",
                 arricchisci: arricchisciConsensus },
    mercato: { indice: "asianodds_index.json", prefisso: "asianodds_", viste: MK_VISTE, ordini: MK_ORDINI,
               tiene: mkTiene, riepilogo: riepilogoMercato, riga: rigaMercato, nota: "", daOggi: true },
    accordo: { indice: "consensus_index.json", prefisso: "consensus_", viste: AC_VISTE, ordini: AC_ORDINI,
               tiene: function () { return true; }, riepilogo: riepilogoAccordo, riga: rigaAccordo, nota: "" },
    poisson: { indice: "poisson_index.json", prefisso: "poisson_", viste: PO_VISTE, ordini: PO_ORDINI,
               tiene: poTiene, riepilogo: riepilogoPoisson, riga: rigaPoisson, nota: "" },
    wdw: { indice: "footystatswdw_index.json", prefisso: "footystatswdw_", viste: WD_VISTE, ordini: WD_ORDINI,
           tiene: wdTiene, riepilogo: riepilogoWdw, riga: rigaWdw, arricchisci: arricchisciWdw, nota: "" },
    sure: { indice: "fpnet_index.json", prefisso: "fpnet_", viste: SB_VISTE, ordini: SB_ORDINI,
            tiene: sbTiene, riepilogo: riepilogoSure, riga: rigaSure, arricchisci: arricchisciSure,
            nota: " \u00b7 la tacca sulle barre segna il 60%" }
  };

  // --------------------------------------------------------- utilita'

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function num(v) {
    if (v === null || v === undefined || v === "") return null;
    var n = Number(v);
    return isFinite(n) ? n : null;
  }
  function f1(v) { return v == null ? "-" : v.toFixed(1); }
  function f0(v) { return v == null ? "-" : v.toFixed(0); }
  function f2(v) { return v == null ? "?" : v.toFixed(2); }

  // La data di oggi in Italia, non quella del dispositivo in UTC.
  function oggi() {
    try {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Rome", year: "numeric", month: "2-digit", day: "2-digit"
      }).format(new Date());
    } catch (e) {
      return new Date().toISOString().slice(0, 10);
    }
  }
  var GIORNI = ["dom", "lun", "mar", "mer", "gio", "ven", "sab"];
  var MESI_BREVI = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];
  function etichettaData(d) {
    var o = oggi();
    var t = new Date(d + "T12:00:00Z");
    var g = GIORNI[t.getUTCDay()] + " " + t.getUTCDate() + " " + MESI_BREVI[t.getUTCMonth()];
    var diff = Math.round((t - new Date(o + "T12:00:00Z")) / 86400000);
    if (diff === 0) return "Oggi";
    if (diff === 1) return "Domani";
    if (diff === -1) return "Ieri";
    return g;
  }
  // Data di partenza: oggi se c'e', altrimenti la prima dopo oggi,
  // altrimenti l'ultima disponibile.
  function dataIniziale(date) {
    var o = oggi();
    if (date.indexOf(o) >= 0) return o;
    var dopo = date.filter(function (d) { return d > o; }).sort();
    if (dopo.length) return dopo[0];
    return date.slice().sort().pop();
  }

  function testoCerca(r) {
    return [r.Partita, r.Casa, r.Ospite, r.Campionato, r.Lega, r.Elenco]
      .join(" ").toLowerCase();
  }

  // ---------------------------------------------------------- disegno

  var $cont = document.getElementById("contenuto");

  function chipsHtml(voci, attivo, attr) {
    return '<div class="chips" role="group">' + voci.map(function (v) {
      return '<button type="button" ' + attr + '="' + esc(v[0]) + '" aria-pressed="' +
        (v[0] === attivo) + '">' + esc(v[1]) + "</button>";
    }).join("") + "</div>";
  }
  function strumentiHtml(ordini, attivo) {
    return '<div class="strumenti">' +
      '<input type="search" id="cerca" placeholder="Squadra o campionato" value="' +
      esc(stato.cerca) + '" autocomplete="off">' +
      '<select id="ordine" aria-label="Ordine">' + ordini.map(function (o) {
        return '<option value="' + o[0] + '"' + (o[0] === attivo ? " selected" : "") +
          ">" + esc(o[1]) + "</option>";
      }).join("") + "</select></div>";
  }

  function disegna() {
    scriviHash();
    document.querySelectorAll("nav.sezioni button[data-sez]").forEach(function (b) {
      var accesa = stato.sez === "accordo" ? "consensus" : (stato.sez === "mercato" || stato.sez === "wdw") ? "prezzi" :
        stato.sez === "xg" ? "poisson" : stato.sez;
      b.setAttribute("aria-current", String(b.dataset.sez === accesa));
    });
    if (stato.sez === "fonti") return disegnaFonti();
    if (stato.sez === "scheda") return disegnaScheda();
    if (stato.sez === "xg") return disegnaXG();
    return disegnaGiornata(stato.sez);
  }

  function messaggio(cls, testo) {
    return '<div class="' + cls + '">' + testo + "</div>";
  }

  var passate = {};
  var DATE_SEZ = {};
  function disegnaGiornata(sez) {
    var conf = SEZ[sez];
    var indice = conf.indice, prefisso = conf.prefisso, viste = conf.viste, ordini = conf.ordini;

    $cont.innerHTML = messaggio("vuoto", "Carico&hellip;");
    // Per i Pronostici anche le giornate passate che hanno la schedina con
    // gli esiti (schedina_index.json, scritto da esiti_schedina.py).
    Promise.all([leggi(indice),
                 sez === "prezzi" ? leggi("schedina_index.json").catch(function () { return null; }) : null
    ]).then(function (arr) {
      var ix = arr[0], sx = arr[1];
      var date = (ix.date || []).slice().sort();
      passate = {};
      if (sx && Array.isArray(sx.date)) {
        sx.date.forEach(function (x) {
          if (x < oggi() && date.indexOf(x) < 0) { date.push(x); passate[x] = 1; }
        });
        date.sort();
      }
      if (conf.daOggi) {
        var futuri = date.filter(function (x) { return x >= oggi(); });
        if (futuri.length) date = futuri;
      }
      document.getElementById("aggiornato").textContent =
        "Aggiornato il " + (ix.updated || "?");
      if (!date.length) {
        $cont.innerHTML = messaggio("vuoto", "Nessuna giornata pubblicata.");
        return;
      }
      DATE_SEZ[sez] = date.slice();
      if (date.indexOf(stato.data[sez]) < 0) stato.data[sez] = dataIniziale(date);
      var d = stato.data[sez];
      scriviHash();

      var vista = viste.filter(function (v) { return v[0] === stato.vista[sez]; })[0];
      var testa = (sez === "consensus" || sez === "accordo" ? chipsHtml(GRUPPO_CONSENSO, sez, "data-gruppo") : "") +
        (sez === "prezzi" || sez === "mercato" || sez === "wdw" ? chipsHtml(gruppoPronostici(sez), sez, "data-gruppo") : "") +
        (sez === "poisson" ? chipsHtml(GRUPPO_POISSON, sez, "data-gruppo") : "") +
        chipsHtml(date.map(function (x) { return [x, etichettaData(x)]; }), d, "data-data") +
        (viste.length > 1 ? chipsHtml(viste, vista[0], "data-vista") : "") +
        (vista[2] ? '<p class="descr">' + esc(vista[2]) + "</p>" : "") +
        (sez === "poisson" ? notaCampo(ix) : "") +
        strumentiHtml(ordini, stato.ordine[sez]);
      if (sez === "consensus") testa = testa.replace(/<\/div>$/, sceltaFonteHtml() + "</div>");
      $cont.innerHTML = testa + '<div id="righe">' + messaggio("vuoto", "Carico&hellip;") + "</div>";
      collegaTesta(sez);

      var carica = Promise.all([leggi((passate[d] ? "schedina_" : prefisso) + d + ".json"), caricaLoghi()])
        .then(function (a) { return a[0]; });
      if (conf.arricchisci) carica = carica.then(function (righe) { return conf.arricchisci(righe, d); });
      return carica.then(function (righe) {
        if (stato.sez !== sez || stato.data[sez] !== d) return;
        disegnaRighe(sez, righe, d);
      });
    }).catch(function (e) {
      if (sez === "wdw") {
        // Prima del primo giro l'indice non c'e': non e' un guasto.
        $cont.innerHTML = chipsHtml(gruppoPronostici(sez), sez, "data-gruppo") +
          messaggio("vuoto", "FootyStats non \u00e8 ancora stato pubblicato: arriva col giro notturno. " +
            "Se non compare nemmeno domani, il motivo \u00e8 nel log del passo \u201cScarica FootyStats\u201d su GitHub Actions.");
        $cont.querySelectorAll("[data-gruppo]").forEach(function (b) {
          b.addEventListener("click", function () {
            if (b.dataset.gruppo === sez) return;
            stato.sez = b.dataset.gruppo; stato.cerca = ""; stato.limite = PASSO; disegna();
          });
        });
        return;
      }
      $cont.innerHTML = messaggio("errore",
        "Non riesco a leggere i dati (" + esc(e.message) + "). " +
        "Riprova fra qualche minuto: se il giro notturno sta scrivendo, i file arrivano dopo.");
    });
  }

  function collegaTesta(sez) {
    // Passando da una strada all'altra si resta sulla stessa giornata, se
    // l'altra ce l'ha.
    $cont.querySelectorAll("[data-gruppo]").forEach(function (b) {
      b.addEventListener("click", function () {
        var nuova = b.dataset.gruppo;
        if (nuova === sez) return;
        if (!stato.data[nuova]) stato.data[nuova] = stato.data[sez];
        stato.sez = nuova; stato.cerca = ""; stato.limite = PASSO; disegna();
      });
    });
    $cont.querySelectorAll("[data-data]").forEach(function (b) {
      b.addEventListener("click", function () {
        stato.data[sez] = b.dataset.data; stato.limite = PASSO; stato.esito = ""; disegna();
      });
    });
    $cont.querySelectorAll("[data-vista]").forEach(function (b) {
      b.addEventListener("click", function () {
        stato.vista[sez] = b.dataset.vista; stato.limite = PASSO;
        if (sez === "prezzi" && b.dataset.vista === "partite" && stato.ordine.prezzi === "file") stato.ordine.prezzi = "ora";
        disegna();
      });
    });
    var c = document.getElementById("cerca");
    var t = null;
    c.addEventListener("input", function () {
      clearTimeout(t);
      t = setTimeout(function () {
        stato.cerca = c.value.trim(); stato.limite = PASSO; ridisegnaRighe();
      }, 150);
    });
    document.getElementById("ordine").addEventListener("change", function (e) {
      stato.ordine[sez] = e.target.value; stato.limite = PASSO; ridisegnaRighe();
    });
    var sf = document.getElementById("fonte-cm");
    if (sf) sf.addEventListener("change", function (e) {
      // Si ridisegna tutta la giornata: la prima volta che si sceglie una
      // fonte bisogna leggere le schede, che portano i suoi pronostici.
      stato.fonteCm = e.target.value; stato.limite = PASSO; disegna();
    });
    // Le date attive restano in vista anche quando la riga scorre.
    var att = $cont.querySelector('[data-data][aria-pressed="true"]');
    if (att && att.scrollIntoView) att.scrollIntoView({ block: "nearest", inline: "center" });
  }

  var ultime = null;
  function ridisegnaRighe() {
    if (ultime) disegnaRighe(ultime.sez, ultime.righe, ultime.data);
  }

  function disegnaRighe(sez, righe, data) {
    ultime = { sez: sez, righe: righe, data: data };
    var vista = stato.vista[sez];
    var tiene = SEZ[sez].tiene;
    var tutte = Array.isArray(righe) ? righe : [];
    var passano = tutte.filter(function (r) { return tiene(r, vista); });
    if (sez === "consensus" && stato.fonteCm) passano = passano.filter(function (r) { return haFonte(r, stato.fonteCm); });
    baseEsiti = passano;
    if (sez === "prezzi" && stato.esito) {
      var tutteFiltro = passano;
      passano = passano.filter(function (r) { return r.Esito === stato.esito; });
      if (!passano.length) { stato.esito = ""; passano = tutteFiltro; }
    }
    var q = stato.cerca.toLowerCase();
    var visibili = q ? passano.filter(function (r) { return testoCerca(r).indexOf(q) >= 0; }) : passano;
    visibili = ordina(sez, visibili.slice());

    var $r = document.getElementById("righe");
    if (!$r) return;
    if (!tutte.length) {
      $r.innerHTML = messaggio("vuoto", "Il file di questa giornata è vuoto.");
      return;
    }
    if (!passano.length) {
      $r.innerHTML = messaggio("vuoto", sez === "consensus" && stato.fonteCm
        ? "In questa giornata, in questa vista, nessuna partita ha un pronostico di " +
          esc(nomeCm(stato.fonteCm)) +
          ". Prova un altro giorno, la vista \u201cTutte\u201d o un'altra fonte."
        : vuotoPerVista(sez, vista, tutte.length, data));
      return;
    }
    if (!visibili.length) {
      $r.innerHTML = messaggio("vuoto", "Nessuna riga corrisponde a “" + esc(stato.cerca) + "”" +
        (vista !== "tutte" ? " in questa vista" : "") + " in questa giornata.") +
        '<div id="altrove" class="altrove"><p class="piccolo">Cerco negli altri giorni&hellip;</p></div>';
      cercaAltrove(sez, data, stato.cerca, tutte);
      return;
    }

    if (sez === "prezzi" && vista === "partite") return disegnaPerPartita(sez, visibili, tutte, data, $r);

    var mostrate = visibili.slice(0, stato.limite);
    var conta = visibili.length === tutte.length
      ? visibili.length + " righe"
      : visibili.length + " righe su " + tutte.length;
    var html = SEZ[sez].riepilogo(visibili) +
      '<p class="conta">' + conta + SEZ[sez].nota + "</p><div class=\"lista\">" +
      mostrate.map(function (r, i) { return conAggancio(SEZ[sez].riga(r, i), sez, r); }).join("") + "</div>";
    if (visibili.length > mostrate.length) {
      html += '<button type="button" class="altre" id="altre">Mostra altre ' +
        Math.min(PASSO, visibili.length - mostrate.length) + " (ne restano " +
        (visibili.length - mostrate.length) + ")</button>";
    }
    $r.innerHTML = html;

    var a = document.getElementById("altre");
    if (a) a.addEventListener("click", function () { stato.limite += PASSO; ridisegnaRighe(); });
    collegaAgganci($r, data);
    $r.querySelectorAll("[data-esito]").forEach(function (b) {
      b.addEventListener("click", function () {
        stato.esito = stato.esito === b.dataset.esito ? "" : b.dataset.esito;
        stato.limite = PASSO; ridisegnaRighe();
      });
    });
    if (sez === "prezzi" || sez === "sure") {
      $r.querySelectorAll("input[data-chiave]").forEach(function (cb) {
        cb.addEventListener("change", function () {
          var k = cb.dataset.chiave;
          var r = mostrate[Number(cb.dataset.i)];
          if (cb.checked) scelte[k] = r; else delete scelte[k];
          cb.closest(".riga").classList.toggle("scelta", cb.checked);
          aggiornaMultipla();
        });
      });
    }
    rimettiPosto($r);
  }

  // ------------------------------------------------ tutte le partite
  //
  // LA STESSA GIORNATA, RACCOLTA PER PARTITA. Le righe sono quelle di
  // prezzi_<data>.json, tali e quali: qui si mettono soltanto insieme
  // quelle della stessa partita (stessa data, stesso nome come lo scrive
  // il file), cosi' chi cerca il derby lo trova una volta sola e, aprendolo,
  // vede tutte le sue probabilita' con la spunta per la multipla.
  var ORDINE_GRUPPO = { "1X2": 0, "Combo": 1, "Gol NoGol": 2, "Under Over": 3 };

  function disegnaPerPartita(sez, visibili, tutte, data, $r) {
    var gruppi = [], dove = {};
    visibili.forEach(function (r) {
      var k = (r.Data || "") + "|" + String(r.Partita || (r.Casa + " - " + r.Ospite)).toLowerCase();
      if (!(k in dove)) { dove[k] = gruppi.length; gruppi.push([]); }
      gruppi[dove[k]].push(r);
    });
    gruppi.forEach(function (g) {
      g.sort(function (a, b) {
        var sa = String(a.InSchedina || "") === "si" ? 0 : 1, sb = String(b.InSchedina || "") === "si" ? 0 : 1;
        if (sa !== sb) return sa - sb;
        var ga = ORDINE_GRUPPO[a.Gruppo], gb = ORDINE_GRUPPO[b.Gruppo];
        ga = ga == null ? 9 : ga; gb = gb == null ? 9 : gb;
        if (ga !== gb) return ga - gb;
        return (num(b.Prob) || 0) - (num(a.Prob) || 0);
      });
    });
    var o = stato.ordine[sez];
    function maxProb(g) { return Math.max.apply(null, g.map(function (r) { return num(r.Prob) || 0; })); }
    function minMarg(g) { return Math.min.apply(null, g.map(function (r) { var m = num(r.Margine); return m == null ? 99 : m; })); }
    gruppi.sort(function (a, b) {
      if (o === "file") return maxProb(b) - maxProb(a);
      if (o === "margine") return minMarg(a) - minMarg(b);
      return String(a[0].Ora || "").localeCompare(String(b[0].Ora || "")) ||
        String(a[0].Partita || "").localeCompare(String(b[0].Partita || ""));
    });
    // Le partite finite in cima, come nelle altre viste.
    var fin = gruppi.filter(function (g) { return g.some(function (r) { return r.Esito; }); });
    if (fin.length) gruppi = fin.concat(gruppi.filter(function (g) { return fin.indexOf(g) < 0; }));

    var mostrateG = gruppi.slice(0, stato.limite), mostrate = [];
    var html = SEZ[sez].riepilogo(visibili) +
      '<p class="conta">' + gruppi.length + (gruppi.length === 1 ? " partita" : " partite") + " · " +
      visibili.length + " probabilità" + SEZ[sez].nota + '</p><div class="lista">' +
      mostrateG.map(function (g) {
        var r0 = g[0], inSch = g.filter(function (r) { return String(r.InSchedina || "") === "si"; })[0];
        var top = inSch || g.slice().sort(function (a, b) { return (num(b.Prob) || 0) - (num(a.Prob) || 0); })[0];
        var gol = r0.Gol_Casa != null && r0.Gol_Ospite != null ? r0.Gol_Casa + "-" + r0.Gol_Ospite : "";
        var dentro = g.map(function (r) {
          var i = mostrate.length; mostrate.push(r);
          return rigaPrezzo(r, i);
        }).join("");
        var scelte_ = g.filter(function (r) { return scelte[chiave(r)]; }).length;
        return '<div class="riga partitona' + (scelte_ ? " scelta" : "") + '"><details><summary><div class="corpo">' +
          '<div class="alto"><span>' + esc(r0.Ora || "") + "</span>" +
          (gol ? "<span><b>" + esc(gol) + "</b></span>" : "") +
          (r0.Campionato ? '<span class="chip">' + esc(r0.Campionato) + "</span>" : "") + "</div>" +
          '<div class="partita">' + partitaHtml(r0.Casa, r0.Ospite, r0.Partita, campiRiga(r0)) + "</div>" +
          '<div class="sel">' + (inSch ? "In schedina: " : "Più probabile: ") + esc(etichettaSel(top)) +
          " · " + f0(num(top.Prob)) + "%" + (scelte_ ? " · " + scelte_ + " nella multipla" : "") + "</div>" +
          '</div><div class="numero"><b>' + g.length + "</b><span>" + (g.length === 1 ? "probabilità" : "probabilità") + "</span></div></summary>" +
          '<div class="dentro-partita">' + dentro +
          (r0.Casa && r0.Ospite ? '<p class="aggancio" data-alias="' + esc(aliasDi(sez, r0)) + '"></p>' : "") +
          "</div></details></div>";
      }).join("") + "</div>";
    if (gruppi.length > mostrateG.length) {
      html += '<button type="button" class="altre" id="altre">Mostra altre ' +
        Math.min(PASSO, gruppi.length - mostrateG.length) + " partite (ne restano " +
        (gruppi.length - mostrateG.length) + ")</button>";
    }
    $r.innerHTML = html;
    var a = document.getElementById("altre");
    if (a) a.addEventListener("click", function () { stato.limite += PASSO; ridisegnaRighe(); });
    // Il link alla scheda si riempie quando si apre la partita.
    $r.querySelectorAll(".partitona > details").forEach(function (det) {
      det.addEventListener("toggle", function () { if (det.open) riempiAggancio(det, data); });
    });
    $r.querySelectorAll("[data-esito]").forEach(function (b) {
      b.addEventListener("click", function () {
        stato.esito = stato.esito === b.dataset.esito ? "" : b.dataset.esito;
        stato.limite = PASSO; ridisegnaRighe();
      });
    });
    $r.querySelectorAll("input[data-chiave]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var k = cb.dataset.chiave, r = mostrate[Number(cb.dataset.i)];
        if (cb.checked) scelte[k] = r; else delete scelte[k];
        cb.closest(".riga").classList.toggle("scelta", cb.checked);
        var box = cb.closest(".partitona");
        if (box) box.classList.toggle("scelta", !!box.querySelector("input[data-chiave]:checked"));
        aggiornaMultipla();
      });
    });
    rimettiPosto($r);
  }

  // ------------------------------------------- la ricerca negli altri giorni
  //
  // Chi cerca "Milan" su Oggi non trova il derby di sabato: sta in un altro
  // giorno, o in un'altra vista. Quando la ricerca non trova niente, si
  // guardano le altre giornate della stessa sezione (e le altre viste di
  // questa) e si propone dove andare. Stessi file e stessa ricerca di
  // testoCerca(): niente regole nuove.
  function cercaAltrove(sez, data, cerca, righeOggi) {
    var q = cerca.toLowerCase(), conf = SEZ[sez], vista = stato.vista[sez];
    // Dove mandare chi non trova: nei Pronostici la vista per partita.
    var VISTA_AMPIA = sez === "prezzi" ? "partite" : "tutte";
    var haTutte = conf.viste.some(function (v) { return v[0] === VISTA_AMPIA; });
    // Prima il giorno scelto, poi i prossimi dal piu' vicino, poi i
    // passati dal piu' recente: chi cerca una partita di solito la cerca
    // in arrivo.
    var o = oggi();
    var date = (DATE_SEZ[sez] || []).slice().sort(function (a, b) {
      function rango(d) { return d === data ? 0 : d >= o ? 1 : 2; }
      var ra = rango(a), rb = rango(b);
      if (ra !== rb) return ra - rb;
      return ra === 2 ? (a < b ? 1 : -1) : (a < b ? -1 : 1);
    });
    function partite(righe) {
      var n = 0, inVista = 0, nomi = [];
      (Array.isArray(righe) ? righe : []).forEach(function (r) {
        if (testoCerca(r).indexOf(q) < 0) return;
        n++;
        if (conf.tiene(r, vista)) inVista++;
        var nome = r.Casa && r.Ospite ? r.Casa + " – " + r.Ospite : (r.Partita || "");
        if (nome && nomi.indexOf(nome) < 0) nomi.push(nome);
      });
      return { n: n, inVista: inVista, nomi: nomi };
    }
    var carichi = date.map(function (d) {
      if (d === data) return Promise.resolve([d, partite(righeOggi)]);
      return leggi((sez === "prezzi" && passate[d] ? "schedina_" : conf.prefisso) + d + ".json")
        .then(function (r) { return [d, partite(r)]; }, function () { return [d, null]; });
    });
    Promise.all(carichi).then(function (ris) {
      var $a = document.getElementById("altrove");
      // La pagina e' cambiata intanto (altra ricerca, altro giorno): niente.
      if (!$a || stato.sez !== sez || stato.data[sez] !== data || stato.cerca !== cerca) return;
      var voci = ris.filter(function (x) { return x[1] && x[1].n && (x[0] !== data || haTutte); })
        .map(function (x) {
          var d = x[0], t = x[1];
          // La vista resta quella scelta se la partita ci sta; se no "Tutte".
          var nuova = t.inVista ? vista : (haTutte ? VISTA_AMPIA : vista);
          if (d === data && nuova === vista) return "";
          var mostra = t.nomi.slice(0, 2).map(esc).join(", ") + (t.nomi.length > 2 ? " e altre " + (t.nomi.length - 2) : "");
          var nomeVista = (conf.viste.filter(function (v) { return v[0] === nuova; })[0] || [])[1] || "";
          return '<button type="button" class="vai-altrove" data-vai-data="' + esc(d) + '" data-vai-vista="' + esc(nuova) + '">' +
            "<b>" + esc(d === data ? "Questo giorno" : etichettaData(d)) + "</b>" +
            (nuova !== vista ? ' <span class="piccolo">· vista ' + esc(nomeVista) + "</span>" : "") +
            "<span>" + mostra + " · " + t.n + (t.n === 1 ? " riga" : " righe") + "</span></button>";
        }).filter(Boolean);
      $a.innerHTML = voci.length
        ? '<p class="piccolo">“' + esc(cerca) + "” si trova qui:</p>" + voci.join("")
        : '<p class="piccolo">Nemmeno negli altri giorni pubblicati in questa sezione.' +
          (sez === "mercato" ? " Il Mercato ha solo le partite delle prossime 24 ore: le altre si trovano in Probabilit\u00e0 reali." : "") + "</p>";
      $a.querySelectorAll("[data-vai-data]").forEach(function (b) {
        b.addEventListener("click", function () {
          stato.data[sez] = b.dataset.vaiData;
          stato.vista[sez] = b.dataset.vaiVista;
          if (sez === "prezzi" && b.dataset.vaiVista === "partite" && stato.ordine.prezzi === "file") stato.ordine.prezzi = "ora";
          stato.limite = PASSO; stato.esito = "";
          window.scrollTo(0, 0);
          disegna();
        });
      });
    });
  }

  // --------------------------------------------------------- grafica

  function mediana(a) {
    a = a.filter(function (x) { return x != null; }).sort(function (x, y) { return x - y; });
    if (!a.length) return null;
    var m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }
  function tessere(voci) {
    return '<div class="riepilogo">' + voci.map(function (v) {
      return "<div><b>" + v[0] + "</b><span>" + v[1] + "</span></div>";
    }).join("") + "</div>";
  }

  // Le mediane e non le medie: una quota a 9.00 sposterebbe la media di
  // tutta la lista, la mediana resta dov'e' la riga tipica.
  // Le righe della giornata PRIMA del filtro prese/sbagliate: i conteggi
  // dei riquadri restano quelli di tutta la schedina anche col filtro.
  var baseEsiti = null;
  function riepilogoPrezzi(v) {
    var eq = mediana(v.map(function (r) { return num(r.Equa); }));
    var mg = mediana(v.map(function (r) { return num(r.Margine); }));
    var strette = v.filter(function (r) { var m = num(r.Margine); return m != null && m < 2; }).length;
    var tutteE = stato.esito && baseEsiti ? baseEsiti : v;
    var prese = tutteE.filter(function (r) { return r.Esito === "presa"; }).length;
    var sbagliate = tutteE.filter(function (r) { return r.Esito === "sbagliata"; }).length;
    if (prese + sbagliate) {
      var attesa = tutteE.filter(function (r) { return !r.Esito; }).length;
      // I due riquadri sono pulsanti: toccandoli restano solo le prese o
      // solo le sbagliate; ritoccandoli si torna a tutte.
      var p = stato.esito;
      return '<div class="riepilogo">' +
        '<button type="button" class="filtro-esito' + (p === "presa" ? " attivo" : "") + '" data-esito="presa"><b><em style="font-style:normal;color:var(--buono)">\u2713 ' + prese + "</em></b><span>vinte" + (p === "presa" ? " \u00b7 mostra tutte" : "") + "</span></button>" +
        '<button type="button" class="filtro-esito' + (p === "sbagliata" ? " attivo" : "") + '" data-esito="sbagliata"><b><em style="font-style:normal;color:var(--male)">\u2717 ' + sbagliate + "</em></b><span>sbagliate" + (p === "sbagliata" ? " \u00b7 mostra tutte" : "") + "</span></button>" +
        "<div><b>" + attesa + "</b><span>senza risultato</span></div></div>" +
        '<p class="conta">Tocca \u2713 o \u2717 per vedere solo quelle. Le partite finite sono in cima.</p>';
    }
    return tessere([
      [eq == null ? "-" : eq.toFixed(2), "quota reale mediana"],
      [mg == null ? "-" : mg.toFixed(1) + "%", "margine mediano"],
      [strette + "<small style=\"font-size:.7em;color:var(--tenue)\"> / " + v.length + "</small>", "con margine sotto il 2%"]
    ]);
  }

  function riepilogoConsensus(v) {
    var conM = v.filter(function (r) { return num(r.Scarto) != null; });
    var multi = v.filter(function (r) { return (num(r.Fonti) || 0) >= 2; }).length;
    var sc = mediana(conM.map(function (r) { return Math.abs(num(r.Scarto)); }));
    return tessere([
      [String(v.length), "partite"],
      [String(multi), "con due fonti o più"],
      [sc == null ? "-" : sc.toFixed(1), "scarto tipico dal mercato, in punti"]
    ]) +
      (stato.fonteCm && fuoriMedia(stato.fonteCm)
        ? '<p class="descr">' + esc(nomeCm(stato.fonteCm)) + " non entra nella media: il suo pronostico \u00e8 scritto sotto ogni partita, " +
          "le barre e le percentuali restano quelle delle altre fonti.</p>" : "") +
      legenda();
  }

  // Una barra 1-X-2. Il numero sta dentro il pezzo quando c'e' posto;
  // il valore esatto e' comunque scritto nel dettaglio della partita.
  function tripla(nome, a, x, b) {
    if (a == null || x == null || b == null) return "";
    var tot = a + x + b || 1;
    function pezzo(cls, val, et) {
      var w = val / tot * 100;
      return '<i class="' + cls + '" style="flex-grow:' + w.toFixed(2) + '" title="' + et + " " + f0(val) + '%">' +
        (w >= 13 ? f0(val) : "") + "</i>";
    }
    return '<div class="tripla"><span class="nome">' + nome + "</span>" +
      '<div class="barre" role="img" aria-label="' + nome + ": 1 " + f0(a) + "%, X " + f0(x) + "%, 2 " + f0(b) + '%">' +
      pezzo("s1", a, "1") + pezzo("sx", x, "X") + pezzo("s2", b, "2") + "</div></div>";
  }

  function barra(nome, pct, testo, cls) {
    var w = Math.max(0, Math.min(100, num(pct) || 0));
    return '<div class="hb' + (cls ? " " + cls : "") + '"><div class="hb-r"><span class="n">' + esc(nome) + "</span>" +
      '<span class="v">' + testo + '</span></div><span class="t"><i style="width:' + w + '%"></i></span></div>';
  }

  // Due Brier sulle STESSE partite, su una scala ristretta. Ristretta
  // perche' le differenze sono di centesimi: da zero sarebbero due punti
  // sovrapposti. Va detto, altrimenti la distanza sembra piu' grande.
  function striscia(voci) {
    voci = voci.filter(function (v) { return num(v[1]) != null; });
    if (voci.length < 2) return "";
    var vs = voci.map(function (v) { return num(v[1]); });
    var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
    var pad = (hi - lo) * 0.6 || 0.005;
    lo -= pad; hi += pad;
    return '<div class="brier">' + voci.map(function (v) {
      var p = (num(v[1]) - lo) / (hi - lo) * 100;
      return '<div class="r ' + v[2] + '"><span>' + esc(v[0]) + '</span><div class="pista"><b style="left:' +
        p.toFixed(1) + '%"></b></div><em>' + esc(v[1]) + "</em></div>";
    }).join("") +
      '<p class="piccolo">Più a sinistra è meglio. Scala ingrandita: le differenze sono di centesimi.</p></div>';
  }

  function ordina(sez, v) {
    var o = stato.ordine[sez];
    if (o === "paese") v.sort(function (a, b) {
      return String(a.Lega || "").localeCompare(String(b.Lega || "")) || String(a.Casa || "").localeCompare(String(b.Casa || ""));
    });
    if (o === "ora") v.sort(function (a, b) { return (a.Ora || "").localeCompare(b.Ora || ""); });
    else if (o === "margine") v.sort(function (a, b) {
      var x = num(a.Margine), y = num(b.Margine);
      return (x == null ? 99 : x) - (y == null ? 99 : y);
    });
    else if (o === "scarto") v.sort(function (a, b) {
      var x = scartoDi(a), y = scartoDi(b);
      return (y == null ? -1 : Math.abs(y)) - (x == null ? -1 : Math.abs(x));
    });
    // La probabilita' del segno indicato, dalla piu' alta. A parita' vince
    // chi ha piu' fonti: lo stesso 70% detto da tre siti pesa piu' di uno.
    else if (o === "prob") v.sort(function (a, b) {
      return ((probOrdine(b) || 0) - (probOrdine(a) || 0)) || ((num(b.Fonti) || 0) - (num(a.Fonti) || 0));
    });
    else if (o === "mov") v.sort(function (a, b) { return (num(b.Mov) || 0) - (num(a.Mov) || 0); });
    else if (o === "gol") v.sort(function (a, b) { return (num(b.Gol_Attesi) || 0) - (num(a.Gol_Attesi) || 0); });
    else if (o === "fonti") v.sort(function (a, b) { return (num(b.Fonti) || 0) - (num(a.Fonti) || 0); });
    // "file": l'ordine del file, che e' quello che mostra Kodi.
    // Nei Pronostici le partite gia' finite (con la V o la X) vanno in
    // cima, nell'ordine scelto: sono quelle che si cercano per prime.
    if (sez === "prezzi" && v.some(function (r) { return r.Esito; })) {
      var fin = v.filter(function (r) { return r.Esito; }), alt = v.filter(function (r) { return !r.Esito; });
      v = fin.concat(alt);
    }
    return v;
  }

  function probSegno(r) {
    var s = String(r.Segno || "").toUpperCase();
    return num(s === "1" ? r.P1 : s === "X" ? r.PX : s === "2" ? r.P2 : null);
  }
  function probOrdine(r) {
    if (r._prob != null) return r._prob * 100;
    if (r["Pron Combinato"] != null) return probCombinato(r);
    return probSegno(r);
  }
  function scartoDi(r) { var v = num(r.Scarto); return v != null ? v : num(r.Scarto_Segno); }

  function vuotoPerVista(sez, vista, n, data) {
    if (sez === "mercato") {
      if (vista === "aff") return "Nessuna partita a margine basso fra le " + n + " del " + data + ". Prova \u201cTutte\u201d.";
      if (vista === "mov") return "Nessun movimento notevole fra le " + n + " partite del " + data + ". Prova \u201cTutte\u201d.";
    }
    if (sez === "sure") {
      return "Nessuna delle " + n + " Sure Bets del " + data + " ha il prezzo: AsianOdds copre le prossime 24 ore. Prova \u201cTutte\u201d.";
    }
    if (sez === "wdw") return "Nessuna delle " + n + " partite del " + data + " ha una favorita sopra il 60%. Prova \u201cTutte\u201d.";
    if (sez === "poisson") {
      return "Nessuna delle " + n + " partite del " + data + " ha il prezzo: AsianOdds copre le prossime 24 ore. Prova \u201cTutte\u201d.";
    }
    if (sez === "prezzi") {
      if (vista === "schedina") return "Nessuna delle " + n + " selezioni del " + data + " è finita in schedina.";
      if (vista === "stretto") return "Nessuna delle " + n + " selezioni del " + data + " ha il margine sotto il 2%. Prova un'altra vista.";
      return "Nessuna selezione di questo tipo fra le " + n + " del " + data + ". Prova “Tutto”.";
    }
    if (vista === "mercato") return "Nessuna delle " + n + " partite del " + data + " ha la linea di chiusura: AsianOdds copre le prossime 24 ore.";
    return "Su tutte e " + n + " le partite del " + data + " si esprime una fonte sola. Prova “Tutte”.";
  }

  // ------------------------------------------------------ prezzi equi

  function peTiene(r, tipo) {
    var g = String(r.Gruppo || "");
    if (tipo === "schedina") return String(r.InSchedina || "") === "si";
    if (tipo === "stretto") { var m = num(r.Margine); return m != null && m < 2; }
    if (tipo === "combo") return g === "Combo";
    if (tipo === "btts") return g === "Gol NoGol";
    if (tipo === "ou") return g === "Under Over";
    if (tipo === "1x2") return g === "1X2";
    return true;
  }

  // La linea dentro l'etichetta: "Over" da solo non dice quale.
  function etichettaSel(r) {
    var merc = String(r.Mercato || ""), sel = String(r.Sel || "");
    if (merc.indexOf("OU ") === 0 && (sel === "Over" || sel === "Under")) return sel + " " + merc.slice(3);
    if (merc === "1X2" && /^[1X2]$/.test(sel)) return "Esito " + sel;
    return sel;
  }

  function fiducia(m) {
    if (m == null) return null;
    if (m < 2) return ["stretto", "prezzo stretto, il numero regge"];
    if (m < 5) return ["medio", "prezzo medio"];
    return ["largo", "prezzo largo, la probabilità balla"];
  }

  // ------------------------------------------- verso del movimento
  //
  // IL CAMPO "Movimento" NON DICE IL VERSO, e nemmeno di quale quota si
  // parla: e' il movimento del mercato 1X2 della partita (il "Mov" di
  // AsianOdds), in punti di probabilita', sempre positivo. Su un Over 1.5
  // scriverci "la quota si e' mossa" faceva pensare alla quota dell'Over.
  //
  // Il verso si ricava dal file AsianOdds del giorno, che porta quote di
  // apertura e attuali (Q1 Apre -> Q1 ...) e la linea gol di apertura e
  // attuale (OU Apre -> OU). Per ogni riga si dice SOLO quello che la
  // riguarda: la quota del suo esito, e/o la linea gol.
  //
  // Le righe dei Pronostici con Fonte AsianOdds portano i nomi di AsianOdds
  // tali e quali: si ritrovano per nome esatto, data compresa (506 su 506
  // il 27 ottobre). Nessuna somiglianza: se non combaciano, niente verso.
  // GLI ESITI DELLA SCHEDINA: schedina_<data>.json porta, riga per riga,
  // "presa" o "sbagliata" (esiti_schedina.py, con le regole di
  // misura_fonti.py). Si agganciano per chiave esatta: data, partita,
  // mercato e selezione come le scrive prezzi_equi.py.
  function conEsiti(righe, data) {
    if (!Array.isArray(righe) || righe.some(function (r) { return r.Esito; })) return Promise.resolve(righe);
    return leggi("schedina_" + data + ".json").catch(function () { return null; }).then(function (s) {
      if (!Array.isArray(s)) return righe;
      var per = {};
      s.forEach(function (x) { if (x.Esito) per[chiave(x)] = x; });
      return righe.map(function (r) {
        var x = per[chiave(r)];
        if (!x) return r;
        var o = {};
        for (var k in r) o[k] = r[k];
        o.Esito = x.Esito; o.Gol_Casa = x.Gol_Casa; o.Gol_Ospite = x.Gol_Ospite; o.Risultato_Da = x.Risultato_Da;
        return o;
      });
    });
  }

  function arricchisciPrezzi(righe, data) {
    return conEsiti(righe, data).then(function (r2) { return arricchisciAO(r2, data); });
  }
  function arricchisciAO(righe, data) {
    return leggi("asianodds_" + data + ".json").catch(function () { return null; }).then(function (ao) {
      if (!Array.isArray(ao) || !Array.isArray(righe)) return righe;
      var per = {};
      ao.forEach(function (a) { per[(a.Data || data) + "|" + a.Casa + "|" + a.Ospite] = a; });
      return righe.map(function (r) {
        if (r.Fonte !== "AsianOdds") return r;
        var a = per[(r.Data || data) + "|" + r.Casa + "|" + r.Ospite];
        if (!a) return r;
        var o = {};
        for (var k in r) o[k] = r[k];
        o._ao = a;
        return o;
      });
    });
  }

  var NOME_ESITO = { "1": "dell'1", "X": "della X", "2": "del 2" };
  var ESCLUSO = { "1X": "2", "X2": "1", "12": "X" };

  function versoQuota(a, esito, doppia) {
    var qa = num(a["Q" + esito + " Apre"]), qc = num(a["Q" + esito]);
    if (qa == null || qc == null) return null;
    var di = "La quota " + NOME_ESITO[esito];
    if (Math.abs(qc - qa) < 0.005) return di + " non si \u00e8 mossa dall'apertura (" + qc.toFixed(2) + ").";
    var su = qc > qa, pct = (qc / qa - 1) * 100;
    var t = di + " \u00e8 " + (su ? "salita" : "scesa") + " da " + qa.toFixed(2) + " a " + qc.toFixed(2) +
      " dall'apertura (" + (pct > 0 ? "+" : "") + pct.toFixed(0) + "%)";
    if (doppia) {
      // Nella doppia la quota che conta e' quella dell'esito escluso.
      return t + ": \u00e8 l'esito che la " + doppia + " lascia fuori, quindi il mercato crede " +
        (su ? "di pi\u00f9" : "di meno") + " nella " + doppia + ".";
    }
    return t + ": il mercato ci crede " + (su ? "di meno" : "di pi\u00f9") + ".";
  }

  function versoLinea(a) {
    var la = num(a["OU Apre"]), lc = num(a.OU);
    if (la == null || lc == null) return null;
    if (Math.abs(lc - la) < 0.001) return "La linea gol del book non si \u00e8 mossa dall'apertura (" + lc + ").";
    return "La linea gol del book \u00e8 " + (lc > la ? "salita" : "scesa") + " da " + la + " a " + lc +
      " dall'apertura: il mercato si aspetta " + (lc > la ? "pi\u00f9" : "meno") + " gol.";
  }

  function movimentoVersi(r) {
    var a = r._ao;
    if (!a) return [];
    var sel = String(r.Sel || ""), merc = String(r.Mercato || ""), g = String(r.Gruppo || "");
    var out = [];
    var esito = sel.split(" + ")[0].trim();
    if (g === "1X2" || g === "Combo") {
      if (/^[1X2]$/.test(esito)) out.push(versoQuota(a, esito));
      else if (ESCLUSO[esito]) out.push(versoQuota(a, ESCLUSO[esito], esito));
    }
    var gol = g === "Under Over" || g === "Gol NoGol" || merc.indexOf("OU") === 0 || / \+ (Over|Under|Gol|NoGol)/.test(sel);
    if (gol) out.push(versoLinea(a));
    return out.filter(Boolean);
  }

  function chiave(r) {
    return [r.Data, r.Partita, r.Mercato, r.Sel].join("|");
  }

  function rigaPrezzo(r, i) {
    var prob = num(r.Prob), equa = num(r.Equa), marg = num(r.Margine);
    var linea = r.Linea_OU, gol = num(r.Gol_attesi), mov = num(r.Movimento);
    var merc = String(r.Mercato || ""), sel = String(r.Sel || "");
    var fid = fiducia(marg);
    var k = chiave(r);
    var scelta = !!scelte[k];

    var det = [];
    if (r.Campionato) det.push("<p>" + esc(r.Campionato) + "</p>");
    det.push("<p>Quota reale " + f2(equa) + " – probabilità " + f0(prob) + "%. " +
      "Sopra quella quota prendi valore, sotto paghi margine.</p>");
    if (r.Fonte === "FootyMetrics") {
      det.push("<p>Prezzo da FootyMetrics: AsianOdds copre solo le prossime 24 ore. " +
        "Sulle partite che hanno tutte e due, le due fonti differiscono di 0.7 punti in mediana.</p>");
    }
    if (fid) det.push("<p>Margine del book: " + f1(marg) + "% (" + fid[1] + ")</p>");
    if (linea !== null && linea !== undefined && linea !== "") {
      det.push("<p>Linea principale del book " + esc(linea) + " – gol attesi " + f2(gol) +
        ". È la linea della partita, non quella di questa riga.</p>");
    }
    var versi = movimentoVersi(r);
    if (versi.length) versi.forEach(function (t) { det.push("<p>" + t + "</p>"); });
    else if (mov) det.push("<p>Il mercato 1X2 di questa partita si \u00e8 mosso di " + f1(mov) + " punti dall'apertura.</p>");
    if (merc.indexOf("OU") === 0) {
      det.push('<p class="avviso">Su 563 partite finite il modello ha sottostimato gli Over di 4.6 punti: qui semmai il numero è basso.</p>');
    } else if (sel.indexOf("1X") >= 0 || sel.indexOf("X2") >= 0) {
      det.push('<p class="avviso">Le doppie con la X sono le meno affidabili: Poisson sottostima i pareggi, quindi la quota reale è un po\' troppo generosa.</p>');
    } else if (merc === "BTTS") {
      det.push("<p>È il mercato tarato meglio: fascia 55-65%, 238 partite, previsto 60.0% e uscito 60.1%.</p>");
    }

    // Giornata passata senza risultato (la fonte dei risultati non ha la
    // partita): niente spunta, che per una partita giocata non ha senso.
    var es = r.Esito || (r.Data && r.Data < oggi() ? "attesa" : null), gol = (r.Gol_Casa != null && r.Gol_Ospite != null) ? r.Gol_Casa + "-" + r.Gol_Ospite : "";
    if (es === "attesa") det.unshift("<p>Risultato non disponibile: nessuna delle fonti dei risultati ha questa partita.</p>");
    else if (es) det.unshift("<p>Finita " + esc(gol) + ": " + (es === "presa" ? "vinta" : es === "sbagliata" ? "sbagliata" : "rimborso") +
      (r.Risultato_Da ? " (risultato da " + esc(r.Risultato_Da) + ")" : "") + ".</p>");
    var segnoEsito = es === "presa" ? "\u2713" : es === "sbagliata" ? "\u2717" : es === "attesa" ? "\u2013" : "\u21ba";
    return '<div class="riga' + (scelta ? " scelta" : "") + (es ? " finita" : "") + '">' +
      (es ? '<span class="spunta esito ' + esc(es) + '" title="' + esc(es === "presa" ? "vinta" : es) + '" aria-label="' + esc(es === "presa" ? "vinta" : es) + '">' + segnoEsito + "</span>"
        : '<label class="spunta" title="Aggiungi alla multipla"><input type="checkbox" data-chiave="' +
      esc(k) + '" data-i="' + i + '"' + (scelta ? " checked" : "") + ' aria-label="Aggiungi alla multipla"></label>') +
      "<details><summary>" +
      '<div class="corpo">' +
      '<div class="alto"><span>' + esc(r.Ora || "") + "</span>" +
      (gol ? "<span><b>" + esc(gol) + "</b></span>" : "") +
      (r.Gruppo ? '<span class="chip">' + esc(r.Gruppo) + "</span>" : "") +
      (fid ? '<span class="pill ' + fid[0] + '">margine ' + f1(marg) + "%</span>" : "") +
      "</div>" +
      '<div class="partita">' + partitaHtml(r.Casa, r.Ospite, r.Partita, campiRiga(r)) + "</div>" +
      '<div class="sel">' + esc(etichettaSel(r)) + "</div>" +
      (prob != null ? '<div class="pbar"><i style="width:' + Math.min(100, prob) + '%"></i></div>' : "") +
      "</div>" +
      '<div class="numero"><b>' + f2(equa) + "</b><span>" + f0(prob) + "%</span></div>" +
      "</summary>" +
      '<div class="dettaglio">' + det.join("") + "</div>" +
      "</details></div>";
  }

  // ------------------------------------------------------- multipla

  var $m = document.getElementById("multipla");
  document.getElementById("m-svuota").addEventListener("click", function () {
    scelte = {};
    chiudiInvio();
    aggiornaMultipla();
    ridisegnaRighe();
  });

  // Il margine si compone a ogni evento: la quota equa cresce col
  // prodotto, quella pagata perde il margine di ogni partita. La stima
  // usa il margine riportato per ciascuna riga, con la stessa aritmetica
  // del documento di stato (1.60 equa, 6% x 10 eventi -> 0.89).
  function aggiornaMultipla() {
    var r = Object.keys(scelte).map(function (k) { return scelte[k]; });
    if (!r.length) { $m.hidden = true; chiudiInvio(); document.body.style.paddingBottom = ""; return; }
    $m.hidden = false;
    var equa = 1, pagata = 1, prob = 1, senzaMarg = 0;
    r.forEach(function (x) {
      var e = num(x.Equa), m = num(x.Margine), p = num(x.Prob);
      equa *= e || 1;
      prob *= p != null ? p / 100 : 1;
      if (m == null) { senzaMarg++; pagata *= e || 1; } else pagata *= (e || 1) / (1 + m / 100);
    });
    var perdita = (pagata / equa - 1) * 100;
    document.getElementById("m-eventi").textContent =
      r.length + (r.length === 1 ? " evento" : " eventi") + " · probabilità " + (prob * 100).toFixed(1) + "%";
    document.getElementById("m-equa").textContent = "reale " + equa.toFixed(2);
    document.getElementById("m-stima").textContent =
      "Col margine di ciascuna partita il book pagherebbe circa " + pagata.toFixed(2) +
      " (" + perdita.toFixed(0) + "%)." +
      (senzaMarg ? " " + senzaMarg + " righe senza margine, contate a prezzo pieno." : "") +
      " Il tuo bookmaker può caricarne di più: confronta la quota che vedi con quella reale.";

    // Una riga per partita: due selezioni sulla stessa gara cadono insieme.
    var conta = {};
    r.forEach(function (x) {
      var p = (x.Data || "") + "|" + String(x.Partita || "").toLowerCase();
      conta[p] = (conta[p] || 0) + 1;
    });
    var doppie = Object.keys(conta).filter(function (p) { return conta[p] > 1; })
      .map(function (p) { return p.split("|")[1]; });
    var $a = document.getElementById("m-avviso");
    if (doppie.length) {
      $a.hidden = false;
      $a.textContent = "Stessa partita due volte (" + doppie.join(", ") +
        "): non sono eventi indipendenti, cadono insieme e il prodotto delle quote mente.";
    } else $a.hidden = true;
    document.body.style.paddingBottom = $m.offsetHeight + "px";
    if ($invio) preparaSeAperto();
  }

  // ------------------------------------------- condividi la multipla
  //
  // TUTTO NEL TELEFONO, NIENTE SERVER: il testo si compone qui dalle righe
  // scelte, con gli stessi numeri della barra (quota reale, probabilita',
  // stima col margine). Poi:
  //   - "Condividi..." apre il menu di condivisione del telefono
  //     (navigator.share): WhatsApp, Telegram, email, Messaggi, Drive...;
  //     c'e' solo dove il browser lo offre, altrove il bottone non compare;
  //   - WhatsApp, Telegram, Email aprono l'app con il testo gia' scritto
  //     (wa.me, t.me/share, mailto): il testo si', l'allegato no, per
  //     questi indirizzi non esiste modo di passarlo;
  //   - "Invia come file..." passa il .txt al menu del telefono, che cosi'
  //     lo allega (solo dove navigator.canShare accetta file);
  //   - .txt e .csv si scaricano. Il .csv e' con il punto e virgola e la
  //     virgola nei decimali: Excel in italiano lo apre in colonne.

  var SITO = "https://caltiki.github.io/pronostici-repo/sito/";
  var MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio",
    "agosto", "settembre", "ottobre", "novembre", "dicembre"];
  var GIORNI_LUNGHI = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];

  function dataLunga(d) {
    var t = new Date(d + "T12:00:00Z");
    if (isNaN(t)) return d || "";
    return GIORNI_LUNGHI[t.getUTCDay()] + " " + t.getUTCDate() + " " + MESI[t.getUTCMonth()];
  }

  function righeScelte() {
    return Object.keys(scelte).map(function (k) { return scelte[k]; }).sort(function (a, b) {
      var x = (a.Data || "") + " " + (a.Ora || ""), y = (b.Data || "") + " " + (b.Ora || "");
      return x < y ? -1 : x > y ? 1 : String(a.Partita || "").localeCompare(String(b.Partita || ""));
    });
  }

  function conti(r) {
    var equa = 1, pagata = 1, prob = 1;
    r.forEach(function (x) {
      var e = num(x.Equa), m = num(x.Margine), p = num(x.Prob);
      equa *= e || 1;
      prob *= p != null ? p / 100 : 1;
      pagata *= m == null ? (e || 1) : (e || 1) / (1 + m / 100);
    });
    return { equa: equa, pagata: pagata, prob: prob * 100 };
  }

  function testoMultipla() {
    var r = righeScelte(), c = conti(r), out = ["Multipla - Sistema Pronostici", ""], giorno = null;
    r.forEach(function (x) {
      if (x.Data !== giorno) {
        if (giorno !== null) out.push("");
        giorno = x.Data;
        var g = dataLunga(giorno);
        out.push(g.charAt(0).toUpperCase() + g.slice(1));
      }
      out.push((x.Ora ? x.Ora + "  " : "") + (x.Partita || ""));
      if (x.Campionato) out.push("    " + x.Campionato);
      out.push("    " + etichettaSel(x) + " -> quota reale " + f2(num(x.Equa)) +
        " (" + f0(num(x.Prob)) + "%)");
    });
    out.push("");
    out.push(r.length + (r.length === 1 ? " evento" : " eventi") + " · probabilità " +
      c.prob.toFixed(1) + "% · quota reale " + c.equa.toFixed(2));
    out.push("Col margine del bookmaker pagherebbe circa " + c.pagata.toFixed(2) + ".");
    out.push("Quota reale = quella del bookmaker senza il suo guadagno: se la tua è più bassa, ci perdi.");
    out.push("");
    out.push(SITO);
    return out.join("\n");
  }

  function csvMultipla() {
    var r = righeScelte(), c = conti(r);
    function cella(v) {
      v = String(v == null ? "" : v);
      return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }
    function dec(v, n) { return v == null ? "" : v.toFixed(n).replace(".", ","); }
    var righe = [["Data", "Ora", "Campionato", "Partita", "Giocata", "Probabilità %", "Quota reale", "Margine book %"]];
    r.forEach(function (x) {
      righe.push([x.Data, x.Ora, x.Campionato, x.Partita, etichettaSel(x),
        dec(num(x.Prob), 1), dec(num(x.Equa), 2), dec(num(x.Margine), 1)]);
    });
    righe.push([]);
    righe.push(["Totale", "", "", r.length + (r.length === 1 ? " evento" : " eventi"), "",
      dec(c.prob, 1), dec(c.equa, 2), ""]);
    righe.push(["Stima col margine", "", "", "", "", "", dec(c.pagata, 2), ""]);
    return "\ufeff" + righe.map(function (l) { return l.map(cella).join(";"); }).join("\r\n") + "\r\n";
  }

  function nomeFile(est) {
    var r = righeScelte(), d = r.length ? r[0].Data : oggi();
    return "multipla_" + d + "." + est;
  }

  var $invio = document.getElementById("m-invio");
  var $condividi = document.getElementById("m-condividi");
  var $esitoInvio = document.getElementById("m-esito-invio");
  var $nativo = $invio.querySelector('[data-invio="nativo"]');
  var $file = $invio.querySelector('[data-invio="file"]');
  var timerInvio = null;

  if (navigator.share) $nativo.hidden = false;
  try {
    if (navigator.canShare && typeof File === "function" &&
        navigator.canShare({ files: [new File(["x"], "prova.txt", { type: "text/plain" })] })) $file.hidden = false;
  } catch (e) { /* niente file: resta lo scaricamento */ }
  var $immagine = $invio.querySelector('[data-invio="immagine"]');
  try {
    if (navigator.canShare && typeof File === "function" &&
        navigator.canShare({ files: [new File([new Uint8Array(8)], "prova.png", { type: "image/png" })] })) $immagine.hidden = false;
  } catch (e) { /* niente: resta "Scarica immagine" */ }

  // ------------------------------------------ l'immagine della multipla
  //
  // DISEGNATA QUI, SU UN CANVAS, con i colori del tema in uso e i
  // caratteri del sito: niente librerie esterne e niente server. Gli
  // stemmi restano fuori: vengono da un altro indirizzo e un'immagine
  // presa da li' puo' bloccare il salvataggio del canvas.
  //
  // PERCHE' SI PREPARA PRIMA: il menu di condivisione del telefono si
  // apre solo "dentro" il tocco. Safari su iPhone lo rifiuta se nel mezzo
  // c'e' da aspettare (caratteri, conversione in PNG). Cosi' l'immagine
  // si prepara quando si apre il pannello e quando cambia la multipla, e
  // al tocco e' gia' pronta.

  var IMG = { chiave: null, blob: null, inCorso: null };

  function chiaveImmagine() {
    return (document.documentElement.getAttribute("data-theme") || "") + "|" + testoMultipla();
  }

  function colori() {
    var cs = getComputedStyle(document.documentElement);
    function v(n, d) { var x = cs.getPropertyValue(n).trim(); return x || d; }
    return {
      sfondo: v("--sfondo", "#0b1120"), scheda: v("--scheda", "#131c2e"),
      testo: v("--testo", "#e2e8f0"), tenue: v("--tenue", "#94a3b8"),
      bordo: v("--bordo", "#1f2a3d"), evidenza: v("--evidenza", "#a78bfa"),
      alone: v("--evidenza-tenue", "rgba(139,92,246,.16)")
    };
  }

  function rettangolo(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Al massimo "quante" righe; l'ultima chiude con i puntini se non ci sta.
  function aCapo(ctx, t, larg, quante) {
    var parole = String(t || "").split(/\s+/), righe = [], cor = "";
    for (var i = 0; i < parole.length; i++) {
      var prova = cor ? cor + " " + parole[i] : parole[i];
      if (ctx.measureText(prova).width <= larg || !cor) cor = prova;
      else { righe.push(cor); cor = parole[i]; }
    }
    if (cor) righe.push(cor);
    if (righe.length > quante) {
      righe = righe.slice(0, quante);
      var u = righe[quante - 1];
      while (u.length > 1 && ctx.measureText(u + "…").width > larg) u = u.slice(0, -1);
      righe[quante - 1] = u.replace(/\s+$/, "") + "…";
    }
    return righe;
  }

  var MAN = "Manrope, system-ui, sans-serif", BAR = '"Barlow Condensed", Manrope, sans-serif';

  // Due passate con la stessa funzione: la prima misura l'altezza, la
  // seconda disegna.
  function disegnaMultipla(ctx, W, col, disegnaDavvero) {
    var r = righeScelte(), c = conti(r), P = 56, y = P;
    function fill(f) { if (disegnaDavvero) f(); }

    // Testa: titolo a sinistra, quota reale a destra.
    ctx.textBaseline = "alphabetic";
    fill(function () {
      ctx.fillStyle = col.tenue; ctx.font = "800 26px " + MAN; ctx.textAlign = "left";
      ctx.fillText("MULTIPLA", P, y + 30);
      ctx.fillStyle = col.testo; ctx.font = "800 40px " + MAN;
      ctx.fillText("Sistema Pronostici", P, y + 80);
      ctx.textAlign = "right"; ctx.fillStyle = col.evidenza; ctx.font = "700 104px " + BAR;
      ctx.fillText(c.equa.toFixed(2), W - P, y + 84);
      ctx.fillStyle = col.tenue; ctx.font = "700 22px " + MAN;
      ctx.fillText("QUOTA REALE", W - P, y + 116);
    });
    y += 150;
    fill(function () {
      ctx.textAlign = "left"; ctx.fillStyle = col.testo; ctx.font = "600 28px " + MAN;
      ctx.fillText(r.length + (r.length === 1 ? " evento" : " eventi") + "  ·  probabilità " +
        c.prob.toFixed(1) + "%", P, y);
      ctx.fillStyle = col.tenue; ctx.font = "500 24px " + MAN;
      ctx.fillText("Col margine del bookmaker pagherebbe circa " + c.pagata.toFixed(2), P, y + 38);
    });
    y += 78;

    var giorno = null, LQ = 190, xT = P + 34, largT = W - 2 * P - 34 - LQ;
    r.forEach(function (x) {
      if (x.Data !== giorno) {
        giorno = x.Data;
        y += 22;
        fill(function () {
          ctx.textAlign = "left"; ctx.fillStyle = col.tenue; ctx.font = "800 24px " + MAN;
          ctx.fillText(dataLunga(giorno).toUpperCase(), P, y + 24);
        });
        y += 46;
      }
      ctx.font = "800 36px " + MAN;
      var nomi = aCapo(ctx, x.Partita || "", largT, 2);
      ctx.font = "600 24px " + MAN;
      var sopra = aCapo(ctx, (x.Ora ? x.Ora + "  ·  " : "") + (x.Campionato || ""), largT, 1)[0] || "";
      var h = 28 + 30 + nomi.length * 46 + 44 + 30 + 28;
      var y0 = y, prob = num(x.Prob);
      fill(function () {
        ctx.save();
        rettangolo(ctx, P, y0, W - 2 * P, h, 24);
        ctx.fillStyle = col.scheda; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = col.bordo; ctx.stroke();
        ctx.clip();
        ctx.fillStyle = col.evidenza; ctx.fillRect(P, y0, 8, h);
        ctx.restore();
        var yy = y0 + 28 + 24;
        ctx.textAlign = "left"; ctx.fillStyle = col.tenue; ctx.font = "600 24px " + MAN;
        ctx.fillText(sopra, xT, yy);
        yy += 10;
        ctx.fillStyle = col.testo; ctx.font = "800 36px " + MAN;
        nomi.forEach(function (n) { yy += 46; ctx.fillText(n, xT, yy); });
        yy += 44;
        ctx.fillStyle = col.evidenza; ctx.font = "700 32px " + MAN;
        ctx.fillText(etichettaSel(x), xT, yy);
        // barra della probabilita', come sul sito
        var bx = xT, by = yy + 22, bw = largT, bh = 8;
        rettangolo(ctx, bx, by, bw, bh, 4); ctx.fillStyle = col.bordo; ctx.fill();
        if (prob != null) {
          rettangolo(ctx, bx, by, Math.max(bh, bw * Math.min(100, prob) / 100), bh, 4);
          ctx.fillStyle = col.evidenza; ctx.fill();
        }
        // quota e probabilita' a destra
        ctx.textAlign = "right"; ctx.fillStyle = col.evidenza; ctx.font = "700 76px " + BAR;
        ctx.fillText(f2(num(x.Equa)), W - P - 32, y0 + h / 2 + 12);
        ctx.fillStyle = col.tenue; ctx.font = "600 26px " + MAN;
        ctx.fillText(f0(prob) + "%", W - P - 32, y0 + h / 2 + 50);
      });
      y += h + 16;
    });

    y += 22;
    fill(function () {
      ctx.textAlign = "left"; ctx.fillStyle = col.tenue; ctx.font = "500 22px " + MAN;
      ctx.fillText("Quota reale = quella del bookmaker senza il suo guadagno.", P, y + 22);
      ctx.fillText("Se quella che ti offre è più bassa, ci perdi.", P, y + 52);
      ctx.fillStyle = col.testo; ctx.font = "700 22px " + MAN;
      ctx.fillText(SITO.replace(/^https:\/\//, "").replace(/\/$/, ""), P, y + 92);
    });
    y += 92 + P;
    return y;
  }

  function preparaImmagine() {
    var k = chiaveImmagine();
    if (IMG.chiave === k && (IMG.blob || IMG.inCorso)) return IMG.inCorso || Promise.resolve(IMG.blob);
    IMG.chiave = k; IMG.blob = null;
    var caratteri = document.fonts && document.fonts.load ? Promise.all([
      document.fonts.load("800 36px Manrope"), document.fonts.load("600 24px Manrope"),
      document.fonts.load('700 76px "Barlow Condensed"')]).catch(function () {}) : Promise.resolve();
    var p = caratteri.then(function () {
      var W = 1080, col = colori();
      var prova = document.createElement("canvas").getContext("2d");
      var H = Math.ceil(disegnaMultipla(prova, W, col, false));
      var cv = document.createElement("canvas");
      cv.width = W; cv.height = H;
      var ctx = cv.getContext("2d");
      ctx.fillStyle = col.sfondo; ctx.fillRect(0, 0, W, H);
      var g = ctx.createRadialGradient(W * 0.85, 0, 0, W * 0.85, 0, W * 0.9);
      g.addColorStop(0, col.alone); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      disegnaMultipla(ctx, W, col, true);
      return new Promise(function (ok, ko) {
        cv.toBlob(function (b) { b ? ok(b) : ko(new Error("PNG non creato")); }, "image/png");
      });
    }).then(function (b) {
      if (IMG.chiave === k) { IMG.blob = b; IMG.inCorso = null; }
      return b;
    }, function (e) {
      if (IMG.chiave === k) { IMG.chiave = null; IMG.inCorso = null; }
      throw e;
    });
    IMG.inCorso = p;
    return p;
  }
  function preparaSeAperto() {
    if (!$invio.hidden && Object.keys(scelte).length) preparaImmagine().catch(function () {});
  }

  function avvisaInvio(t) {

  }
  $condividi.addEventListener("click", function () {

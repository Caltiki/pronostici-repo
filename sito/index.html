  function scarica(contenuto, nome, tipo) {
    var url = URL.createObjectURL(contenuto instanceof Blob ? contenuto : new Blob([contenuto], { type: tipo }));
    var a = document.createElement("a");
    a.href = url; a.download = nome; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }

  function copia(t) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(t);
    }
    return new Promise(function (ok, ko) {
      var ta = document.createElement("textarea");
      ta.value = t; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var fatto = false;
      try { fatto = document.execCommand("copy"); } catch (e) { /* sotto */ }
      ta.remove();
      fatto ? ok() : ko();
    });
  }

  function apri(url) {
    // Una scheda nuova per WhatsApp e Telegram (sul telefono si apre
    // l'app); il sito resta dov'era. Con window.open(..., "noopener") il
    // browser restituisce sempre null e non si sa se la scheda e' partita:
    // un link vero, cliccato, non ha questo problema.
    var a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.style.display = "none";
    document.body.appendChild(a); a.click(); a.remove();
  }

  $invio.addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-invio]");
    if (!b || !Object.keys(scelte).length) return;
    var t = testoMultipla(), titolo = "Multipla - Sistema Pronostici";
    switch (b.getAttribute("data-invio")) {
      case "nativo":
        navigator.share({ title: titolo, text: t }).catch(function (e) {
          if (e && e.name !== "AbortError") avvisaInvio("Condivisione non riuscita: usa Copia testo.");
        });
        break;
      case "whatsapp":
        apri("https://wa.me/?text=" + encodeURIComponent(t));
        break;
      case "telegram":
        // t.me/share vuole un url: il sito va li', e si toglie dal testo
        // per non averlo due volte.
        apri("https://t.me/share/url?url=" + encodeURIComponent(SITO) +
          "&text=" + encodeURIComponent(t.replace("\n\n" + SITO, "")));
        break;
      case "email":
        location.href = "mailto:?subject=" + encodeURIComponent(titolo) + "&body=" + encodeURIComponent(t);
        break;
      case "copia":
        copia(t).then(function () { avvisaInvio("Copiato: incollalo dove vuoi."); },
          function () { avvisaInvio("Il browser non lascia copiare: usa Scarica .txt."); });
        break;
      case "file":
        var f = new File([t], nomeFile("txt"), { type: "text/plain" });
        navigator.share({ title: titolo, files: [f] }).catch(function (e) {
          if (e && e.name !== "AbortError") avvisaInvio("Il file non è partito: usa Scarica .txt.");
        });
        break;
      case "immagine":
        // Pronta: si condivide subito, dentro il tocco. Non pronta (appena
        // cambiata la multipla o il tema): si prepara e si chiede di
        // ritoccare, perche' dopo l'attesa il telefono rifiuterebbe.
        if (IMG.blob && IMG.chiave === chiaveImmagine()) {
          var fi = new File([IMG.blob], nomeFile("png"), { type: "image/png" });
          navigator.share({ title: titolo, files: [fi] }).catch(function (e) {
            if (e && e.name !== "AbortError") avvisaInvio("L'immagine non è partita: usa Scarica immagine.");
          });
        } else {
          avvisaInvio("Preparo l'immagine…");
          preparaImmagine().then(function () { avvisaInvio("Immagine pronta: tocca di nuovo Invia immagine."); },
            function () { avvisaInvio("Immagine non riuscita su questo browser."); });
        }
        break;
      case "png":
        preparaImmagine().then(function (bl) {
          scarica(bl, nomeFile("png"), "image/png");
          avvisaInvio("Scaricato " + nomeFile("png") + ".");
        }, function () { avvisaInvio("Immagine non riuscita su questo browser."); });
        break;
      case "txt":
        scarica(t, nomeFile("txt"), "text/plain;charset=utf-8");
        avvisaInvio("Scaricato " + nomeFile("txt") + ".");
        break;
      case "csv":
        scarica(csvMultipla(), nomeFile("csv"), "text/csv;charset=utf-8");
        avvisaInvio("Scaricato " + nomeFile("csv") + ": si apre con Excel.");
        break;
    }
  });

  // --------------------------------------------------- consensus medio

  // LA FONTE SCELTA NEL MENU. Le fonti del consenso medio sono quelle che
  // stanno nella colonna "Elenco": scegliendone una restano le partite su
  // cui quella fonte si e' espressa, e sotto ciascuna compare il suo
  // pronostico. Il pronostico NON si ricalcola qui: viene dalla scheda
  // della partita (scheda_<data>.json), dove scheda_partite.py l'ha letto
  // con le regole di misura_fonti.py, le stesse di "Statistiche fonti".
  var FONTI_CM = [["statarea", "Statarea"], ["betimate", "Betimate"], ["footymetrics", "FootyMetrics"],
                  ["ratingbet", "RatingBet"], ["soccersite", "SoccerSite"]];
  // LE FONTI FUORI DALLA MEDIA. xGaura e Sportytrader non entrano nel
  // consenso per scelta (sezioni a se', le loro "confidenze" non sono
  // probabilita' di cui fidarsi), WebPronostici solo nella vista con
  // Statarea. Si possono scegliere per vederle ACCANTO alla media: restano
  // le partite su cui hanno un pronostico, la media resta quella delle
  // altre fonti.
  var FONTI_FUORI = [["xgaura", "xGaura"], ["sportytrader", "Sportytrader"], ["webpronostici", "WebPronostici"]];
  function fuoriMedia(f) { return FONTI_FUORI.some(function (o) { return o[0] === f; }); }
  function nomeCm(f) {
    var o = FONTI_CM.concat(FONTI_FUORI).filter(function (x) { return x[0] === f; })[0];
    return o ? o[1] : f;
  }
  function sceltaFonteHtml() {
    function opz(o) {
      return '<option value="' + o[0] + '"' + (o[0] === stato.fonteCm ? " selected" : "") + ">" + esc(o[1]) + "</option>";
    }
    return '<select id="fonte-cm" aria-label="Fonte">' + opz(["", "Tutte le fonti"]) +
      '<optgroup label="Nella media">' + FONTI_CM.map(opz).join("") + "</optgroup>" +
      '<optgroup label="Fuori dalla media">' + FONTI_FUORI.map(opz).join("") + "</optgroup></select>";
  }
  function haFonte(r, f) {
    if (fuoriMedia(f)) return !!(r._prons && r._prons.some(function (x) { return x.Fonte === f; }));
    return String(r.Elenco || "").split(/,\s*/).indexOf(f) >= 0;
  }
  function arricchisciConsensus(righe, data) {
    if (!Array.isArray(righe)) return righe;
    return leggi("scheda_" + data + ".json").catch(function () { return null; }).then(function (s) {
      if (!s || !s.alias) return righe;
      var per = {};
      (s.partite || []).forEach(function (p) { per[p.id] = p; });
      return righe.map(function (r) {
        var p = per[s.alias["consensusmedio|" + r.Casa + "|" + r.Ospite]];
        if (!p) return r;
        var o = {};
        for (var k in r) o[k] = r[k];
        o._prons = p.Pronostici || [];
        return o;
      });
    });
  }
  function pronFonteHtml(r) {
    if (!stato.fonteCm || !r._prons) return "";
    var mie = r._prons.filter(function (x) { return x.Fonte === stato.fonteCm; });
    if (!mie.length) return "";
    var nome = nomeCm(stato.fonteCm);
    return '<div class="pron-lista">' + mie.map(function (x) {
      return '<span class="esito-pill fonte-pill"><b>' + esc(nome) + "</b> \u00b7 " +
        esc(x.Mercato ? etichettaPron(x) : (x.Testo || "?")) +
        (num(x.Prob) != null ? " \u00b7 " + f0(num(x.Prob)) + "%" : "") + "</span>";
    }).join("") + "</div>";
  }

  // QUANTE FONTI SONO D'ACCORDO COL SEGNO DELLA MEDIA, xGaura, Sportytrader
  // e WebPronostici comprese. Non tocca la media: e' un conteggio. Di ogni
  // fonte si guarda un solo pronostico sull'esito, il primo 1X2 secco o in
  // mancanza la doppia chance; la doppia e' d'accordo se contiene il segno
  // ("1X" sta con l'1). I pronostici sono quelli della scheda della
  // partita, letti da scheda_partite.py con le regole di misura_fonti.py.
  function accordoSegno(r) {
    var segno = String(r.Segno || "").toUpperCase();
    if (!r._prons || !/^[1X2]$/.test(segno)) return null;
    var per = {};
    r._prons.forEach(function (x) {
      if (x.Mercato !== "1X2" && x.Mercato !== "DC") return;
      var g = per[x.Fonte];
      if (!g || (g.Mercato === "DC" && x.Mercato === "1X2")) per[x.Fonte] = x;
    });
    var si = [], no = [];
    Object.keys(per).sort(function (a, b) { return nomeFonte(a).localeCompare(nomeFonte(b)); }).forEach(function (f) {
      var x = per[f];
      (String(x.Sel).indexOf(segno) >= 0 ? si : no).push(nomeFonte(f) + " " + x.Sel);
    });
    return si.length + no.length ? { segno: segno, si: si, no: no } : null;
  }
  function articolo(s) { return s === "X" ? "sulla X" : s === "2" ? "sul 2" : "sull'1"; }

  function cmTiene(r, tipo) {
    if (tipo === "mercato") return num(r.Scarto) != null;
    if (tipo === "multi") return (num(r.Fonti) || 0) >= 2;
    return true;
  }

  function rigaConsensus(r) {
    var segno = String(r.Segno || "").toUpperCase();
    var fonti = num(r.Fonti) || 0;
    var p1 = num(r.P1), px = num(r.PX), p2 = num(r.P2);
    var m1 = num(r.MP1), mx = num(r.MPX), m2 = num(r.MP2);
    var scarto = num(r.Scarto);
    var segnoM = String(r.Segno_Mercato || "").toUpperCase();
    var pSegno = segno === "1" ? p1 : segno === "X" ? px : p2;

    var coda = "";
    if (scarto != null) {
      coda = Math.abs(scarto) < 0.5 ? "in linea col mercato"
        : '<span class="' + (Math.abs(scarto) >= 10 ? "scarto-grosso" : "scarto") + '">' +
          (scarto > 0 ? "+" : "") + scarto.toFixed(0) + " vs mercato</span>";
    }

    var det = [];
    if (r.Lega) det.push("<p>" + esc(r.Lega) + "</p>");
    det.push("<p>Media delle fonti: 1 " + f0(p1) + "% · X " + f0(px) + "% · 2 " + f0(p2) + "%</p>");
    var acc = accordoSegno(r);
    if (acc) {
      det.push("<p>D\u2019accordo " + articolo(acc.segno) + ": " + (acc.si.length ? esc(acc.si.join(", ")) : "nessuna") +
        (acc.no.length ? ". Contro: " + esc(acc.no.join(", ")) : "") +
        '. <span class="piccolo">Conta tutte le fonti, anche quelle fuori dalla media.</span></p>');
    }
    if (fonti === 1) det.push("<p>Fonte unica: " + esc(r.Elenco) + ". Non è una media, è quella fonte.</p>");
    else det.push("<p>Media di " + fonti + " fonti: " + esc(r.Elenco) + "</p>");
    if (m1 != null) {
      det.push("<p>Mercato (Shin): 1 " + f0(m1) + "% · X " + f0(mx) + "% · 2 " + f0(m2) + "%</p>");
      if (segnoM && segnoM !== segno) {
        det.push('<p class="avviso">Segni diversi: le fonti dicono ' + esc(segno) + ", il mercato " + esc(segnoM) + ".</p>");
      }
      if (scarto != null) {
        det.push("<p>" + (/^[1X2]$/.test(segno) ? articolo(segno).replace(/^s/, "S") : "Sul " + esc(segno)) + ": le fonti danno " + Math.abs(scarto).toFixed(1) + " punti " +
          (scarto >= 0 ? "più" : "meno") + " del mercato.</p>");
        if (Math.abs(scarto) >= 10) {
          det.push('<p class="avviso">Scarto grosso. Sulle fonti misurate finora, quando si allontanano così dal mercato hanno torto più spesso, non meno.</p>');
        }
      }
    }

    return '<div class="riga"><details><summary>' +
      '<span class="segno">' + esc(segno || "?") + "</span>" +
      '<div class="corpo">' +
      '<div class="alto"><span>' + esc(r.Ora || "") + "</span><span>" + fonti + (fonti === 1 ? " fonte" : " fonti") + "</span></div>" +
      '<div class="partita">' + partitaHtml(r.Casa, r.Ospite, "", campiRiga(r)) + "</div>" +
      (coda ? '<div class="sel">' + coda + "</div>" : "") +
      (acc ? '<div class="accordo-conta">D\u2019accordo ' + articolo(acc.segno) + ": <b>" + acc.si.length +
        "</b> " + (acc.si.length + acc.no.length === 1 ? "fonte su 1" : "su " + (acc.si.length + acc.no.length) + " fonti") + "</div>" : "") +
      pronFonteHtml(r) +
      tripla("fonti", p1, px, p2) +
      (m1 != null ? tripla("mercato", m1, mx, m2) : "") +
      "</div>" +
      '<div class="numero"><b>' + f0(pSegno) + "%</b><span>" + (/^[1X2]$/.test(segno) ? articolo(segno) : "sul " + esc(segno)) + "</span></div>" +
      "</summary>" +
      '<div class="dettaglio">' + det.join("") + "</div>" +
      "</details></div>";
  }

  // ------------------------------------------------------- poisson xG

  function legenda() {
    return '<div class="legenda"><span><i class="s1"></i>1 casa</span><span><i class="sx"></i>X pareggio</span>' +
      "<span><i class=\"s2\"></i>2 trasferta</span></div>";
  }

  function poTiene(r, tipo) {
    if (tipo === "mercato") return num(r.M_P1) != null;
    return true;
  }

  // Il fattore campo lo scrive poisson_xg.py nell'indice: quanto dei gol
  // segna la squadra di casa, e su quante partite e' stimato.
  function notaCampo(ix) {
    var q = num(ix.quota_casa);
    if (q == null) return "";
    return '<p class="descr">Fattore campo: la squadra di casa prende il ' + (q * 100).toFixed(1) +
      "% dei gol attesi" + (ix.partite_stima ? ", stimato su " + esc(ix.partite_stima) + " partite" : "") +
      (ix.stima_da ? " (" + esc(ix.stima_da) + ")" : "") + ".</p>";
  }

  function riepilogoPoisson(v) {
    var conM = v.filter(function (r) { return num(r.M_P1) != null; });
    var sc = mediana(conM.map(function (r) { var x = num(r.Scarto_Segno); return x == null ? null : Math.abs(x); }));
    return tessere([
      [String(v.length), "partite"],
      [String(conM.length), "col prezzo del mercato"],
      [sc == null ? "-" : sc.toFixed(1), "scarto tipico sul segno, in punti"]
    ]) + legenda();
  }

  // IN EVIDENZA I GOL ATTESI, come in Kodi: i lambda sono quello che il
  // modello produce davvero, le percentuali ne discendono.
  function rigaPoisson(r) {
    var segno = String(r.Segno || "").toUpperCase();
    var lc = num(r.Lambda_Casa), lo = num(r.Lambda_Osp), gol = num(r.Gol_Attesi);
    var p1 = num(r.P1), px = num(r.PX), p2 = num(r.P2);
    var m1 = num(r.M_P1), mx = num(r.M_PX), m2 = num(r.M_P2);
    var mgol = num(r.M_Gol_Attesi), mlin = num(r.M_Linea), mmarg = num(r.M_Margine);
    var ds = num(r.Scarto_Segno), dg = num(r.Scarto_Gol);
    var mpc = num(r.MP_Casa), mpo = num(r.MP_Osp);

    var coda = "";
    if (ds != null) {
      coda = Math.abs(ds) < 0.5 ? " \u00b7 in linea col mercato"
        : ' \u00b7 <span class="' + (Math.abs(ds) >= 10 ? "scarto-grosso" : "scarto") + '">' +
          (ds > 0 ? "+" : "") + ds.toFixed(0) + " vs mercato</span>";
    }

    var det = [];
    if (r.Lega) det.push("<p>" + esc(String(r.Lega).replace(/\s*\[\d+\]$/, "")) + "</p>");
    det.push("<p>Modello: 1 " + f0(p1) + "% \u00b7 X " + f0(px) + "% \u00b7 2 " + f0(p2) + "%" +
      (num(r.Equa_Segno) != null ? " \u2013 quota del modello sul " + esc(segno) + " " + f2(num(r.Equa_Segno)) : "") + "</p>");
    det.push("<p>Lambda: casa " + f2(lc) + ", ospite " + f2(lo) + " (gol attesi " + f2(gol) + ")</p>");
    if (r.Fonte_xG) det.push("<p>xG da " + esc(r.Fonte_xG) + ".</p>");
    det.push("<p>xG/90: " + f2(num(r.xG_Casa)) + " \u2013 " + f2(num(r.xG_Osp)) +
      " \u00b7 xGA/90: " + f2(num(r.xGA_Casa)) + " \u2013 " + f2(num(r.xGA_Osp)) + "</p>");
    var gl = [["Over 1.5", r.P_O15], ["Over 2.5", r.P_O25], ["Over 3.5", r.P_O35], ["Gol", r.P_GG]]
      .filter(function (x) { return num(x[1]) != null; })
      .map(function (x) { return x[0] + " " + f0(num(x[1])) + "%"; });
    if (gl.length) det.push("<p>" + gl.join(" \u00b7 ") + "</p>");
    if (m1 != null) {
      det.push("<p>Mercato" + (mmarg != null ? " (margine " + f1(mmarg) + "%)" : "") + ": 1 " + f0(m1) +
        "% \u00b7 X " + f0(mx) + "% \u00b7 2 " + f0(m2) + "%" +
        (mgol != null ? ", gol attesi " + f2(mgol) + (mlin != null ? " dalla linea " + esc(mlin) : "") : "") + "</p>");
      if (ds != null) {
        det.push("<p>Sul " + esc(segno) + ": il modello d\u00e0 " + Math.abs(ds).toFixed(1) + " punti " +
          (ds >= 0 ? "pi\u00f9" : "meno") + " del mercato.</p>");
      }
      if (dg != null) {
        det.push("<p>Gol attesi: " + (dg > 0 ? "+" : "") + dg.toFixed(2) + " rispetto a quelli del mercato.</p>");
      }
    } else {
      det.push("<p>Nessun prezzo su questa partita: resta solo il modello.</p>");
    }
    // Le partite giocate si scrivono sempre: una media su sei giornate e
    // una su venti non valgono uguale.
    if (mpc != null && mpo != null) det.push("<p>Medie calcolate su " + f0(mpc) + " e " + f0(mpo) + " partite giocate.</p>");

    return '<div class="riga"><details><summary>' +
      '<span class="segno">' + esc(segno || "?") + "</span>" +
      '<div class="corpo">' +
      '<div class="alto"><span>' + esc(r.Ora || "") + "</span>" + (r.Lega ? '<span class="chip">' + esc(String(r.Lega).replace(/\s*\[\d+\]$/, "")) + "</span>" : "") +
        (r.Fonte_xG === "FotMob" ? '<span class="chip">xG FotMob</span>' : "") + "</div>" +
      '<div class="partita">' + partitaHtml(r.Casa, r.Ospite, "", campiRiga(r)) + "</div>" +
      '<div class="sel">\u03bb ' + f2(lc) + " \u2013 " + f2(lo) + coda + "</div>" +
      tripla("modello", p1, px, p2) +

  // ------------------------------------------------- aggancio al mercato
  //
  // VERSIONE PRUDENTE DELL'AGGANCIO DI KODI, NON UNA COPIA.
  //
  // Kodi riconosce la stessa partita fra FootballPredictions e AsianOdds
  // passando dagli stemmi: due squadre che prendono lo stesso stemma sono
  // la stessa squadra (_chiave_incontro / _riga_mercato in default.py).
  // Per trovare lo stemma usa loghi.json e, quando il nome esatto non c'e',
  // la somiglianza (difflib, soglia 0.88), le sigle sociali e la tabella
  // delle omonimie. Qui si tiene SOLO la ricerca esatta, in quattro grafie
  // (com'e', senza accenti, con la punteggiatura come spazi, entrambe), e
  // un nome che sta fra le omonimie non si aggancia affatto.
  //
  // Misurato sulle 278 Sure Bets dell'archivio contro il codice di Kodi
  // eseguito cosi' com'e': Kodi ne aggancia 147, questa versione 129, e
  // tutte e 129 sono la stessa partita che sceglie Kodi. Zero diverse,
  // zero in piu'. Le 18 che mancano ("Inter Milan" / "Inter", "Sint-
  // Truidense" / "St. Truiden") restano senza prezzo: meglio il silenzio
  // del prezzo di un'altra partita.
  //
  // normalizza() e senzaAccenti() devono restare identiche alle Python
  // (normalizza_squadra, _senza_accenti): sono le chiavi di loghi.json.

  var SUFFISSI = ["fc", "ac", "as", "ss", "us", "cf", "sc", "afc", "fk", "sk", "bk", "if"];
  var RE_SUFF = SUFFISSI.map(function (w) {
    return new RegExp("(?<![\\p{L}\\p{N}_])" + w + "(?![\\p{L}\\p{N}_])", "gu");
  });
  var RE_PUNT = /[-‐-―_.,'’\/]+/g;
  var LETTERE = { "ø": "o", "æ": "ae", "å": "a", "ð": "d", "þ": "th", "ß": "ss",
                  "đ": "d", "ł": "l", "ı": "i", "œ": "oe", "ħ": "h", "ż": "z", "ġ": "g" };
  var FEMMINILE = ["w", "wom", "women", "womens", "ladies", "femminile", "femenino", "femenil", "feminino",
                   "feminin", "feminina", "frauen", "damen", "dames", "kvinner", "naiset", "kobiet", "zeny"];
  var UNDER = ["u16", "u17", "u18", "u19", "u20", "u21", "u22", "u23"];
  var RISERVE = ["b", "c", "ii", "iii", "2", "u21", "u23", "u19", "reserve", "reserves", "riserve", "youth", "primavera"];
  var RE_ETA = /\b(?:u|under\s*|-)(1[6-9]|2[0-3])\b/;

  function normalizza(nome, punteggiatura) {
    var n = String(nome == null ? "" : nome).toLowerCase().trim();
    if (punteggiatura) n = n.replace(RE_PUNT, " ");
    n = n.replace(/\s+/g, " ");
    RE_SUFF.forEach(function (rx) { n = n.replace(rx, ""); });
    return n.replace(/\s+/g, " ").trim();
  }
  function senzaAccenti(t) {
    t = Array.from(String(t)).map(function (c) { return LETTERE[c] || c; }).join("");
    return t.normalize("NFKD").replace(/\p{M}/gu, "");
  }
  function parole(t) { return String(t || "").toLowerCase().split(/[^a-z0-9]+/); }
  function interseca(a, b) { return a.filter(function (x) { return b.indexOf(x) >= 0; }); }

  // Femminile, giovanile, riserve o prima squadra: due partite con gli
  // stessi stemmi ma variante diversa NON sono la stessa partita.
  function variante(casa, ospite, dove) {
    var nomi = parole(casa).concat(parole(ospite));
    if (interseca(nomi.concat(parole(dove)), FEMMINILE).length) return "f";
    var u = interseca(nomi, UNDER).sort();
    if (u.length) return u[0];
    var m = RE_ETA.exec(String(dove || "").toLowerCase()) ||
            RE_ETA.exec((String(casa || "") + " " + String(ospite || "")).toLowerCase());
    if (m) return "u" + m[1];
    if (interseca(nomi, RISERVE).length) return "r";
    return "";
  }

  function stemma(nome, loghi) {
    var mappa = loghi.mappa || {}, ambigue = loghi.ambigue || {};
    var prove = [normalizza(nome), normalizza(senzaAccenti(nome)),
                 normalizza(nome, true), normalizza(senzaAccenti(nome), true)];
    for (var i = 0; i < prove.length; i++) {
      var k = prove[i];
      if (!k) continue;
      if (Object.prototype.hasOwnProperty.call(ambigue, k)) return null;
      if (Object.prototype.hasOwnProperty.call(mappa, k)) return mappa[k];
    }
    return null;
  }

  // "Benfica to Win" su Santa Clara - Benfica e' un 2, non un 1.
  function esitoSure(r) {
    var t = String(r.Lista || r.Sure || "").trim(), b = t.toLowerCase();
    var code = [" to win", " win"], trovata = false;
    for (var i = 0; i < code.length; i++) {
      if (b.slice(-code[i].length) === code[i]) { t = t.slice(0, -code[i].length).trim(); trovata = true; break; }
    }
    if (!trovata) return null;
    var sq = normalizza(t);

  function rigaMercato(r, mercato, loghi) {

      .filter(function (x) { return num(x[1]) != null; }).map(function (x) { return x[0] + " " + f0(num(x[1])) + "%"; });
    if (gol.length) det.push("<p>" + gol.join(" \u00b7 ") + "</p>");
    if (String(r["Quota WP"] || "").trim()) det.push("<p>Quota WebPronostici: " + esc(r["Quota WP"]) + "</p>");
    if (String(r["xG Casa"] || "").trim() || String(r["xG Ospite"] || "").trim()) {
      det.push("<p>xG: " + esc(r["xG Casa"] || "-") + " \u2013 " + esc(r["xG Ospite"] || "-") + "</p>");
    }
    righeAO(r).forEach(function (x) { det.push(x); });
    return '<div class="riga"><details><summary>' +
      '<span class="segno">' + esc(pron || "?") + "</span>" +
      '<div class="corpo">' +
      '<div class="alto"><span>' + esc(r.Ora || "") + "</span></div>" +
      '<div class="partita">' + partitaHtml(r.Casa, r.Ospite, "", campiRiga(r)) + "</div>" +
      '<div class="sel">Statarea ' + esc(r["Pron Statarea"]) + " \u00b7 WebPronostici " + esc(r["Pron WebPron"]) + "</div>" +
      tripla("fonti", p1, px, p2) +
      "</div>" +
      '<div class="numero"><b>' + f0(pc) + "%</b><span>sul " + esc(pron) + "</span></div>" +
      "</summary>" +
      '<div class="dettaglio">' + det.join("") + "</div>" +
      "</details></div>";
  }

  // ------------------------------------------------------- sure bets

  var URL_LOGHI = "https://raw.githubusercontent.com/" + REPO + "/main/loghi.json";

  // GLI STEMMI. I PNG stanno sul ramo "stemmi" di pronostici-repo (li
  // pubblica il job "stemmi" del workflow dal pacchetto Kodi), il nome
  // della squadra porta al file con loghi.json e la stessa ricerca ESATTA
  // delle Sure Bets (stemma(), piu' sotto): un nome che non c'e' o che sta
  // fra le omonimie resta senza stemma, mai con quello di un'altra squadra.
  // Se il file non si carica, l'immagine sparisce e resta il nome.
  var URL_STEMMI = "https://raw.githubusercontent.com/" + REPO + "/stemmi/";
  var LOGHI = null;
  var loghiPronti = null;
  function caricaLoghi() {
    if (!loghiPronti) {
      loghiPronti = leggiUrl(URL_LOGHI, "loghi.json").catch(function () { return null; })
        .then(function (l) { LOGHI = l; return l; });
    }
    return loghiPronti;
  }
  // LE OMONIMIE ("Inter" e' sia l'Inter sia una squadra salvadoregna):
  // loghi.json dice, per ogni nome ambiguo, quale indizio nel campionato
  // porta a quale file; "" vale per tutti gli altri campionati. E' la
  // _scioglie_omonimia() dell'addon, con la stessa regola: il primo
  // indizio contenuto nel campionato vince; senza campionato, nessuno
  // stemma. SOLO per mostrare lo stemma: stemma() qui sopra, che serve ad
  // agganciare le partite, resta senza campionato come in prezzi_equi.py.
  function stemmaDove(nome, loghi, dove) {
    var ambigue = loghi.ambigue || {}, k = normalizza(nome);
    if (!k || !Object.prototype.hasOwnProperty.call(ambigue, k)) return stemma(nome, loghi);
    if (!dove) return null;
    var contesto = senzaAccenti(String(dove).toLowerCase()), voci = ambigue[k] || [];
    for (var i = 0; i < voci.length; i++) {
      if (contesto.indexOf(voci[i][0]) >= 0) return voci[i][1] || null;
    }
    return null;
  }
  // Il campionato della riga, come lo scrive la fonte (_campi_riga
  // dell'addon): ogni fonte lo chiama a modo suo.
  function campiRiga(r) {
    return ["Lega", "Paese", "Competizione", "Campionato"].map(function (c) { return r && r[c] ? String(r[c]) : ""; })
      .filter(Boolean).join(" ");
  }
  function logo(nome, grande, dove) {
    if (!LOGHI || !nome) return "";
    var f = stemmaDove(nome, LOGHI, dove);
    if (!f) return "";
    return '<img class="stemma' + (grande ? " grande" : "") + '" src="' + URL_STEMMI + encodeURIComponent(f) +
      '" alt="" loading="lazy" decoding="async" onerror="this.remove()">';
  }
  function partitaHtml(casa, ospite, testo, dove) {
    if (!casa || !ospite) return esc(testo || "");
    return '<span class="sq">' + logo(casa, false, dove) + esc(casa) + '</span> \u2013 <span class="sq">' + logo(ospite, false, dove) + esc(ospite) + "</span>";
  }

  // Il mercato del giorno e la mappa dei nomi si leggono qui, una volta per
  // data. Se AsianOdds non ha il file (oltre le 24 ore) le righe restano
  // senza prezzo; se manca la mappa, idem: nessun prezzo e' meglio di un
  // prezzo agganciato a caso.
  function arricchisciSure(righe, data) {
    var mercato = leggi("asianodds_" + data + ".json").catch(function () { return null; });
    var loghi = leggiUrl(URL_LOGHI, "loghi.json").catch(function () { return null; });
    return Promise.all([mercato, loghi]).then(function (x) {
      var ao = Array.isArray(x[0]) ? x[0] : null, lg = x[1] && x[1].mappa ? x[1] : null;
      return (Array.isArray(righe) ? righe : []).map(function (r) {
        var o = {};
        for (var k in r) o[k] = r[k];
        o.Data = o.Data || data;
        o._esito = esitoSure(r);
        o._mercato = ao ? (ao.length ? "si" : "vuoto") : "no";
        var a = ao && lg ? rigaMercato(r, ao, lg) : null;
        var p = a ? probMercato(o._esito, a) : null;
        if (p) {
          o._prob = p.prob;
          // I campi che usa la multipla, con il nome della partita come lo
          // scrive AsianOdds: e' quello dei Prezzi equi, cosi' la stessa
          // partita presa da due sezioni si riconosce come doppia.
          o.Prob = p.prob * 100;
          o.Equa = 1 / p.prob;
          o.Margine = p.margine;
          o.Partita = a.Casa + " - " + a.Ospite;
          o.Mercato = "1X2";
          o.Sel = o._esito;
          o.Lega = a.Lega;
        }
        return o;
      });
    });
  }

  function sbTiene(r, tipo) {
    if (tipo === "prezzo") return r._prob != null;
    return true;
  }

  function riepilogoSure(v) {
    var con = v.filter(function (r) { return r._prob != null; });
    var eq = mediana(con.map(function (r) { return num(r.Equa); }));
    return tessere([
      [String(v.length), "Sure Bets"],
      [String(con.length), "con il prezzo del mercato"],
      [eq == null ? "-" : eq.toFixed(2), "quota reale mediana"]
    ]);
  }

  function rigaSure(r, i) {
    var esito = r._esito, prob = r._prob, equa = num(r.Equa), marg = num(r.Margine);
    var fid = fiducia(marg);
    var lista = String(r.Lista || "").trim();
    var squadra = esito === "1" ? r.Casa : esito === "2" ? r.Ospite : null;
    var conPrezzo = prob != null;
    var k = conPrezzo ? chiave(r) : null;
    var scelta = conPrezzo && !!scelte[k];

    var det = [];
    if (r.Lega) det.push("<p>" + esc(r.Lega) + "</p>");
    if (lista) det.push("<p>Dalla lista: " + esc(lista) + "</p>");
    [["1X2", "1X2", "Q 1X2", "Book 1X2"], ["U/O 2.5", "OU", "Q OU", "Book OU"],
     ["Gol/NoGol", "BTTS", "Q BTTS", "Book BTTS"], ["Sure Bet", "Sure", "Q Sure", "Book Sure"]].forEach(function (m) {
      var pred = String(r[m[1]] || "").trim();
      if (!pred) return;
      var q = num(r[m[2]]), t = m[0] + ": " + esc(pred);
      if (q != null) t += " @ " + q.toFixed(2) + (r[m[3]] ? " (" + esc(r[m[3]]) + ")" : "");
      det.push("<p>" + t + "</p>");
    });
    if (conPrezzo) {
      det.push("<p>Quota reale del mercato: " + f2(equa) + " (" + f0(prob * 100) + "%)" +
        (marg != null ? ", margine " + f1(marg) + "%" : "") + ". Sopra quella quota prendi valore, sotto paghi margine.</p>");
    } else if (esito) {
      det.push("<p>" + (r._mercato === "si"
        ? "Nessun prezzo: AsianOdds non ha questa partita, oppure i nomi non combaciano abbastanza da esserne sicuri."
        : "Nessun prezzo: AsianOdds copre le prossime 24 ore, oltre non arriva.") + "</p>");
    }
    if (/^https:\/\/(www\.)?footballpredictions\.net\//.test(String(r.Link || ""))) {
      det.push('<p><a href="' + esc(r.Link) + '" target="_blank" rel="noopener noreferrer">Apri su FootballPredictions</a></p>');
    }

    var sel = squadra ? "Vince " + esc(squadra) : esc(lista || "Sure Bet");
    return '<div class="riga' + (scelta ? " scelta" : "") + '">' +
      (conPrezzo
        ? '<label class="spunta" title="Aggiungi alla multipla"><input type="checkbox" data-chiave="' + esc(k) +
          '" data-i="' + i + '"' + (scelta ? " checked" : "") + ' aria-label="Aggiungi alla multipla"></label>'
        : '<span class="spunta vuota" aria-hidden="true"></span>') +
      "<details><summary>" +
      '<span class="segno">' + esc(esito || "?") + "</span>" +
      '<div class="corpo">' +
      '<div class="alto"><span>' + esc(r.Ora || "") + "</span>" +
      (fid ? '<span class="pill ' + fid[0] + '">margine ' + f1(marg) + "%</span>" : "") + "</div>" +
      '<div class="partita">' + partitaHtml(r.Casa, r.Ospite, "", campiRiga(r)) + "</div>" +
      '<div class="sel">' + sel + "</div>" +
      (conPrezzo ? '<div class="pbar"><i style="width:' + Math.min(100, prob * 100) + '%"></i></div>' : "") +
      "</div>" +
      '<div class="numero">' + (conPrezzo
        ? "<b>" + f2(equa) + "</b><span>" + f0(prob * 100) + "%</span>"
        : '<b style="color:var(--tenue)">\u2013</b><span>senza prezzo</span>') + "</div>" +
      "</summary>" +
      '<div class="dettaglio">' + det.join("") + "</div>" +
      "</details></div>";
  }

  // ---------------------------------------------------------- le fonti

  // La t decide, non la differenza: sotto 2 e' rumore.
  function verdetto(m) {
    if (!m || m.poche) return ["rumore", "Troppe poche partite col prezzo di chiusura: è presto."];
    var t = num(m.t) || 0, n = m.partite || 0;
    var ts = (t > 0 ? "+" : "") + t.toFixed(1);
    if (Math.abs(t) < 2) return ["rumore", "Dentro il rumore su " + n + " partite (t " + ts + "): non si può ancora dire chi vince."];
    if (t > 0) return ["vince-mercato", "Il mercato vince, e lo scarto regge: " + n + " partite, t " + ts + "."];
    return ["batte", "Batte il mercato, e lo scarto regge: " + n + " partite, t " + ts + ". Da rifare fra un mese su partite nuove prima di crederci."];
  }
  function segnato(v) { var n = num(v); return n == null ? "?" : (n > 0 ? "+" : "") + n; }
  function righeMercato(m) {
    if (!m || m.poche) {
      return "<p class=\"piccolo\">Partite col prezzo di chiusura: " + ((m || {}).partite || 0) + ". Sotto le 50 non si misura.</p>";
    }
    var h = '<p class="sotto-titolo">Brier sulle stesse ' + esc(m.partite) + " partite, più basso è meglio</p>" +
      striscia([["Queste probabilità", m.brier, "q"], ["Mercato de-viggato", m.brier_mercato, "m"]]) +
      '<p class="piccolo">Differenza partita per partita ' + segnato(m.diff) + ", errore standard " + esc(m.es) +
      ", t " + segnato(m.t) + ".";
    if (m.ic && m.ic.length === 2) h += " Intervallo al 95%: da " + segnato(m.ic[0]) + " a " + segnato(m.ic[1]) + ".";
    return h + "</p>";
  }

  var FO_VISTE = [
    ["riepilogo", "Riepilogo",
     "I totali per fonte, misurati sulle partite gi\u00e0 finite."],
    ["partite", "Partita per partita",
     "Ogni partita finita, con il risultato e quello che avevano detto le fonti. " +
     "Stesse regole e stesse partite del riepilogo: qui si vede da dove vengono i numeri."]
  ];

  function testaFonti() {
    var v = FO_VISTE.filter(function (x) { return x[0] === FONTI.vista; })[0];
    return chipsHtml(FO_VISTE, FONTI.vista, "data-fvista") + '<p class="descr">' + esc(v[2]) + "</p>";
  }
  function collegaTestaFonti() {
    $cont.querySelectorAll("[data-fvista]").forEach(function (b) {
      b.addEventListener("click", function () {
        FONTI.vista = b.dataset.fvista; stato.cerca = ""; stato.limite = PASSO; disegna();
      });
    });
  }

  function disegnaFonti() {
    if (FONTI.vista === "partite") return disegnaPartite();
    $cont.innerHTML = messaggio("vuoto", "Carico&hellip;");
    Promise.all([
      leggi("classifica_fonti.json").catch(function () { return null; }),
      leggi("classifica_consensus.json").catch(function () { return null; })
    ]).then(function (res) {
      if (stato.sez !== "fonti") return;
      var d = res[0], c = res[1];
      if (!d && !c) {
        $cont.innerHTML = messaggio("errore", "Il consuntivo non è ancora stato pubblicato: arriva col primo giro notturno.");
        return;
      }
      var agg = (d && d.aggiornato) || (c && c.aggiornato) || "?";
      document.getElementById("aggiornato").textContent = "Consuntivo aggiornato il " + agg;

      var h = '<p class="descr">Misurato solo su partite già finite, con i valori congelati prima del calcio d\'inizio. ' +
        (d ? d.risultati + " partite con risultato. " : "") +
        "Finché una fonte non arriva a qualche centinaio di partite i numeri ballano: si guardano, non si usano per decidere.</p>";

      if (c && c.medio) h += schedaMedio(c.medio);
      if (c && c.accordo) h += schedaAccordo(c.accordo);

      if (d && d.fonti) {
        h += '<p class="descr" style="margin-top:24px">Le fonti in ordine di quante partite sono state misurate, non di quante ne prendono: ' +
          "la percentuale più alta la fa sempre chi ha il campione più piccolo. " +
          "Mercati diversi non si sommano volentieri: una doppia chance si prende molto più spesso di un 1X2 e paga molto meno. " +
          "Il numero che conta è il confronto col favorito del book: se la fonte non ci sta sopra, seguirla al prezzo del book non conviene, per quante ne prenda. " +
          "La tacca sulle barre segna il 60%.</p>";
        h += d.fonti.map(schedaFonte).join("");
      }
      $cont.innerHTML = testaFonti() + h;
      collegaTestaFonti();
    });
  }

  // ------------------------------------------- partita per partita
  //
  // I file risultati_<data>.json li scrive archivio_risultati.py con le
  // regole di misura_fonti.py: quali partite sono finite, come si legge un
  // pronostico, quando e' preso. Qui si mostra e basta.

  function etichettaPron(x) {
    var s = String(x.Sel || ""), m = x.Mercato;
    if (m === "OU") return (s === "OVER" ? "Over" : "Under") + (x.Linea != null ? " " + x.Linea : "");
    if (m === "BTTS") return s === "SI" ? "Gol" : "NoGol";
    if (m === "SEGNA") return s === "CASA" ? "Segna casa" : "Segna ospite";
    return s;
  }

  function pillPron(x) {
    var cls = x.Esito === "presa" ? "presa" : x.Esito === "sbagliata" ? "sbagliata" : "rimborso";
    var segno = x.Esito === "presa" ? "\u2713" : x.Esito === "sbagliata" ? "\u2717" : "\u21ba";
    var testo = x.Esito === "presa" ? "presa" : x.Esito === "sbagliata" ? "sbagliata" : "rimborso";
    return '<span class="esito-pill ' + cls + '" title="' + esc(x.Nome) + ": " + esc(etichettaPron(x)) + ", " + testo + '">' +
      "<b>" + segno + "</b> " + esc(x.Nome) + " \u00b7 " + esc(etichettaPron(x)) + "</span>";
  }

  function rigaPartitaFinita(p) {
    var prons = FONTI.fonte ? p.Pronostici.filter(function (x) { return x.Fonte === FONTI.fonte; }) : p.Pronostici;
    var m = p.Mercato;
    var det = [];
    if (p.Lega) det.push("<p>" + esc(p.Lega) + "</p>");
    det.push("<p>Risultato da " + esc(p.Fonte_Risultato) + ".</p>");
    if (m) {
      det.push("<p>Mercato alla chiusura (Shin): 1 " + f0(m.P1) + "% \u00b7 X " + f0(m.PX) + "% \u00b7 2 " + f0(m.P2) +
        "%. Favorito: " + esc(m.Favorito) + ", " + (m.Preso ? "uscito" : "non uscito") + ".</p>");
    } else {
      det.push("<p>Nessuna quota di chiusura archiviata per questa partita.</p>");
    }
    return '<div class="riga"><details><summary>' +
      '<span class="segno">' + esc(p.Esito) + "</span>" +
      '<div class="corpo">' +
      '<div class="alto"><span>' + esc(p.Ora || "") + "</span>" + (p.Lega ? '<span class="chip">' + esc(p.Lega) + "</span>" : "") + "</div>" +
      '<div class="partita">' + partitaHtml(p.Casa, p.Ospite, "", campiRiga(p)) + "</div>" +
      '<div class="pron-lista">' + prons.map(pillPron).join("") + "</div>" +
      (m ? tripla("mercato", m.P1, m.PX, m.P2) : "") +
      "</div>" +
      '<div class="numero"><b>' + esc(p.Gol_Casa) + "\u2013" + esc(p.Gol_Ospite) + "</b><span>finale</span></div>" +
      "</summary>" +
      '<div class="dettaglio">' + det.join("") + "</div>" +
      "</details></div>";
  }

  function disegnaPartite() {
    $cont.innerHTML = testaFonti() + messaggio("vuoto", "Carico&hellip;");
    collegaTestaFonti();
    leggi("risultati_index.json").then(function (ix) {
      if (stato.sez !== "fonti" || FONTI.vista !== "partite") return;
      var date = (ix.date || []).slice().sort().reverse();
      document.getElementById("aggiornato").textContent = "Risultati aggiornati il " + (ix.aggiornato || "?");
      if (!date.length) {
        $cont.innerHTML = testaFonti() + messaggio("vuoto", "Nessuna giornata con risultati.");
        collegaTestaFonti();
        return;
      }
      if (date.indexOf(FONTI.data) < 0) FONTI.data = date[0];
      var d = FONTI.data;
      scriviHash();
      var opz = [["", "Tutte le fonti"]].concat(Object.keys(NOMI_FONTI).map(function (k) { return [k, NOMI_FONTI[k]]; }));
      var testa = testaFonti() +
        chipsHtml(date.map(function (x) { return [x, etichettaData(x)]; }), d, "data-fdata") +
        '<div class="strumenti">' +
        '<input type="search" id="cerca" placeholder="Squadra o campionato" value="' + esc(stato.cerca) + '" autocomplete="off">' +
        '<select id="fonte-sel" aria-label="Fonte">' + opz.map(function (o) {
          return '<option value="' + o[0] + '"' + (o[0] === FONTI.fonte ? " selected" : "") + ">" + esc(o[1]) + "</option>";
        }).join("") + "</select></div>";
      $cont.innerHTML = testa + '<div id="righe">' + messaggio("vuoto", "Carico&hellip;") + "</div>";
      collegaTestaFonti();
      $cont.querySelectorAll("[data-fdata]").forEach(function (b) {
        b.addEventListener("click", function () { FONTI.data = b.dataset.fdata; stato.limite = PASSO; disegna(); });
      });
      var att = $cont.querySelector('[data-fdata][aria-pressed="true"]');
      if (att && att.scrollIntoView) att.scrollIntoView({ block: "nearest", inline: "center" });
      return leggi("risultati_" + d + ".json").then(function (partite) {
        if (stato.sez !== "fonti" || FONTI.vista !== "partite" || FONTI.data !== d) return;
        var t = null, c = document.getElementById("cerca");
        c.addEventListener("input", function () {
          clearTimeout(t);
          t = setTimeout(function () { stato.cerca = c.value.trim(); stato.limite = PASSO; righePartite(partite); }, 150);
        });
        document.getElementById("fonte-sel").addEventListener("change", function (e) {
          FONTI.fonte = e.target.value; stato.limite = PASSO; righePartite(partite);
        });
        righePartite(partite);
      });
    }).catch(function (e) {
      $cont.innerHTML = testaFonti() + messaggio("errore",
        "Non riesco a leggere i risultati (" + esc(e.message) + "). Arrivano col primo giro notturno dopo l'aggiornamento del workflow.");
      collegaTestaFonti();
    });
  }

  function righePartite(partite) {
    var $r = document.getElementById("righe");
    if (!$r) return;
    var tutte = Array.isArray(partite) ? partite : [];
    var q = stato.cerca.toLowerCase();
    var vis = tutte.filter(function (p) {
      if (FONTI.fonte && !p.Pronostici.some(function (x) { return x.Fonte === FONTI.fonte; })) return false;
      return !q || (p.Casa + " " + p.Ospite + " " + p.Lega).toLowerCase().indexOf(q) >= 0;
    });
    // I conti della giornata, su quello che si vede: con una fonte scelta
    // diventano i conti di quella fonte.
    var prese = 0, su = 0, conM = 0, fav = 0;
    vis.forEach(function (p) {
      p.Pronostici.forEach(function (x) {
        if (FONTI.fonte && x.Fonte !== FONTI.fonte) return;
        if (x.Esito === "rimborso") return;
        su++; if (x.Esito === "presa") prese++;
      });
      if (p.Mercato) { conM++; if (p.Mercato.Preso) fav++; }
    });
    var html = tessere([
      [String(vis.length), "partite finite"],
      [su ? Math.round(100 * prese / su) + "%" : "-", "pronostici presi, " + prese + " su " + su],
      [conM ? Math.round(100 * fav / conM) + "%" : "-", "favorito del book uscito, " + fav + " su " + conM]
    ]);
    if (!vis.length) {
      $r.innerHTML = html + messaggio("vuoto", tutte.length ? "Nessuna partita corrisponde." : "Nessuna partita finita in questa giornata.");
      return;
    }
    var mostrate = vis.slice(0, stato.limite);
    html += '<p class="conta">' + vis.length + " partite \u00b7 \u2713 presa, \u2717 sbagliata, \u21ba rimborso</p>" +
      '<div class="lista">' + mostrate.map(rigaPartitaFinita).join("") + "</div>";
    if (vis.length > mostrate.length) {

  function mercatoSu(p, m, x) {
    var s = String(x.Sel || "");
    if ((x.Mercato === "1X2" || x.Mercato === "DC") && m) {
      var t = 0;
      for (var i = 0; i < s.length; i++) { if (m[s[i]] == null) return null; t += m[s[i]]; }
      return t;
    }
    var righe = p.Prezzi && p.Prezzi.Righe || [];
    var cerca = null;
    if (x.Mercato === "OU" && x.Linea != null) cerca = ["OU " + x.Linea, s === "OVER" ? "Over" : "Under"];
    if (x.Mercato === "BTTS") cerca = ["BTTS", s === "SI" ? "Gol" : "NoGol"];
    if (!cerca) return null;
    var r = righe.filter(function (y) { return y.Mercato === cerca[0] && y.Sel === cerca[1]; })[0];
    return r ? num(r.Prob) : null;
  }

        pr.map(function (x) {

          var lab = x.Mercato ? etichettaPron(x) : (x.Testo || "?");
          return "<tr><td>" + esc(nomeFonte(x.Fonte)) + "</td><td><b>" + esc(lab) + "</b></td><td>" +
            (num(x.Prob) != null ? f0(num(x.Prob)) : "–") + "</td><td>" +
            (num(x.Quota) != null ? f2(num(x.Quota)) : "–") + "</td><td>" +
            (mp != null ? f0(mp) : "–") + "</td></tr>";
        }).join("") + "</tbody></table>";
      h += '<p class="piccolo">“% fonte” è la probabilità che dà la fonte, quando la scrive; ' +
        "“% book” quella del mercato senza margine sulla stessa giocata, quando c'è. " +
        "Quanto vale ogni fonte lo dice “Statistiche fonti”.</p>";
    } else if (!cons.length && !ac) {
      h += '<p class="piccolo">Nessuna fonte si è espressa su questa partita.</p>';
    }
    return h + "</div>";
  }

  function bloccoSure(p) {
    if (!p.Sure || !p.Sure.length) return "";
    var t = p.Sure.map(function (r) { return esc(r.Lista || r.Sure || "Sure Bet"); }).join(" · ");
    return '<div class="scheda"><h3>Sure Bet</h3><p>FootballPredictions la mette fra le Sure Bets: <b>' + t + "</b>.</p>" +
      (p.SureLink ? '<p class="piccolo"><a href="' + esc(p.SureLink) + '" target="_blank" rel="noopener">La pagina della fonte ↗</a></p>' : "") +
      "</div>";
  }

  function bloccoAltro(p) {
    var b = p.Betimate || {}, f = p.FM || {}, a = p.Mercato || {}, ac = p.Accordo || {};
    var r = [];
    if (b.Pron_Esatto) r.push("Risultato esatto secondo Betimate: <b>" + esc(b.Pron_Esatto) + "</b>" +
      (num(b.Media_Gol) != null ? " (media gol " + f2(num(b.Media_Gol)) + ")" : ""));
    if (b.Meteo) r.push("Meteo: " + esc(b.Meteo));
    if (f.Arbitro) r.push("Arbitro: " + esc(f.Arbitro) + (num(f.Arb_Gialli) != null ? " · " + f1(num(f.Arb_Gialli)) + " gialli" : "") +
      (num(f.Arb_Falli) != null ? " e " + f0(num(f.Arb_Falli)) + " falli a partita" : ""));
    var ec = num(a["Elo Casa"]) != null ? num(a["Elo Casa"]) : num(ac["AO Elo Casa"]);
    var eo = num(a["Elo Osp"]) != null ? num(a["Elo Osp"]) : num(ac["AO Elo Osp"]);
    if (ec != null && eo != null) r.push("Elo: " + f0(ec) + " – " + f0(eo) + " (differenza " + (ec - eo > 0 ? "+" : "") + f0(ec - eo) + ")");
    if (!r.length) return "";
    return '<div class="scheda"><h3>Altro</h3>' + r.map(function (x) { return "<p>" + x + "</p>"; }).join("") + "</div>";
  }

  function piedeScheda(p) {
    var visti = {}, nomi = [];
    (p.Fonti || []).forEach(function (k) { var n = nomeFonte(k); if (!visti[n]) { visti[n] = 1; nomi.push(n); } });
    return '<p class="piccolo piede-scheda">In questa scheda: ' + esc(nomi.join(", ")) + ". " +
      "Ogni fonte scrive le squadre a modo suo: le righe sono state unite nel giro notturno " +
      "con regole precise (stemma, nomi parola per parola, ora). Se qui compare una partita che non c'entra, è un'unione sbagliata: segnalala.</p>";

  function disegnaScheda() {
    var d = SCHEDA.data, al = SCHEDA.chiave;
    window.scrollTo({ top: 0, behavior: "instant" });
    $cont.innerHTML = messaggio("vuoto", "Carico&hellip;");

          ". Le schede si rifanno a ogni giro: torna alla lista e riaprila da lì.</p></div>";
      } else {
        var m = mercatoScheda(p);
        $cont.innerHTML = testaScheda(p, d) + bloccoMercato(p, m) + bloccoPrezzi(p, d) + bloccoPoisson(p) +
          bloccoFonti(p, m) + bloccoSure(p) + bloccoAltro(p) + piedeScheda(p);
        $cont.querySelectorAll("input[data-sp]").forEach(function (cb) {
          cb.addEventListener("change", function () {
            var r = righeSchedaPrezzi[Number(cb.dataset.sp)];
            var k = chiave(r);
            if (cb.checked) scelte[k] = r; else delete scelte[k];
            cb.closest(".riga-prezzo").classList.toggle("scelta", cb.checked);

    });

  // ------------------------------------------------------------ xG squadre
  //
  // LE TABELLE xG PER CAMPIONATO, le stesse che usa il Poisson:
  //   - fotmobxg_<data>.json (fotmob_xg_ci.py): molti campionati, ma solo
  //     quelli con partite nei tre giorni dopo la lettura. Per non perdere
  //     un campionato fermo, si leggono le ultime giornate pubblicate e
  //     per ciascun campionato vale la lettura piu' recente (la data si
  //     vede sotto la tabella);
  //   - xg_<data>.json (understat_xg.py): i primi cinque campionati.
  // Sui cinque campionati che hanno tutte e due si sceglie la fonte: i
  // numeri NON si mescolano, come nel Poisson. Understat esce di solito un
  // po' piu' alto di FotMob: sono due modelli diversi di gol attesi.
  // Il sito non ricalcola niente: xG e xGA a partita sono quelli dei file.

  var XG = { lega: "", fonte: "", ordine: "diff", cerca: "", dati: null };
  var XG_GIORNI = 7;
  var US_IN_FM = { "Serie A": "Italia - Serie A", "EPL": "Inghilterra - Premier League",
    "La Liga": "Spagna - LaLiga", "Bundesliga": "Germania - Bundesliga", "Ligue 1": "Francia - Ligue 1" };
  var XG_ORDINI = [["diff", "Per differenza"], ["xg", "Per xG fatti"], ["xga", "Per xG subiti"],
    ["xpts", "Per punti attesi"], ["pts", "Per punti veri"], ["fortuna", "Punti sopra le attese"], ["nome", "Per nome"]];

  function senzaId(l) { return String(l || "").replace(/\s*\[\d+\]$/, ""); }

  function caricaXG() {
    if (XG.dati) return Promise.resolve(XG.dati);
    var nessuno = function () { return null; };
    return Promise.all([leggi("fotmobxg_index.json").catch(nessuno), leggi("xg_index.json").catch(nessuno)])
      .then(function (ix) {
        var fd = ((ix[0] && ix[0].date) || []).slice().sort().reverse().slice(0, XG_GIORNI);
        var ud = ((ix[1] && ix[1].date) || []).slice().sort().reverse().slice(0, 1);
        return Promise.all([
          Promise.all(fd.map(function (d) {
            return leggi("fotmobxg_" + d + ".json").then(function (j) { return [d, j]; }).catch(nessuno);
          })),
          Promise.all(ud.map(function (d) {
            return leggi("xg_" + d + ".json").then(function (j) { return [d, j]; }).catch(nessuno);
          }))
        ]);
      }).then(function (r) {
        var leghe = {};
        function lega(nome) {
          return leghe[nome] || (leghe[nome] = { nome: nome, fotmob: null, understat: null });
        }
        // FotMob: dalla lettura piu' recente alla piu' vecchia; un
        // campionato si prende una volta sola.
        r[0].forEach(function (x) {
          if (!x || !x[1] || !x[1].squadre) return;
          var d = x[0], per = {};
          Object.keys(x[1].squadre).forEach(function (k) {
            var v = x[1].squadre[k], n = senzaId(v.lega);
            (per[n] = per[n] || []).push(v);
          });
          Object.keys(per).forEach(function (n) {
            var L = lega(n);
            if (!L.fotmob) L.fotmob = { data: d, squadre: per[n] };
          });
        });
        r[1].forEach(function (x) {
          if (!x || !x[1] || !x[1].squadre) return;
          var d = x[0], per = {};
          Object.keys(x[1].squadre).forEach(function (k) {
            var v = x[1].squadre[k], n = US_IN_FM[v.lega] || v.lega;
            (per[n] = per[n] || []).push(v);
          });
          Object.keys(per).forEach(function (n) { lega(n).understat = { data: d, squadre: per[n] }; });
        });
        XG.dati = leghe;
        return leghe;
      });
  }

  function fonteXG(L) {
    if (XG.fonte === "understat" && L.understat) return "understat";
    if (XG.fonte === "fotmob" && L.fotmob) return "fotmob";
    return L.fotmob ? "fotmob" : "understat";
  }

  function ordinaXG(sq) {
    var o = XG.ordine;
    return sq.slice().sort(function (a, b) {
      if (o === "nome") return String(a.nome).localeCompare(String(b.nome));
      if (o === "xg") return b.xg_90 - a.xg_90;
      if (o === "xga") return a.xga_90 - b.xga_90;
      if (o === "xpts") {
        // A partita, perche' le squadre possono avere giocato un numero
        // diverso di partite; senza xPTS in fondo.
        var pa = a.xpts != null ? a.xpts / (a.mp || 1) : -1, pb = b.xpts != null ? b.xpts / (b.mp || 1) : -1;
        return pb - pa;
      }
      if (o === "pts" || o === "fortuna") {
        // Anche qui a partita; senza classifica vera in fondo.
        var va = a.pts == null ? -99 : (o === "pts" ? a.pts : a.pts - (a.xpts != null ? a.xpts : a.pts)) / (a.mp || 1);
        var vb = b.pts == null ? -99 : (o === "pts" ? b.pts : b.pts - (b.xpts != null ? b.xpts : b.pts)) / (b.mp || 1);
        return vb - va;
      }
      return (b.xg_90 - b.xga_90) - (a.xg_90 - a.xga_90);
    });
  }

  function tabellaXG(sq, conLega) {
    // La colonna dei punti attesi solo se c'e' almeno un numero: Understat
    // non li da', e i file FotMob piu' vecchi nemmeno.
    var pt = sq.some(function (v) { return v.xpts != null; });
    // I punti veri (dalla classifica normale di FotMob): verdi se la
    // squadra ne ha piu' degli attesi, rossi se ne ha meno.
    var pv = sq.some(function (v) { return v.pts != null; });
    return '<table class="mercati xgt' + (pt || pv ? " conpt" : "") + (pv ? " conpv" : "") +
      '"><thead><tr><th>#</th><th>Squadra</th><th title="Partite giocate">PG</th>' +
      '<th title="Gol attesi fatti a partita">xG</th><th title="Gol attesi subiti a partita">xGA</th>' +
      '<th title="xG meno xGA">Diff</th>' + (pt ? '<th title="Punti attesi nella stagione">xPTS</th>' : "") +
      (pv ? '<th title="Punti veri in classifica">Pt</th>' : "") +
      "</tr></thead><tbody>" +
      sq.map(function (v, i) {
        var d = num(v.xg_90) - num(v.xga_90);
        return "<tr><td>" + (i + 1) + '</td><td class="sq"><div>' + logo(v.nome, false, v.lega) + "<span>" + esc(v.nome) +
          (conLega ? '<small>' + esc(senzaId(v.lega)) + " · " + esc(v.fonte) + "</small>" : "") + "</span></div></td>" +
          "<td>" + esc(v.mp) + "</td><td>" + f2(num(v.xg_90)) + "</td><td>" + f2(num(v.xga_90)) + "</td>" +
          '<td class="' + (d > 0.005 ? "piu" : d < -0.005 ? "meno" : "") + '">' + (d > 0 ? "+" : "") + d.toFixed(2) + "</td>" +
          (pt ? '<td class="pt">' + (v.xpts != null ? esc(String(Math.round(num(v.xpts) * 10) / 10)) : "\u2013") + "</td>" : "") +
          (pv ? '<td class="pv ' + (v.pts == null || v.xpts == null ? "" : v.pts > v.xpts ? "piu" : v.pts < v.xpts ? "meno" : "") + '"' +
            (v.pts != null ? ' title="' + esc(v.v + " vinte, " + v.n + " pari, " + v.s + " perse \u00b7 gol " + v.gf + "-" + v.gs) + '"' : "") + ">" +
            (v.pts != null ? esc(v.pts) : "\u2013") + "</td>" : "") + "</tr>";
      }).join("") + "</tbody></table>";
  }

  function disegnaXG() {
    ultime = null;
    $cont.innerHTML = messaggio("vuoto", "Carico&hellip;");
    Promise.all([caricaXG(), caricaLoghi()]).then(function (a) {
      if (stato.sez !== "xg") return;
      var leghe = a[0], nomi = Object.keys(leghe).sort(function (x, y) { return x.localeCompare(y); });
      if (!nomi.length) {
        $cont.innerHTML = chipsHtml(GRUPPO_POISSON, "xg", "data-gruppo") +
          messaggio("vuoto", "Le tabelle xG non sono ancora state pubblicate: arrivano col giro notturno.");
        collegaXG();
        return;
      }
      if (!leghe[XG.lega]) XG.lega = leghe["Italia - Serie A"] ? "Italia - Serie A" : nomi[0];
      var L = leghe[XG.lega], fonte = fonteXG(L), T = L[fonte];
      scriviHash();
      var piu = [];
      nomi.forEach(function (n) { if (leghe[n].fotmob) piu.push(leghe[n].fotmob.data); });
      document.getElementById("aggiornato").textContent = "xG letti il " + (piu.sort().pop() || "?");

      var h = chipsHtml(GRUPPO_POISSON, "xg", "data-gruppo") +
        '<p class="descr">Gol attesi a partita: quanto valevano le occasioni create (xG) e quelle concesse (xGA). ' +
        "Con poche partite giocate (PG) sono inaffidabili.</p>" +
        '<div class="strumenti xgs">' +
        '<select id="xg-lega" aria-label="Campionato">' + nomi.map(function (n) {
          return '<option value="' + esc(n) + '"' + (n === XG.lega ? " selected" : "") + ">" + esc(n) + "</option>";
        }).join("") + "</select>" +
        '<select id="xg-ordine" aria-label="Ordine">' + XG_ORDINI.map(function (o) {
          return '<option value="' + o[0] + '"' + (o[0] === XG.ordine ? " selected" : "") + ">" + esc(o[1]) + "</option>";
        }).join("") + "</select>" +
        '<input type="search" id="xg-cerca" placeholder="Cerca una squadra in tutti i campionati" value="' +
        esc(XG.cerca) + '" autocomplete="off"></div>' +
        '<div id="xg-corpo"></div>';
      $cont.innerHTML = h;
      collegaXG();
      corpoXG();
    }).catch(function (e) {
      $cont.innerHTML = messaggio("errore", "Non riesco a leggere le tabelle xG (" + esc(e.message) + ").");
    });
  }

  function corpoXG() {
    var $c = document.getElementById("xg-corpo");
    if (!$c || !XG.dati) return;
    var leghe = XG.dati, q = XG.cerca.toLowerCase();
    if (q) {
      // La ricerca guarda tutti i campionati e tutte e due le fonti.
      var trovate = [];
      Object.keys(leghe).forEach(function (n) {
        ["fotmob", "understat"].forEach(function (f) {
          var T = leghe[n][f];
          if (!T) return;
          T.squadre.forEach(function (v) {
            if (String(v.nome).toLowerCase().indexOf(q) >= 0)
              trovate.push(Object.assign({}, v, { lega: n, fonte: f === "fotmob" ? "FotMob" : "Understat" }));
          });
        });
      });
      $c.innerHTML = trovate.length ? tabellaXG(ordinaXG(trovate).slice(0, 60), true)
        : messaggio("vuoto", "Nessuna squadra con questo nome nelle tabelle xG.");
      return;
    }
    var L = leghe[XG.lega], fonte = fonteXG(L), T = L[fonte];
    var scelta = L.fotmob && L.understat ? chipsHtml([["fotmob", "FotMob"], ["understat", "Understat"]], fonte, "data-xgfonte") : "";
    var sq = T.squadre.map(function (v) { return Object.assign({}, v, { lega: XG.lega }); });
    var pg = sq.map(function (v) { return num(v.mp) || 0; });
    $c.innerHTML = scelta + tabellaXG(ordinaXG(sq), false) +
      '<p class="piede-scheda">Fonte ' + (fonte === "fotmob" ? "FotMob" : "Understat") + ", letta " +
      esc(etichettaData(T.data).toLowerCase() === "oggi" ? "oggi" : "il " + etichettaData(T.data)) +
      " · " + sq.length + " squadre · partite giocate da " + Math.min.apply(null, pg) + " a " + Math.max.apply(null, pg) +
      (L.fotmob && L.understat ? ". Le due fonti usano modelli diversi: Understat di solito un po' più alto." : ".") +
      (sq.some(function (v) { return v.xpts != null; }) ? " xPTS: i punti che la squadra avrebbe in classifica secondo gli xG di ogni partita, sulla stagione." : "") +
      (sq.some(function (v) { return v.pts != null; }) ? " Pt: i punti veri in classifica, in verde se sono pi\u00f9 degli xPTS, in rosso se sono meno." : "") +
      "</p>";
    $c.querySelectorAll("[data-xgfonte]").forEach(function (b) {
      b.addEventListener("click", function () { XG.fonte = b.dataset.xgfonte; scriviHash(); corpoXG(); });
    });
  }

  function collegaXG() {
    $cont.querySelectorAll("[data-gruppo]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (b.dataset.gruppo === "xg") return;
        stato.sez = b.dataset.gruppo; stato.cerca = ""; stato.limite = PASSO; disegna();
      });
    });
    var $l = document.getElementById("xg-lega");
    if (!$l) return;
    $l.addEventListener("change", function () { XG.lega = $l.value; XG.fonte = ""; scriviHash(); corpoXG(); });
    document.getElementById("xg-ordine").addEventListener("change", function (e) { XG.ordine = e.target.value; corpoXG(); });
    var $q = document.getElementById("xg-cerca"), t = null;
    $q.addEventListener("input", function () {
      clearTimeout(t);
      t = setTimeout(function () { XG.cerca = $q.value.trim(); corpoXG(); }, 150);
    });
  }

  // ------------------------------------------------------------- avvio

  document.querySelectorAll("nav.sezioni button[data-sez]").forEach(function (b) {
    b.addEventListener("click", function () {
      if (stato.sez === b.dataset.sez) return;
      stato.sez = b.dataset.sez;

      stato.limite = PASSO;
      window.scrollTo(0, 0);

  window.addEventListener("hashchange", function () { leggiHash(); disegna(); });

  // LA HOME e' quello che si vede aprendo il sito: Prezzi equi, vista
  // Schedina, la data di oggi, nessuna ricerca, pagina in cima. Le
  // selezioni della multipla restano: tornare a casa non deve buttare via

  document.getElementById("casa").addEventListener("click", vaiHome);
  document.getElementById("titolo").addEventListener("click", vaiHome);

  // IL TEMA. Si ricorda la scelta su questo telefono (localStorage): e'
  // una comodita' di chi guarda, non un dato del sistema.
  function applicaTema(t) {
    document.documentElement.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", t === "light" ? "#f3f4ef" : "#080b12");
    try { localStorage.setItem("caltiki-tema", t); } catch (e) {}
  }
  document.getElementById("tema").addEventListener("click", function () {
    applicaTema(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light");
  });
  (function () {
    var m = document.querySelector('meta[name="theme-color"]');
    if (m && document.documentElement.getAttribute("data-theme") === "light") m.setAttribute("content", "#f3f4ef");
  })();

  // L'icona e' scritta una volta sola nella pagina: la favicon la riusa.
  try { document.getElementById("favicon").href = document.querySelector(".marchio img").src; } catch (e) {}

  // La rotella del mouse sopra una fila di tasti che non ci sta la fa
  // scorrere di lato invece di muovere la pagina. Se la fila ci sta tutta,
  // la rotella fa il suo lavoro normale.
  $cont.addEventListener("wheel", function (e) {
    var c = e.target.closest && e.target.closest(".chips");
    if (!c || c.scrollWidth <= c.clientWidth + 1) return;
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    var prima = c.scrollLeft;
    c.scrollLeft += e.deltaY;
    if (c.scrollLeft !== prima) e.preventDefault();
  }, { passive: false });

  leggiHash();
  disegna();
  leggi("footystatswdw_index.json").then(function (ix) {
    if (!ix || !Array.isArray(ix.date) || !ix.date.length) return;
    WDW_PRONTO = true;
    // La pagina e' gia' disegnata: si aggiunge il tasto dove serve.
    if (stato.sez === "prezzi" || stato.sez === "mercato") {
      var m = $cont.querySelector('[data-gruppo="mercato"]');
      if (m && !$cont.querySelector('[data-gruppo="wdw"]')) {
        var sez = stato.sez;
        var b = document.createElement("button");
        b.type = "button"; b.setAttribute("data-gruppo", "wdw"); b.setAttribute("aria-pressed", "false");
        b.textContent = "FootyStats";
        b.addEventListener("click", function () {
          if (!stato.data.wdw) stato.data.wdw = stato.data[sez];
          stato.sez = "wdw"; stato.cerca = ""; stato.limite = PASSO; disegna();
        });
        m.parentNode.appendChild(b);
      }
    }
  }, function () { /* nessun dato: il tasto resta nascosto */ });
})();
</script>
</body>
</html>

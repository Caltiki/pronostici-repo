    return Promise.all([leggi("fotmobxg_index.json").catch(nessuno), leggi("xg_index.json").catch(nessuno)])
      .then(function (ix) {
        var fd = ((ix[0] && ix[0].date) || []).slice().sort().reverse().slice(0, XG_GIORNI);
        var ud = ((ix[1] && ix[1].date) || []).slice().sort().reverse().slice(0, 1);
        return Promise.all([
          Promise.all(fd.map(function (d) {
            return leggi("fotmobxg_" + d + ".json").then(function (j) { return [d, j]; }).catch(nessuno);
          })),
          Promise.all(ud.map(function (d) {
            return leggi("xg_" + d + ".json").then(function (j) { return [d, j]; }).catch(nessuno);
          }))
        ]);
      }).then(function (r) {
        var leghe = {};
        function lega(nome) {

        }

        // campionato si prende una volta sola.

            var v = x[1].squadre[k], n = senzaId(v.lega);
            (per[n] = per[n] || []).push(v);
          });
          Object.keys(per).forEach(function (n) {
            var L = lega(n);
            if (!L.fotmob) L.fotmob = { data: d, squadre: per[n] };
          });
        });
        r[1].forEach(function (x) {
          if (!x || !x[1] || !x[1].squadre) return;
          var d = x[0], per = {};
          Object.keys(x[1].squadre).forEach(function (k) {
            var v = x[1].squadre[k], n = US_IN_FM[v.lega] || v.lega;
            (per[n] = per[n] || []).push(v);
          });
          Object.keys(per).forEach(function (n) { lega(n).understat = { data: d, squadre: per[n] }; });
        });
        XG.dati = leghe;
        return leghe;
      });
  }

  function fonteXG(L) {
    if (XG.fonte === "understat" && L.understat) return "understat";
    if (XG.fonte === "fotmob" && L.fotmob) return "fotmob";
    return L.fotmob ? "fotmob" : "understat";
  }

  function ordinaXG(sq) {
    var o = XG.ordine;
    return sq.slice().sort(function (a, b) {
      if (o === "nome") return String(a.nome).localeCompare(String(b.nome));
      if (o === "xg") return b.xg_90 - a.xg_90;
      if (o === "xga") return a.xga_90 - b.xga_90;
      if (o === "xpts") {
        // A partita, perche' le squadre possono avere giocato un numero
        // diverso di partite; senza xPTS in fondo.
        var pa = a.xpts != null ? a.xpts / (a.mp || 1) : -1, pb = b.xpts != null ? b.xpts / (b.mp || 1) : -1;

      return (b.xg_90 - b.xga_90) - (a.xg_90 - a.xga_90);

  // ------------------------------------------------------------ CAMPIONATI
  // (167) LA SEZIONE CAMPIONATI: un campionato alla volta, con le schede.

  var CAMP_SCHEDE = [["classifica", "Classifica"], ["stat", "Statistiche"], ["gol", "Gol e Over"], ["minuti", "Quando segna"],

  function campIndice() {

      document.getElementById("camp-lega").addEventListener("change", function (e) { CAMP.lega = e.target.value; CAMP.ordine = null; CAMP.squadra = null; scriviHash(); corpoCampionato(); });

  // (168) La fila delle schede non ci sta tutta (anche sul PC): come la barra
  // delle sezioni, ai bordi una sfumatura e una freccia dove c'e' altro, e
  // la rotella del mouse la fa scorrere di lato.
  function frecceChips(g) {
    if (!g) return;
    var r = g.querySelector(".chips");
    if (!r) return;
    var aggiorna = function () {
      var max = r.scrollWidth - r.clientWidth;
      g.classList.toggle("ha-prima", r.scrollLeft > 4);
      g.classList.toggle("ha-dopo", max > 4 && r.scrollLeft < max - 4);
    };
    r.addEventListener("scroll", aggiorna, { passive: true });
    window.addEventListener("resize", aggiorna);
    r.addEventListener("wheel", function (e) {
      if (r.scrollWidth <= r.clientWidth + 4 || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      r.scrollLeft += e.deltaY;
      e.preventDefault();
    }, { passive: false });
    g.querySelectorAll(".freccia-chips").forEach(function (f) {
      f.addEventListener("click", function () {
        r.scrollBy({ left: (f.classList.contains("dopo") ? 1 : -1) * Math.max(120, r.clientWidth * 0.6), behavior: "smooth" });
      });
    });
    aggiorna();
    setTimeout(aggiorna, 400);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(aggiorna);
  }
  function corpoCampionato() {
    var $c = document.getElementById("camp-corpo");

    campDati(L).then(function (D) {

        if (t) t.addEventListener("click", function () { CAMP.squadra = null; scriviHash(); corpoCampionato(); window.scrollTo(0, 0); });
        assentiSquadra(D, CAMP.squadra);
        return;
      }
      var f = CAMP_DISEGNA[CAMP.scheda] || CAMP_DISEGNA.classifica;
      var h = f(D);
      $c.innerHTML = h instanceof Promise ? messaggio("vuoto", "Carico&hellip;") : h;
      if (h instanceof Promise) h.then(function (x) { if (CAMP.lega === L) { $c.innerHTML = x; collegaCamp($c); } });
      else collegaCamp($c);
    }).catch(function () { $c.innerHTML = messaggio("errore", "Questo campionato non si legge adesso. Riprova fra poco."); });

  function collegaCamp($c) {
    $c.querySelectorAll("[data-cvista]").forEach(function (b) { b.addEventListener("click", function () { CAMP.vista = b.dataset.cvista; corpoCampionato(); }); });
    $c.querySelectorAll("[data-cgioc]").forEach(function (b) { b.addEventListener("click", function () { CAMP.gioc = b.dataset.cgioc; corpoCampionato(); }); });
    $c.querySelectorAll("[data-cmin]").forEach(function (b) { b.addEventListener("click", function () { CAMP.min = b.dataset.cmin; corpoCampionato(); }); });
    $c.querySelectorAll("th[data-ord]").forEach(function (th) {

        corpoCampionato();

  function nomeSq(D, id) { var s = D.squadre && D.squadre[String(id)]; return s ? s.nome : "?"; }
  function cellaSq(D, id) {
    return '<td class="sq"><div>' + logoId(nomeSq(D, id), id, false, D.nome) + "<span>" + esc(nomeSq(D, id)) + "</span></div></td>";
  }
  function badgeForma(s) {
    return String(s || "").split("").map(function (x) { return '<span class="fm fm-' + x.toLowerCase() + '">' + esc(x) + "</span>"; }).join("");
  }
  // una tabella ordinabile: colonne [titolo, chiave, verso di partenza (1 = dal piu' basso), formato]
  function tabCamp(D, righe, colonne, ordDef) {
    var k = CAMP.ordine || ordDef[0], v = CAMP.ordine ? CAMP.verso : ordDef[1];
    righe = righe.slice().sort(function (a, b) {
      var x = a[k], y = b[k];
      if (x == null && y == null) return 0;
      if (x == null) return 1;
      if (y == null) return -1;
      return v * (x - y);
    });
    var fmt = function (x, f) {
      if (x == null) return "–";
      if (f === "%") return Math.round(x) + "%";
      if (f === "+") return (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(1);
      if (typeof f === "number") return Number(x).toFixed(f);
      return esc(x);
    };
    return '<div class="tab-scorri"><table class="mercati xgt camp"><thead><tr><th>#</th><th>Squadra</th>' + colonne.map(function (c) {
      return '<th data-ord="' + c[1] + '" data-verso="' + (c[2] || -1) + '"' + (c[1] === k ? ' class="ord"' : "") + (c[4] ? ' title="' + esc(c[4]) + '"' : "") + ">" + esc(c[0]) + "</th>";
    }).join("") + "</tr></thead><tbody>" + righe.map(function (r, i) {
      return "<tr><td>" + (i + 1) + "</td>" + cellaSq(D, r.sq) + colonne.map(function (c) {
        var x = r[c[1]], cl = "";
        if (c[3] === "+" && x != null) cl = x > 0.05 ? ' class="piu"' : x < -0.05 ? ' class="meno"' : "";
        return "<td" + cl + ">" + fmt(x, c[3]) + "</td>";
      }).join("") + "</tr>";
    }).join("") + "</tbody></table></div>";
  }
  function vistaChips() { return chipsHtml(CAMP_VISTE, CAMP.vista, "data-cvista"); }
  function notaPiccola(t) { return '<p class="piccolo">' + t + "</p>"; }

  var CAMP_DISEGNA = {
    classifica: function (D) {
      var c = D.classifica, r = c && c.righe ? c.righe[CAMP.vista] : null;
      if (!r) return messaggio("vuoto", "Nessuna classifica.");
      return vistaChips() + '<div class="tab-scorri"><table class="mercati xgt camp"><thead><tr><th>#</th><th>Squadra</th><th>PG</th><th>V</th><th>N</th><th>P</th><th>Gol</th><th>DR</th><th>Pt</th><th>Ultime</th></tr></thead><tbody>' +
        r.map(function (x, i) {
          var dr = x[5] - x[6];
          return "<tr><td>" + (i + 1) + "</td>" + cellaSq(D, x[0]) + "<td>" + x[1] + "</td><td>" + x[2] + "</td><td>" + x[3] + "</td><td>" + x[4] +
            "</td><td>" + x[5] + ":" + x[6] + '</td><td class="' + (dr > 0 ? "piu" : dr < 0 ? "meno" : "") + '">' + (dr > 0 ? "+" : "") + dr +
            '</td><td class="pt">' + x[7] + '</td><td class="ult">' + badgeForma(x[8]) + "</td></tr>";
        }).join("") + "</tbody></table></div>" +
        notaPiccola("Calcolata dai risultati dopo 90 minuti" + (D.ultima ? ", fino al " + esc(D.ultima) : "") + ". Penalizzazioni e spareggi non sono contati.");
    },
    stat: function (D) {
      if (!D.stat) return messaggio("vuoto", "Statistiche non ancora disponibili per questo campionato.");
      var campi = D.stat.campi, dove = CAMP.vista;
      var righe = Object.keys(D.stat.squadre).map(function (sq) {
        var q = D.stat.squadre[sq], v = function (k) { return confValore(q, campi, k, dove === "t" ? "t" : dove); };
        var n = dove === "t" ? q.c.n + q.f.n : q[dove].n;
        return { sq: sq, n: n, gf: v("gf"), gs: v("gs"), xg: v("xg"), xga: v("xga"), tiri: v("tiri"), porta: v("porta"), pos: v("pos"), ang: v("ang"), gialli: v("gialli") };
      });
      return vistaChips() + tabCamp(D, righe, [["PG", "n"], ["Gol", "gf", -1, 2], ["Subiti", "gs", 1, 2], ["xG", "xg", -1, 2], ["xGA", "xga", 1, 2, "xG subiti"],
        ["Tiri", "tiri", -1, 1], ["In porta", "porta", -1, 1], ["Poss.", "pos", -1, "%"], ["Angoli", "ang", -1, 1], ["Gialli", "gialli", -1, 1]], ["xg", -1]) +
        notaPiccola("Medie a partita. Tocca il titolo di una colonna per ordinare.");
    },
    gol: function (D) {
      if (!D.gol) return messaggio("vuoto", "Nessun dato.");
      var righe = Object.keys(D.gol).map(function (sq) { var x = D.gol[sq][CAMP.vista]; return Object.assign({ sq: sq }, x); });
      return vistaChips() + tabCamp(D, righe, [["PG", "n"], ["Over 1,5", "o15", -1, "%"], ["Over 2,5", "o25", -1, "%"], ["Over 3,5", "o35", -1, "%"],
        ["Gol/Gol", "gg", -1, "%"], ["Inviolata", "cs", -1, "%", "Porta inviolata"], ["A secco", "fts", -1, "%", "Partite senza segnare"],
        ["Gol 1° t.", "gol_pt", -1, "%", "Partite con almeno un gol nel primo tempo"], ["Segna 1° t.", "segna_pt", -1, "%", "Partite in cui la squadra segna nel primo tempo"]], ["o25", -1]) +
        notaPiccola("Percentuale delle partite. Over e Gol/Gol contano i gol di tutte e due le squadre.");
    },

  function listaEloPartite(lista, sito) {

    var righe = lista.map(function (x) {
      var c = ELO.dati.per[String(x.ic)], o = ELO.dati.per[String(x.io)];
      var p = c && o ? eloProb(c.elo, o.elo, lg) : null;
      var pin = PIN_G.perId[String(x.id)] || null;
      var pp = pin ? [num(pin["P1 Shin"]), num(pin["PX Shin"]), num(pin["P2 Shin"])] : null;
      if (pp && pp.some(function (v) { return v == null; })) pp = null;
      var sc = null;
      if (p && pp) {
        var i = [0, 1, 2].reduce(function (a2, b2) { return Math.abs(p[b2] - pp[b2]) > Math.abs(p[a2] - pp[a2]) ? b2 : a2; }, 0);
        sc = { i: i, v: p[i] - pp[i] };
      }
      return { x: x, c: c, o: o, p: p, pin: pin, pp: pp, sc: sc };
    }).filter(function (r) {
      if (ELO.filtro === "sito" && !sito[String(r.x.id)]) return false;
      if (q && [r.x.casa, r.x.ospite, r.x.lega].join(" ").toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var ord = {
      ora: function (a, b) { return String(a.x.ora).localeCompare(String(b.x.ora)); },
      scarto: function (a, b) { return (b.sc ? Math.abs(b.sc.v) : -1) - (a.sc ? Math.abs(a.sc.v) : -1); },
      diff: function (a, b) { return (b.p ? Math.abs(b.c.elo - b.o.elo) : -1) - (a.p ? Math.abs(a.c.elo - a.o.elo) : -1); },
      fav: function (a, b) { return (b.p ? Math.max(b.p[0], b.p[2]) : -1) - (a.p ? Math.max(a.p[0], a.p[2]) : -1); }

      det.push("<p><b>" + esc(x.ospite) + "</b>: " + (r.o ? "Elo " + ev(r.o.elo) + " · " + r.o.pos + "° di " + ELO.dati.lista.length + (r.o.camp ? " · " + esc(r.o.camp) : "") : "non nello storico") + "</p>");

      // gia' "Pinnacle" accanto al margine (righe dei prezzi): niente doppione
      var giaTimbro = !!alto.querySelector(".timbro-pin");
      var giaFonte = !!(riga && riga.querySelector(".alto .fonte-q.pin"));
      if (giaTimbro && !soloFrecce && alto.querySelector(".mov-q")) return;
      alto.dataset.pinVisto = el.getAttribute("data-lc");
      var k = el.getAttribute("data-lc").split("|"), ora = "";
      Array.prototype.some.call(alto.children, function (c) { if (/^\s*\d{1,2}:\d{2}\s*$/.test(c.textContent)) { ora = c.textContent; return true; } return false; });
      var r = pinDi(k[0], k.slice(1).join("|"), ora);
      if (!r) {
        if (soloFrecce) return;
        // SENZA PINNACLE (128): niente timbro, ma se la partita ha il suo
        // numero in partite_api (nomi esattamente uguali) il dettaglio
        // mostra lo stesso la forma delle due squadre.
        var g = PIN_G.idNome[k[0] + "|" + k.slice(1).join("|")];
        var dt = riga ? riga.querySelector(":scope > details > .dettaglio") || riga.querySelector(".dettaglio") : null;
        if (g && dt && !riga.querySelector(".info-api") && !dt.querySelector(".pin-info")) {
          var bx = document.createElement("div");
          bx.className = "pin-info";
          dt.insertBefore(bx, dt.firstChild);
          formaFile(g.d).then(function (ff) {
            var h = formaBloccoHtml(formaDi(ff, g.id));
            if (h) bx.innerHTML = h; else bx.remove();
          });
        }
        return;
      }
      if (soloFrecce || giaTimbro) { aggiungiFrecce(alto, r, riga); return; }
      if (!giaFonte) {
        var span = document.createElement("span");
        span.innerHTML = timbroPin(r);
        var t = span.firstChild, primo = alto.firstElementChild;
        if (primo && primo.nextSibling) alto.insertBefore(t, primo.nextSibling); else alto.appendChild(t);
      }
      aggiungiFrecce(alto, r, riga);
      // Nel dettaglio della partita (le sezioni che non hanno gia' il
      // riquadro di il fornitore dei dati dei Pronostici): quote, margine,
      // probabilita' e movimento di Pinnacle, in cima.
      var det = riga.querySelector(":scope > details > .dettaglio") || riga.querySelector(".dettaglio");
      if (det && !riga.querySelector(".info-api") && !det.querySelector(".pin-info")) {
        var box = document.createElement("div");
        box.className = "pin-info";
        det.insertBefore(box, det.firstChild);
        pinExtra(r.Data).then(function (x) { box.innerHTML = pinInfoHtml(r, x, r.Data); })
          .catch(function () { box.innerHTML = pinInfoHtml(r, null, r.Data); })
          .then(function () { return formaFile(r.Data); })
          .then(function (ff) {
            var h = formaBloccoHtml(formaDi(ff, r.ID_API));
            if (h) box.insertAdjacentHTML("beforeend", h);
          });
      }
    });
  }
  // L'ELO SU OGNI CARD (140). Sotto i nomi delle squadre, in tutte le
  // sezioni con le card delle partite: Elo del sistema delle due squadre e
  // le sue probabilita' 1X2. La partita si trova come per il timbro
  // Pinnacle (nomi esattamente uguali in partite_api, o la riga Pinnacle),
  // le due squadre per NUMERO dal calendario del giorno (ic, io), il rating
  // per numero da elo_rating.json. Senza tutti e tre, niente riga.
  var ELO_CAL = {};
  // (143) LE CLASSIFICHE DI DEL FORNITORE DEI DATI (classifiche_api.json, apifootball.py):
  // per numero di squadra, prima nella lega della partita, altrimenti in
  // un'altra (nelle coppe: il campionato della squadra, detto quale).
  var CLASSI = null;
  function classificheApi() {
    if (!CLASSI) {
      CLASSI = leggiUrl(BASE + "classifiche_api.json?t=" + Math.floor(Date.now() / 600000), "classifiche_api")
        .catch(function () { return null; }).then(function (x) {
          var perLega = {}, perSq = {};
          var leghe = x && x.leghe ? x.leghe : {};
          Object.keys(leghe).forEach(function (li) {
            var v = leghe[li];
            if (!v || !Array.isArray(v.t)) return;
            var tab = perLega[li] = {};
            v.t.forEach(function (r) {
              var e = { li: li, n: v.n || "", pos: r[1], pt: r[2], g: r[3], dr: r[4], gr: r[5] || "", tot: v.t.length };
              tab[String(r[0])] = e;
              (perSq[String(r[0])] = perSq[String(r[0])] || []).push(e);
            });
          });
          return { perLega: perLega, perSq: perSq };
        });
    }
    return CLASSI;
  }
  function posizioneApi(cl, sq, li) {
    if (!cl || sq == null) return null;
    var e = li != null && cl.perLega[String(li)] ? cl.perLega[String(li)][String(sq)] : null;
    if (e) return { e: e, altra: false };
    var tutte = cl.perSq[String(sq)] || [];
    // in un'altra lega: quella con piu' squadre (il campionato, non un girone di coppa)
    tutte = tutte.slice().sort(function (a, b) { return b.tot - a.tot; });
    return tutte.length ? { e: tutte[0], altra: true } : null;
  }
  function etichettaPos(x) {
    if (!x) return null;
    var e = x.e, dove = "";
    if (x.altra) dove = " in " + String(e.gr || e.n).replace(/^[^:]*:\s*/, "");
    else if (e.gr && /gir|group|grupo|zona|conf/i.test(e.gr)) {
      var g = String(e.gr).replace(/^[^:]*:\s*/, "");
      // il girone si dice solo se il nome della lega non lo dice gia'
      if (String(e.n).toLowerCase().indexOf(g.toLowerCase()) < 0) dove = " (" + g + ")";
    }
    return e.pos + "° in classifica" + dove + (e.pt != null ? " · " + e.pt + " pt" : "");
  }
  function calendarioIds(d) {
    if (!ELO_CAL[d]) {
      ELO_CAL[d] = leggiUrl(BASE + "calendario_" + d + ".json?t=" + Math.floor(Date.now() / 600000), "calendario_" + d)
        .catch(function () { return []; }).then(function (l) {
          var per = {};
          (Array.isArray(l) ? l : []).forEach(function (x) { if (x && x.id != null && x.ic != null && x.io != null) per[String(x.id)] = [x.ic, x.io, x.li]; });
          return per;
        });
    }
    return ELO_CAL[d];
  }
  // (148) Se la riga dell'Elo non ci sta, il carattere si stringe quanto
  // basta (mai sotto i 9 pixel) invece di andare a capo o tagliarsi.
  // (155) I CARATTERI DEL SITO ARRIVANO DOPO: la misura fatta prima trovava
  // il testo piu' stretto di quello vero, e sul telefono l'Elo usciva a
  // destra. Si rimisura quando i caratteri sono pronti e quando cambia la
  // larghezza dello schermo.
  function rimisuraRighe() {
    $cont.querySelectorAll(".riga .sel.elo-mini").forEach(function (d) {
      d.style.fontSize = ""; d.style.whiteSpace = ""; d.style.overflow = "";
      stringiRiga(d);
    });
    $cont.querySelectorAll(".quote-pin .q3").forEach(function (q) {
      q.style.fontSize = ""; q.style.whiteSpace = "";
      stringiQ3(q.closest(".riga"));
    });
  }
  (function () {
    var t = null;
    var dopo = function () { clearTimeout(t); t = setTimeout(rimisuraRighe, 150); };
    try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(dopo); } catch (e) {}
    try { if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", dopo); } catch (e) {}
    window.addEventListener("resize", dopo);
    window.addEventListener("load", dopo);
  })();
  function stringiRiga(div) {
    requestAnimationFrame(function () {
      var w = div.clientWidth, sw = div.scrollWidth;
      if (!w || sw <= w + 1) return;
      var fs = parseFloat(getComputedStyle(div).fontSize) || 13;
      var nuovo = Math.floor(fs * w / sw * 10) / 10 - 0.2;
      // (151) dove la colonna e' troppo stretta (pagina Pinnacle: segno a
      // sinistra, percentuale a destra) il carattere diventerebbe
      // illeggibile: meglio due righe a grandezza normale.
      if (nuovo < 10.5) {
        // (152) colonna stretta (pagina Pinnacle): la riga dell'Elo scende
        // in fondo alla card, larga quanto la card dal bordo dei nomi in
        // poi, e si riprova. Solo se neanche cosi' ci sta, due righe.
        var sm = div.closest("summary"), corpo = div.closest(".corpo");
        if (sm && corpo && !div.classList.contains("elo-largo")) {
          var pl = parseFloat(getComputedStyle(sm).paddingLeft) || 0;
          var sx = corpo.getBoundingClientRect().left - sm.getBoundingClientRect().left - pl;
          sm.classList.add("con-elo-largo");
          div.classList.add("elo-largo");
          div.style.marginLeft = Math.max(0, Math.round(sx)) + "px";
          // (153) larga quanto resta, non il 100% piu' il margine (usciva a destra)
          div.style.flexBasis = "calc(100% - " + Math.max(0, Math.round(sx)) + "px)";
          sm.appendChild(div);
          stringiRiga(div);
          return;
        }
        div.style.whiteSpace = "normal";
        div.style.overflow = "visible";
        return;
      }
      div.style.fontSize = nuovo + "px";
    });
  }
  // (154) Le tre quote della pagina Pinnacle su una riga: se non ci stanno,
  // il carattere si stringe quanto basta (mai sotto i 10 pixel).
  function stringiQ3(riga) {
    var q3 = riga && riga.querySelector("summary .quote-pin .q3");
    if (!q3) return;
    requestAnimationFrame(function () {
      var w = q3.clientWidth, sw = q3.scrollWidth;
      if (!w || sw <= w + 1) return;
      var fs = parseFloat(getComputedStyle(q3).fontSize) || 13;
      var nuovo = Math.floor(fs * w / sw * 10) / 10 - 0.2;
      // schermo troppo stretto: si va a capo, ma solo fra una quota e l'altra
      if (nuovo < 10) { q3.style.whiteSpace = "normal"; return; }
      q3.style.fontSize = nuovo + "px";
    });
  }
  function timbraElo() {
    if (stato.sez === "elo" || stato.sez === "cal" || !ELO.dati || !ELO.info) return;
    var lg = ELO.info.logit;
    $cont.querySelectorAll("[data-lc]").forEach(function (el) {
      if (el.closest(".dettaglio") || el.closest(".dentro-partita")) return;
      var riga = el.closest(".riga") || el.closest(".scheda");
      if (!riga || riga.dataset.elo) return;
      var k = el.getAttribute("data-lc"), g = PIN_G.idNome[k], pin = PIN_G.perNome[k];
      var fid = g ? g.id : pin ? pin.ID_API : null, d = g ? g.d : pin ? pin.Data : null;
      if (fid == null || !d) return;
      riga.dataset.elo = "1";
      var dove = el.closest(".partita") || el;
      var detC = riga.classList.contains("compatta") ? riga.querySelector(".dettaglio") : null;
      var metti = function (ic, io) {
        var c = ELO.dati.per[String(ic)], o = ELO.dati.per[String(io)];
        if (!c || !o) return;
        var p = eloProb(c.elo, o.elo, lg);
        var div = document.createElement("div");
        div.className = "sel elo-mini";
        div.title = "Elo del sistema: " + c.nome + " " + Math.round(c.elo) + ", " + o.nome + " " + Math.round(o.elo);
        // (148) una riga sola: trattini stretti, scarto fra parentesi piccolo
        // (151) a capo solo fra un pezzo e l'altro, mai fra "1" e "55%"
        div.innerHTML = '<span class="nw">Elo ' + evCoppia(c.elo, o.elo, "\u2013") + ' <span class="piccolo">(' + (c.elo >= o.elo ? "+" : "\u2212") +
          f0(Math.abs(c.elo - o.elo)) + ")</span></span>" +
          // (172) le probabilita' dell'Elo sotto, con la loro etichetta:
          // accanto ai due rating sembravano quelle del mercato
          '<br><span class="piccolo">secondo l\u2019Elo</span> ' + '<span class="nw"><span class=nw><b class=seg>1</b> ' + pvE(p[0]) + '</span>' + "</span>\u2009· " +
          '<span class="nw"><span class=nw><b class=seg>X</b> ' + pvE(p[1]) + '</span>' + "</span>\u2009· " + '<span class="nw"><span class=nw><b class=seg>2</b> ' + pvE(p[2]) + '</span>' + "</span>";
        if (detC) { detC.insertBefore(div, detC.firstChild); return; }
        dove.parentNode.insertBefore(div, dove.nextSibling);
        stringiRiga(div);
      };
      if (pin && pin.ID_Casa != null && pin.ID_Ospite != null && String(pin.ID_API) === String(fid)) return metti(pin.ID_Casa, pin.ID_Ospite);
      calendarioIds(d).then(function (per) { var v = per[String(fid)]; if (v) metti(v[0], v[1]); });
    });
  }
  function avviaTimbri() {
    caricaPinGlobale().then(function () {
      timbraPinnacle();
      caricaElo().then(timbraElo).catch(function () {});
      var attesa = null;
      new MutationObserver(function () {
        if (attesa) return;
        attesa = setTimeout(function () { attesa = null; timbraPinnacle(); timbraElo(); }, 200);
      }).observe($cont, { childList: true, subtree: true });
    });
  }

  function avviaLive() {
    if (!URL_LIVE) return;
    // Le mappe di ieri (partite dopo mezzanotte), oggi e domani.
    Promise.all([-1, 0, 1].map(function (k) {
      return leggi("partite_api_" + giornoRoma(k) + ".json").catch(function () { return null; });
    })).then(function (m) {
      m.forEach(function (x) { if (x && typeof x === "object") for (var k in x) MAPPA_LIVE[k] = x[k]; });
      caricaLive();
    });
    // Ogni volta che la pagina si ridisegna le pillole si rimettono.
    var attesa = null;
    new MutationObserver(function () {
      if (attesa) return;
      attesa = setTimeout(function () { attesa = null; aggiornaLive(); }, 150);
    }).observe($cont, { childList: true, subtree: true });
    // Il ponte si aggiorna ogni 3 minuti: rileggerlo ogni minuto basta.
    setInterval(function () { if (!document.hidden) caricaLive(); }, 60000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) caricaLive(); });
  }

  // IL TEMA. Si ricorda la scelta su questo telefono (localStorage): e'
  // una comodita' di chi guarda, non un dato del sistema.
  function applicaTema(t) {
    document.documentElement.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", t === "light" ? "#f3f4ef" : "#080b12");
    try { localStorage.setItem("caltiki-tema", t); } catch (e) {}
  }
  document.getElementById("tema").addEventListener("click", function () {
    applicaTema(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light");
  });
  (function () {
    var m = document.querySelector('meta[name="theme-color"]');
    if (m && document.documentElement.getAttribute("data-theme") === "light") m.setAttribute("content", "#f3f4ef");
  })();

  // L'icona e' scritta una volta sola nella pagina: la favicon la riusa.
  try { document.getElementById("favicon").href = document.querySelector(".marchio img").src; } catch (e) {}

  // La rotella del mouse sopra una fila di tasti che non ci sta la fa
  // scorrere di lato invece di muovere la pagina. Se la fila ci sta tutta,
  // la rotella fa il suo lavoro normale.
  $cont.addEventListener("wheel", function (e) {
    var c = e.target.closest && e.target.closest(".chips");
    if (!c || c.scrollWidth <= c.clientWidth + 1) return;
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    var prima = c.scrollLeft;
    c.scrollLeft += e.deltaY;
    if (c.scrollLeft !== prima) e.preventDefault();
  }, { passive: false });

  leggiHash();
  disegna();
  avviaLive();
  avviaTimbri();
  leggi("footystatswdw_index.json").then(function (ix) {
    if (!ix || !Array.isArray(ix.date) || !ix.date.length) return;
    WDW_PRONTO = true;
    // La pagina e' gia' disegnata: si aggiunge il tasto dove serve.
    if (stato.sez === "prezzi" || stato.sez === "mercato") {
      var m = $cont.querySelector('[data-gruppo="mercato"]');
      if (m && !$cont.querySelector('[data-gruppo="wdw"]')) {
        var sez = stato.sez;
        var b = document.createElement("button");
        b.type = "button"; b.setAttribute("data-gruppo", "wdw"); b.setAttribute("aria-pressed", "false");
        b.textContent = "FootyStats";
        b.addEventListener("click", function () {
          if (!stato.data.wdw) stato.data.wdw = stato.data[sez];
          stato.sez = "wdw"; stato.cerca = ""; stato.limite = PASSO; disegna();
        });
        inserisciInOrdine(m.parentNode, b);
      }
    }
  }, function () { /* nessun dato: il tasto resta nascosto */ });
  // Sports Mole: stessa regola di FootyStats.
  leggi("sportsmole_index.json").then(function (ix) {
    if (!ix || !Array.isArray(ix.date) || !ix.date.length) return;
    SM_PRONTO = true;
    if (stato.sez === "prezzi" || stato.sez === "mercato" || stato.sez === "wdw") {
      var m = $cont.querySelector('[data-gruppo="mercato"]');
      if (m && !$cont.querySelector('[data-gruppo="sm"]')) {
        var sez = stato.sez;
        var b = document.createElement("button");
        b.type = "button"; b.setAttribute("data-gruppo", "sm"); b.setAttribute("aria-pressed", "false");
        b.textContent = "Sports Mole";
        b.addEventListener("click", function () {
          if (!stato.data.sm) stato.data.sm = stato.data[sez];
          stato.sez = "sm"; stato.cerca = ""; stato.limite = PASSO; disegna();
        });
        inserisciInOrdine(m.parentNode, b);
      }
    }
  }, function () { /* nessun dato: il tasto resta nascosto */ });
  // HeroPredict tolto l'11/11: ripete il mercato (tip = quota piu' corta
  // del book) e il job non gira piu'. La sezione resta nel codice ma senza
  // tasto; lo storico e' su gh-data.
  // Mosse Pinnacle: stessa regola.
  leggi("pinnacle_index.json").then(function (ix) {
    if (!ix || !Array.isArray(ix.date) || !ix.date.length) return;
    PIN_PRONTO = true;
    if (false) {                                   // dal 113 Pinnacle sta nella barra in alto
      var m = $cont.querySelector('[data-gruppo="mercato"]');
      if (m && !$cont.querySelector('[data-gruppo="pin"]')) {
        var sez = stato.sez;
        var b = document.createElement("button");
        b.type = "button"; b.setAttribute("data-gruppo", "pin"); b.setAttribute("aria-pressed", "false");
        b.textContent = "Mosse Pinnacle";
        b.addEventListener("click", function () {
          stato.sez = "pin"; stato.cerca = ""; stato.limite = PASSO; disegna();
        });
        inserisciInOrdine(m.parentNode, b);
      }
    }
  }, function () { /* nessun dato: il tasto resta nascosto */ });
})();
</script>

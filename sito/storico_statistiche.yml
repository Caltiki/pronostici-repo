name: Statistiche storiche (xG)

# LE STATISTICHE DELLE STAGIONI PASSATE (12/11), per il modello
# indipendente: xG, tiri, possesso, angoli... partita per partita, dei 30
# campionati piu' forti per Elo, ultime 3 stagioni. Si possono prendere
# solo finche' c'e' il piano PRO.
#
# Lo avvia l'orologio su Cloudflare (live/orologio.js) alle 00:07 UTC,
# appena API-Football azzera il conteggio del giorno: al massimo 800
# richieste per notte, e si ferma comunque se nel giorno ne restano 4000
# (per Pinnacle, il ponte live e il resto). Ogni notte riparte da dove si
# era fermato; quando ha finito non chiede piu' niente. A mano: Actions ->
# "Statistiche storiche (xG)" -> Run workflow.
#
# Salva in statistiche/ sul ramo privato elo-storico.
#
# (13/11) VENTI PARTITE PER RICHIESTA, e insieme alle statistiche anche
# eventi (gol, cartellini, cambi col minuto), giocatori (minuti, voto, tiri,
# passaggi...) e riepilogo (primo tempo, arbitro, moduli): cartelle
# eventi/, giocatori/, riepilogo/ accanto a statistiche/. Al massimo 800
# richieste (16.000 partite) per notte, e ci si ferma se nel giorno ne
# restano 4000.
#
# (13/11) IL CONFRONTO SQUADRE PER IL SITO: alla fine, sempre (anche le
# notti in cui non c'e' niente da scaricare), confronto_squadre.py fa le
# medie di stagione di ogni squadra in casa e fuori (gol, xG, tiri, tiri in
# porta, possesso, angoli, cartellini, falli) e le pubblica in
# squadre_stat.json sul ramo gh-data del sito. Solo quel file. Serve il
# secret TOKEN_REPO_DATI, lo stesso degli altri workflow che pubblicano.
on:
  workflow_dispatch:

concurrency:
  group: elo-storico
  cancel-in-progress: false

jobs:
  scarica:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RAMO: elo-storico
      REPO_DATI: Caltiki/pronostici-repo
      BRANCH_DATI: gh-data
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prendi lo storico
        id: storico
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          rm -rf storico
          if ! git ls-remote --exit-code --heads "$URL" "$RAMO" >/dev/null 2>&1; then
            echo "::error::Il ramo ${RAMO} non esiste: prima va scaricato lo storico."
            exit 1
          fi
          git clone -q --branch "$RAMO" --depth 1 "$URL" storico
          if [ ! -f storico/elo/rating_attuali.csv ] || [ ! -f storico/leghe.json ]; then
            echo "::error::Mancano elo/rating_attuali.csv o leghe.json: prima va lanciato 'Elo - calcolo e prova'."
            exit 1
          fi

      - name: Scarica le statistiche
        id: scarica
        timeout-minutes: 35
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python storico_statistiche.py --storico storico --massimo 800 --riserva 4000

      - name: Salva sul ramo elo-storico
        if: steps.scarica.outcome == 'success'
        run: |
          set -uo pipefail
          cd storico
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A statistiche eventi giocatori riepilogo
          if git diff --cached --quiet; then
            echo "Nessuna statistica nuova."
            exit 0
          fi
          git commit -q -m "Statistiche storiche $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git push -q origin "HEAD:${RAMO}" && { echo "Salvato in statistiche/ sul ramo ${RAMO}."; exit 0; }
            sleep 5
            git pull -q --rebase origin "${RAMO}" || true
          done
          echo "::error::Salvataggio non riuscito."
          exit 1

      # ---------------------------------------------------------------
      # (13/11) Confronto squadre per il sito
      # ---------------------------------------------------------------
      - name: Scarica i dati del sito
        id: clone
        if: always() && steps.storico.outcome == 'success'
        env:
          TOKEN_DATI: ${{ secrets.TOKEN_REPO_DATI }}
        run: |
          set -uo pipefail
          if [ -z "${TOKEN_DATI:-}" ]; then
            echo "::error::Secret TOKEN_REPO_DATI assente."
            exit 1
          fi
          URL="https://x-access-token:${TOKEN_DATI}@github.com/${REPO_DATI}"
          rm -rf ghdata
          if ! git ls-remote --exit-code --heads "$URL" "${BRANCH_DATI}" >/dev/null 2>&1; then
            echo "::error::${REPO_DATI} irraggiungibile o branch ${BRANCH_DATI} assente."
            exit 1
          fi
          git clone -q --branch "${BRANCH_DATI}" --depth 1 "$URL" ghdata

      - name: Calcola il confronto squadre
        id: confronto
        if: always() && steps.clone.outcome == 'success'
        run: |
          if [ ! -f confronto_squadre.py ]; then
            echo "::warning::confronto_squadre.py non e' nel repository: passo saltato."
            exit 1
          fi
          python confronto_squadre.py --storico storico --out ghdata/squadre_stat.json

      # (13/11) LA SEZIONE "CAMPIONATI" DEL SITO: un file per campionato
      # (classifica, statistiche, Over/Under, quando segna, giocatori, punti
      # attesi, forma, primo tempo e finale, angoli e cartellini, serie,
      # prossime partite, contro le quote), calcolati dallo storico.
      - name: Calcola i campionati
        id: campionati
        if: always() && steps.clone.outcome == 'success'
        run: |
          if [ ! -f campionati.py ]; then
            echo "::warning::campionati.py non e' nel repository: passo saltato."
            exit 0
          fi
          python campionati.py --storico storico --dati ghdata

      - name: Pubblica il confronto squadre e i campionati sul sito
        if: always() && (steps.confronto.outcome == 'success' || steps.campionati.outcome == 'success')
        env:
          TOKEN_DATI: ${{ secrets.TOKEN_REPO_DATI }}
        run: |
          set -uo pipefail
          URL="https://x-access-token:${TOKEN_DATI}@github.com/${REPO_DATI}"
          cd ghdata
          git config user.name "caltiki-bot"
          git config user.email "caltiki-bot@users.noreply.github.com"
          git remote remove origin 2>/dev/null || true
          git remote add origin "$URL"
          for f in 'squadre_stat.json' 'campionati_index.json' 'campionato_*.json'; do
            git add -A -- "$f" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
            exit 0
          fi
          git commit -q -m "Confronto squadre $(date -u +'%Y-%m-%d %H:%M') UTC"
          git stash -q --include-untracked || true
          for i in 1 2 3; do
            git pull -q --rebase origin "${BRANCH_DATI}" && git push -q origin "HEAD:${BRANCH_DATI}" && { echo "Pubblicato."; exit 0; }
            echo "push non riuscito, riprovo fra 15 secondi ($i/3)"
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "::error::Push su ${BRANCH_DATI} non riuscito dopo tre tentativi."
          exit 1
